(διανοίας). Der Gen. Pl. lautet immer -ῶν."],"ἡ φυγή — бегство":["ἡ φυγή — flight", "ἡ φυγή — Flucht"],"ἡ χώρα — страна, земля":["ἡ χώρα — land", "ἡ χώρα — Land"],"ἡ μοῦσα — муза":["ἡ μοῦσα — muse", "ἡ μοῦσα — Muse"],"ἡ διάνοια — мысль":["ἡ διάνοια — thought", "ἡ διάνοια — Gedanke"],"Первое склонение: мужской род на -ης, -ας":["First declension: masculine nouns in -ης, -ας", "Erste Deklination: Maskulina auf -ης, -ας"],"Мужской род отличается от женского только в ед. ч.: им. -ς, род. -ου (как во втором склонении). Зв. падеж у слов на -της — на -α (δέσποτα), у остальных на -η; у слов на -ας — на -α.":["Masculines differ from feminines only in the singular: nom. in -ς, gen. in -ου (as in the second declension). Nouns in -της have a vocative in -α (δέσποτα), others in -η; nouns in -ας have -α.", "Die Maskulina unterscheiden sich von den Feminina nur im Singular: Nom. auf -ς, Gen. auf -ου (wie in der zweiten Deklination). Wörter auf -της bilden den Vokativ auf -α (δέσποτα), andere auf -η; Wörter auf -ας auf -α."],"ὁ δεσπότης — господин":["ὁ δεσπότης — master", "ὁ δεσπότης — Herr"],"ὁ νεανίας — юноша":["ὁ νεανίας — young man", "ὁ νεανίας — junger Mann"],"Второе склонение: мужской и женский род на -ος, -ους":["Second declension: masculine (and feminine) nouns in -ος, -ους", "Zweite Deklination: Maskulina (und Feminina) auf -ος, -ους"],"Стяжённые слова (νοῦς < νόος) сливают гласную основы с окончанием; ударение циркумфлекс во всех падежах.":["Contracted nouns (νοῦς < νόος) merge the stem vowel with the ending; they have a circumflex in every case.", "Kontrahierte Wörter (νοῦς < νόος) verschmelzen den Stammvokal mit der Endung; sie tragen in allen Kasus den Zirkumflex."],"ὁ δοῦλος — раб":["ὁ δοῦλος — slave", "ὁ δοῦλος — Sklave"],"ὁ νοῦς — ум":["ὁ νοῦς — mind", "ὁ νοῦς — Verstand"],"Второе склонение: средний род на -ον, -ουν":["Second declension: neuter nouns in -ον, -ουν", "Zweite Deklination: Neutra auf -ον, -ουν"],"У среднего рода им., вин. и зв. совпадают; во мн. ч. они оканчиваются на -α. ὀστοῦν < ὀστέον, ὀστᾶ < ὀστέα.":["In the neuter the nom., acc. and voc. are identical; in the plural they end in -α. ὀστοῦν < ὀστέον, ὀστᾶ < ὀστέα.", "Im Neutrum sind Nom., Akk. und Vok. gleich; im Plural enden sie auf -α. ὀστοῦν < ὀστέον, ὀστᾶ < ὀστέα."],"τὸ δῶρον — дар":["τὸ δῶρον — gift", "τὸ δῶρον — Geschenk"],"τὸ ὀστοῦν — кость":["τὸ ὀστοῦν — bone", "τὸ ὀστοῦν — Knochen"],"Третье склонение: основы на губные и задненёбные":["Third declension: stems in a labial or velar stop", "Dritte Deklination: Labial- und Velarstämme"],"Основа видна в род. падеже: γυπ-ός, φυλακ-ός. Перед -ς и -σι губной согласный с σ даёт ψ, задненёбный — ξ: γύψ, γυψί; φύλαξ, φύλαξι.":["The stem shows in the genitive: γυπ-ός, φυλακ-ός. Before -ς and -σι a labial plus σ gives ψ, a velar gives ξ: γύψ, γυψί; φύλαξ, φύλαξι.", "Der Stamm zeigt sich im Genitiv: γυπ-ός, φυλακ-ός. Vor -ς und -σι ergibt Labial + σ ψ, Velar + σ ξ: γύψ, γυψί; φύλαξ, φύλαξι."],"-ς или нулевое":["-ς or zero", "-ς oder null"],"-α, -ν (м., ж.); = им. (ср.)":["-α, -ν (m., f.); = nom. (n.)", "-α, -ν (m., f.); = Nom. (n.)"],"= им. или основа":["= nom. or bare stem", "= Nom. oder reiner Stamm"],"-ες (м., ж.), -α (ср.)":["-ες (m., f.), -α (n.)", "-ες (m., f.), -α (n.)"],"-ας (м., ж.), -α (ср.)":["-ας (m., f.), -α (n.)", "-ας (m., f.), -α (n.)"],"= им.":["= nom.", "= Nom."],"ὁ γύψ — гриф":["ὁ γύψ — vulture", "ὁ γύψ — Geier"],"ὁ φύλαξ — страж":["ὁ φύλαξ — guard", "ὁ φύλαξ — Wächter"],"Третье склонение: основы на -ντ":["Third declension: stems in -ντ", "Dritte Deklination: Stämme auf -ντ"],"Перед -σι группа ντ выпадает, а гласная удлиняется: γιγαντ-σι → γίγασι, γεροντ-σι → γέρουσι.":["Before -σι the cluster ντ drops and the vowel is lengthened: γιγαντ-σι → γίγασι, γεροντ-σι → γέρουσι.", "Vor -σι fällt ντ aus und der Vokal wird gedehnt: γιγαντ-σι → γίγασι, γεροντ-σι → γέρουσι."],"ὁ γίγας — гигант":["ὁ γίγας — giant", "ὁ γίγας — Riese"],"ὁ γέρων — старик":["ὁ γέρων — old man", "ὁ γέρων — Greis"],"Третье склонение: основы на зубные":["Third declension: stems in a dental stop", "Dritte Deklination: Dentalstämme"],"Зубной согласный (τ, δ, θ) выпадает перед -ς и -σι: ἐλπιδ-ς → ἐλπίς, πραγματ-σι → πράγμασι. Слова на -μα всегда среднего рода. Если ударение на -ις не последнее (ἔρις), вин. ед. оканчивается на -ιν.":["A dental stop (τ, δ, θ) drops before -ς and -σι: ἐλπιδ-ς → ἐλπίς, πραγματ-σι → πράγμασι. Nouns in -μα are always neuter. If -ις is unaccented (ἔρις), the acc. sg. ends in -ιν.", "Ein Dental (τ, δ, θ) fällt vor -ς und -σι aus: ἐλπιδ-ς → ἐλπίς, πραγματ-σι → πράγμασι. Wörter auf -μα sind immer Neutra. Ist -ις unbetont (ἔρις), endet der Akk. Sg. auf -ιν."],"τὸ πρᾶγμα — дело, вещь":["τὸ πρᾶγμα — thing", "τὸ πρᾶγμα — Sache"],"ἡ ἐλπίς — надежда":["ἡ ἐλπίς — expectation, hope", "ἡ ἐλπίς — Erwartung, Hoffnung"],"ἡ ἔρις — распря":["ἡ ἔρις — strife", "ἡ ἔρις — Streit"],"ἡ ἐσθής — одежда":["ἡ ἐσθής — clothing", "ἡ ἐσθής — Kleidung"],"Третье склонение: основы на -ν":["Third declension: stems in -ν", "Dritte Deklination: Stämme auf -ν"],"ν выпадает перед -σι: ἀγῶσι, δαίμοσι. У ποιμήν и δαίμων чередование гласной (аблаут): ποιμεν-/ποιμην-, δαιμον-/δαιμων-.":["ν drops before -σι: ἀγῶσι, δαίμοσι. ποιμήν and δαίμων show vowel gradation (ablaut): ποιμεν-/ποιμην-, δαιμον-/δαιμων-.", "ν fällt vor -σι aus: ἀγῶσι, δαίμοσι. ποιμήν und δαίμων zeigen Ablaut: ποιμεν-/ποιμην-, δαιμον-/δαιμων-."],"ὁ ἀγών — состязание":["ὁ ἀγών — contest", "ὁ ἀγών — Wettkampf"],"ὁ ποιμήν — пастух":["ὁ ποιμήν — shepherd", "ὁ ποιμήν — Hirte"],"ὁ δαίμων — божество, дух":["ὁ δαίμων — spirit", "ὁ δαίμων — Gottheit, Geist"],"Третье склонение: основы на плавные (λ, ρ)":["Third declension: stems in a liquid (λ, ρ)", "Dritte Deklination: Liquidastämme (λ, ρ)"],"Основы на λ и ρ присоединяют окончания без изменений: ἁλ-σί, ῥητορ-σι.":["Stems in λ and ρ take the endings without change: ἁλ-σί, ῥητορ-σι.", "Stämme auf λ und ρ nehmen die Endungen unverändert an: ἁλ-σί, ῥητορ-σι."],"ὁ ἅλς — соль":["ὁ ἅλς — salt", "ὁ ἅλς — Salz"],"ὁ ῥήτωρ — оратор":["ὁ ῥήτωρ — orator", "ὁ ῥήτωρ — Redner"],"Третье склонение: основы на -(ε)ρ (тип πατήρ, ἀνήρ)":["Third declension: stems in -(ε)ρ (type πατήρ, ἀνήρ)", "Dritte Deklination: Stämme auf -(ε)ρ (Typ πατήρ, ἀνήρ)"],"Три ступени чередования: πατήρ — πατέρα — πατρός. У ἀνήρ между ν и ρ вставляется δ: ἀνδρός, ἀνδράσι.":["Three ablaut grades: πατήρ — πατέρα — πατρός. In ἀνήρ a δ is inserted between ν and ρ: ἀνδρός, ἀνδράσι.", "Drei Ablautstufen: πατήρ — πατέρα — πατρός. Bei ἀνήρ wird zwischen ν und ρ ein δ eingeschoben: ἀνδρός, ἀνδράσι."],"ὁ ἀνήρ — мужчина, муж":["ὁ ἀνήρ — man", "ὁ ἀνήρ — Mann"],"Третье склонение: основы на -σ (средний род на -ος, имена на -ης)":["Third declension: stems in -σ (neuters in -ος, names in -ης)", "Dritte Deklination: σ-Stämme (Neutra auf -ος, Namen auf -ης)"],"Интервокальное σ выпало, и гласные стянулись: γένε(σ)ος → γένους, γένε(σ)α → γένη. Имена собственные употребляются только в ед. ч.":["Intervocalic σ was lost and the vowels contracted: γένε(σ)ος → γένους, γένε(σ)α → γένη. Proper names occur only in the singular.", "Intervokalisches σ ist geschwunden, die Vokale wurden kontrahiert: γένε(σ)ος → γένους, γένε(σ)α → γένη. Eigennamen stehen nur im Singular."],"ὁ Σωκράτης — Сократ":["ὁ Σωκράτης — Socrates", "ὁ Σωκράτης — Sokrates"],"ὁ Περικλῆς — Перикл":["ὁ Περικλῆς — Pericles", "ὁ Περικλῆς — Perikles"],"Третье склонение: основы на -ι/-ε (тип πόλις)":["Third declension: stems in -ι/-ε (type πόλις)", "Dritte Deklination: Stämme auf -ι/-ε (Typ πόλις)"],"В им., вин. и зв. ед. ч. — основа на ι, в остальных падежах — на ε. Род. ед. -εως и род. мн. -εων имеют ударение на третьем слоге от конца, несмотря на долгое ω.":["The nom., acc. and voc. sg. have the stem in ι, the other cases the stem in ε. The gen. sg. -εως and gen. pl. -εων keep the accent on the antepenult despite the long ω.", "Nom., Akk. und Vok. Sg. haben den Stamm auf ι, die übrigen Kasus den Stamm auf ε. Gen. Sg. -εως und Gen. Pl. -εων behalten trotz langem ω den Akzent auf der drittletzten Silbe."],"Третье склонение: основы на -υ (тип ἰσχύς, πῆχυς)":["Third declension: stems in -υ (type ἰσχύς, πῆχυς)", "Dritte Deklination: Stämme auf -υ (Typ ἰσχύς, πῆχυς)"],"ἰσχύς сохраняет υ во всех падежах; πῆχυς чередует υ и ε, как πόλις.":["ἰσχύς keeps υ in all cases; πῆχυς alternates υ and ε, like πόλις.", "ἰσχύς behält υ in allen Kasus; πῆχυς wechselt zwischen υ und ε wie πόλις."],"ἡ ἰσχύς — сила":["ἡ ἰσχύς — strength", "ἡ ἰσχύς — Kraft"],"ὁ πῆχυς — локоть":["ὁ πῆχυς — forearm", "ὁ πῆχυς — Unterarm, Elle"],"Третье склонение: основы на -ηυ (тип βασιλεύς)":["Third declension: stems in -ηυ (type βασιλεύς)", "Dritte Deklination: Stämme auf -ηυ (Typ βασιλεύς)"],"Основа βασιλη(ϝ)-: дигамма выпала, отсюда βασιλέως, βασιλέα. Им. мн. в старой аттике — βασιλῆς, позже βασιλεῖς; позднее βασιλεῖς и в вин. мн.":["Stem βασιλη(ϝ)-: the digamma was lost, hence βασιλέως, βασιλέα. The nom. pl. is βασιλῆς in older Attic, later βασιλεῖς; later still βασιλεῖς also in the acc. pl.", "Stamm βασιλη(ϝ)-: das Digamma ist geschwunden, daher βασιλέως, βασιλέα. Der Nom. Pl. lautet im älteren Attisch βασιλῆς, später βασιλεῖς; noch später βασιλεῖς auch im Akk. Pl."],"ὁ βασιλεύς — царь":["ὁ βασιλεύς — king", "ὁ βασιλεύς — König"],"Прилагательные на -ος, -η/-α, -ον":["Adjectives in -ος, -η/-α, -ον", "Adjektive auf -ος, -η/-α, -ον"],"Мужской и средний род склоняются по второму склонению, женский — по первому. После ε, ι, ρ в женском роде α (δικαία), иначе η (δεινή).":["Masculine and neuter follow the second declension, feminine the first. After ε, ι, ρ the feminine has α (δικαία), otherwise η (δεινή).", "Maskulinum und Neutrum folgen der zweiten, das Femininum der ersten Deklination. Nach ε, ι, ρ hat das Femininum α (δικαία), sonst η (δεινή)."],"δεινός — страшный, искусный":["δεινός — impressive, terrible", "δεινός — gewaltig, schrecklich"],"δίκαιος — справедливый":["δίκαιος — just", "δίκαιος — gerecht"],"Прилагательные на -ων, -ουσα, -ον и πᾶς, πᾶσα, πᾶν":["Adjectives in -ων, -ουσα, -ον and πᾶς, πᾶσα, πᾶν", "Adjektive auf -ων, -ουσα, -ον und πᾶς, πᾶσα, πᾶν"],"Основа на -ντ: мужской и средний род по третьему склонению, женский по первому (как у причастий). Звательный совпадает с именительным.":["Stems in -ντ: masculine and neuter follow the third declension, feminine the first (like participles). The vocative equals the nominative.", "Stämme auf -ντ: Maskulinum und Neutrum folgen der dritten, das Femininum der ersten Deklination (wie die Partizipien). Der Vokativ gleicht dem Nominativ."],"ἑκών — добровольный":["ἑκών — willing", "ἑκών — freiwillig"],"πᾶς — весь, каждый":["πᾶς — every, whole, all", "πᾶς — jeder, ganz, all"],"Прилагательные на -υς, -εια, -υ":["Adjectives in -υς, -εια, -υ", "Adjektive auf -υς, -εια, -υ"],"Основа чередует υ и ε(ϝ): ἡδύς, ἡδέος; женский род на -εια склоняется по первому склонению с кратким α.":["The stem alternates υ and ε(ϝ): ἡδύς, ἡδέος; the feminine in -εια follows the first declension with short α.", "Der Stamm wechselt zwischen υ und ε(ϝ): ἡδύς, ἡδέος; das Femininum auf -εια folgt der ersten Deklination mit kurzem α."],"ἡδύς — сладкий, приятный":["ἡδύς — sweet", "ἡδύς — süß, angenehm"],"Прилагательные двух окончаний на -ης, -ες":["Adjectives of two endings in -ης, -ες", "Zweiendige Adjektive auf -ης, -ες"],"Основа на -σ (ἀληθεσ-): σ между гласными выпало, гласные стянулись: ἀληθέ(σ)ος → ἀληθοῦς. Мужской и женский род совпадают.":["Stem in -σ (ἀληθεσ-): σ between vowels was lost and the vowels contracted: ἀληθέ(σ)ος → ἀληθοῦς. Masculine and feminine are identical.", "σ-Stamm (ἀληθεσ-): σ zwischen Vokalen ist geschwunden, die Vokale wurden kontrahiert: ἀληθέ(σ)ος → ἀληθοῦς. Maskulinum und Femininum sind gleich."],"ἀληθής — истинный":["ἀληθής — true", "ἀληθής — wahr"],"м. и ж.":["m. and f.", "m. und f."],"Степени сравнения: суффиксы":["Comparison of adjectives: suffixes", "Steigerung der Adjektive: Suffixe"],"Обычные суффиксы: сравнительная -τερος, -τέρα, -τερον, превосходная -τατος, -τάτη, -τατον; они присоединяются к основе мужского рода (δικαιο-, μελαν-, σαφεσ-). Реже, прежде всего у шести прилагательных, — -ίων, -ιον и -ιστος, -ίστη, -ιστον, которые присоединяются к корню: κακ-, ἡδ-, ταχ-.":["The usual suffixes are comparative -τερος, -τέρα, -τερον and superlative -τατος, -τάτη, -τατον, added to the masculine stem (δικαιο-, μελαν-, σαφεσ-). Less often, above all with six adjectives, -ίων, -ιον and -ιστος, -ίστη, -ιστον are added to the root: κακ-, ἡδ-, ταχ-.", "Die gebräuchlichen Endungen sind im Komparativ -τερος, -τέρα, -τερον, im Superlativ -τατος, -τάτη, -τατον; sie treten an den Stamm des Maskulinums (δικαιο-, μελαν-, σαφεσ-). Seltener, vor allem bei sechs Adjektiven, treten -ίων, -ιον und -ιστος, -ίστη, -ιστον an die Wurzel: κακ-, ἡδ-, ταχ-."],"μέλας — чёрный":["μέλας — black", "μέλας — schwarz"],"σαφής — ясный":["σαφής — clear", "σαφής — deutlich"],"κακός — плохой":["κακός — bad", "κακός — schlecht"],"ἡδύς — приятный":["ἡδύς — pleasant", "ἡδύς — angenehm"],"ταχύς — быстрый":["ταχύς — swift", "ταχύς — schnell"],"ударная":["accented", "betont"],"безударная":["unaccented", "unbetont"],"Безударные формы (μου, μοι, με, σου, σοι, σε) — энклитики. Ударные ставятся после предлогов и при логическом ударении. Для 3-го лица в аттической прозе служат формы αὐτός (кроме им. падежа).":["The unaccented forms (μου, μοι, με, σου, σοι, σε) are enclitics. The accented forms are used after prepositions and for emphasis. For the 3rd person Attic prose uses the forms of αὐτός (except the nominative).", "Die unbetonten Formen (μου, μοι, με, σου, σοι, σε) sind Enklitika. Die betonten stehen nach Präpositionen und bei Hervorhebung. Für die 3. Person verwendet die attische Prosa die Formen von αὐτός (außer im Nominativ)."],"ἐγώ — я; ἡμεῖς — мы":["ἐγώ — I; ἡμεῖς — we", "ἐγώ — ich; ἡμεῖς — wir"],"σύ — ты; ὑμεῖς — вы":["σύ — you (sg.); ὑμεῖς — you (pl.)", "σύ — du; ὑμεῖς — ihr"],"Возвратные местоимения":["Reflexive pronouns", "Reflexivpronomina"],"Возвратные местоимения не имеют именительного падежа. Во мн. ч. 1-го и 2-го лица используются сочетания ἡμῶν αὐτῶν, ὑμῶν αὐτῶν. Краткие формы αὑτοῦ (с густым придыханием) стянуты из ἑαυτοῦ; не путать с αὐτοῦ.":["Reflexive pronouns have no nominative. In the plural of the 1st and 2nd person the phrases ἡμῶν αὐτῶν, ὑμῶν αὐτῶν are used. The short forms αὑτοῦ (with rough breathing) are contracted from ἑαυτοῦ; do not confuse them with αὐτοῦ.", "Reflexivpronomina haben keinen Nominativ. Im Plural der 1. und 2. Person stehen die Verbindungen ἡμῶν αὐτῶν, ὑμῶν αὐτῶν. Die Kurzformen αὑτοῦ (mit Spiritus asper) sind aus ἑαυτοῦ kontrahiert; nicht mit αὐτοῦ verwechseln."],"ἐμαυτοῦ — себя (1 л.)":["ἐμαυτοῦ — myself, ourselves", "ἐμαυτοῦ — mich selbst, uns selbst"],"σεαυτοῦ — себя (2 л.)":["σεαυτοῦ — yourself, yourselves", "σεαυτοῦ — dich selbst, euch selbst"],"ἑαυτοῦ — себя (3 л.)":["ἑαυτοῦ — himself, herself, itself; themselves", "ἑαυτοῦ — sich (3. Person)"],"Притяжательные местоимения":["Possessive pronouns", "Possessivpronomina"],"Притяжательные местоимения склоняются как прилагательные на -ος, -η/-α, -ον. Для 3-го лица ед. ч. особой формы нет: используется род. падеж αὐτοῦ, αὐτῆς.":["Possessives decline like adjectives in -ος, -η/-α, -ον. There is no special form for the 3rd person singular: the genitive αὐτοῦ, αὐτῆς is used.", "Possessivpronomina werden wie Adjektive auf -ος, -η/-α, -ον dekliniert. Für die 3. Person Singular gibt es keine eigene Form: man verwendet den Genitiv αὐτοῦ, αὐτῆς."],"мой, твой, наш, ваш, их":["my, your, our, your, their", "mein, dein, unser, euer, ihr"],"1 л.":["1st pers.", "1. Pers."],"2 л.":["2nd pers.", "2. Pers."],"3 л.":["3rd pers.", "3. Pers."],"Указательные местоимения":["Demonstrative pronouns", "Demonstrativpronomina"],"ὅδε — «вот этот (здесь)», указывает на ближайшее или на то, что последует; οὗτος — «этот», часто о только что сказанном; ἐκεῖνος — «тот (там)». ὅδε — это артикль с частицей -δε. У οὗτος корень меняется: τ- везде, кроме им. м. и ж. (οὗτος, αὕτη, οὗτοι, αὗται); ου в основе там, где в окончании о-звук, αυ — где α- или η-звук.":["ὅδε “this (here)” points to what is near or to what follows; οὗτος “this”, often to what has just been said; ἐκεῖνος “that (there)”. ὅδε is the article plus the particle -δε. In οὗτος the stem has τ- everywhere except the nom. masc. and fem. (οὗτος, αὕτη, οὗτοι, αὗται); it has ου where the ending has an o-sound, αυ where it has an α- or η-sound.", "ὅδε „dieser (hier)“ weist auf Nahes oder Folgendes; οὗτος „dieser“, oft auf eben Gesagtes; ἐκεῖνος „jener (dort)“. ὅδε ist der Artikel mit der Partikel -δε. Bei οὗτος hat der Stamm überall τ-, außer im Nom. m. und f. (οὗτος, αὕτη, οὗτοι, αὗται); ου steht, wo die Endung einen o-Laut hat, αυ bei α- oder η-Laut."],"ὅδε, ἥδε, τόδε — вот этот":["ὅδε, ἥδε, τόδε — this (here)", "ὅδε, ἥδε, τόδε — dieser (hier)"],"οὗτος, αὕτη, τοῦτο — этот":["οὗτος, αὕτη, τοῦτο — this, that", "οὗτος, αὕτη, τοῦτο — dieser"],"ἐκεῖνος, ἐκείνη, ἐκεῖνο — тот":["ἐκεῖνος, ἐκείνη, ἐκεῖνο — that (there)", "ἐκεῖνος, ἐκείνη, ἐκεῖνο — jener"],"Относительные местоимения":["Relative pronouns", "Relativpronomina"],"ὅς, ἥ, ὅ — «который»; отличается от артикля ударением и придыханием во всех формах. ὅστις, ἥτις, ὅ τι — «кто бы ни, всякий, кто»: склоняются обе части; рядом существуют краткие формы ὅτου, ὅτῳ, ὅτων, ὅτοις, ἅττα.":["ὅς, ἥ, ὅ “who, which”; it differs from the article by its accent and breathing in every form. ὅστις, ἥτις, ὅ τι “whoever, anyone who”: both parts decline; there are also short forms ὅτου, ὅτῳ, ὅτων, ὅτοις, ἅττα.", "ὅς, ἥ, ὅ „welcher, der“; es unterscheidet sich vom Artikel in allen Formen durch Akzent und Spiritus. ὅστις, ἥτις, ὅ τι „wer auch immer“: beide Teile werden dekliniert; daneben gibt es die Kurzformen ὅτου, ὅτῳ, ὅτων, ὅτοις, ἅττα."],"ὅς, ἥ, ὅ — который":["ὅς, ἥ, ὅ — who, which, that", "ὅς, ἥ, ὅ — welcher, der"],"ὅστις, ἥτις, ὅ τι — кто бы ни":["ὅστις, ἥτις, ὅ τι — whoever, anyone who", "ὅστις, ἥτις, ὅ τι — wer auch immer"],"м./ж.":["m./f.", "m./f."],"Вопросительное и неопределённое местоимение":["Interrogative and indefinite pronouns", "Interrogativ- und Indefinitpronomen"],"Вопросительное τίς, τί («кто? что? какой?») всегда имеет острое ударение на ι и не меняет его на тяжёлое. Неопределённое τις, τι («кто-то, некий») — энклитика, по форме отличается только ударением. Краткие формы: τοῦ, τῷ (вопросит.), του, τῳ (неопр.).":["The interrogative τίς, τί (“who? what? which?”) always has an acute on the ι and never turns it into a grave. The indefinite τις, τι (“someone, some”) is enclitic and differs only in accent. Short forms: τοῦ, τῷ (interrogative), του, τῳ (indefinite).", "Das Interrogativum τίς, τί („wer? was? welcher?“) hat immer den Akut auf dem ι und wandelt ihn nie in den Gravis. Das Indefinitum τις, τι („jemand, irgendein“) ist enklitisch und unterscheidet sich nur im Akzent. Kurzformen: τοῦ, τῷ (interrogativ), του, τῳ (indefinit)."],"τίς, τί — кто? что?":["τίς, τί — who? what?", "τίς, τί — wer? was?"],"τις, τι — кто-то, некий":["τις, τι — someone, something, some", "τις, τι — jemand, etwas, irgendein"],"Причастие настоящего времени":["Present participle", "Partizip Präsens"],"Действительное причастие: мужской и средний род склоняются по третьему склонению (основа φεροντ-), женский — по первому. В тексте Григория Богослова: φέρουσα (им. ед. ж.), σπουδάζοντας (вин. мн. м.), ῥέων (им. ед. м.), σκαῖρον (им. ед. ср.).":["Active participle: masculine and neuter follow the third declension (stem φεροντ-), feminine the first. In the text of Gregory of Nazianzus: φέρουσα (nom. sg. f.), σπουδάζοντας (acc. pl. m.), ῥέων (nom. sg. m.), σκαῖρον (nom. sg. n.).", "Aktives Partizip: Maskulinum und Neutrum folgen der dritten Deklination (Stamm φεροντ-), das Femininum der ersten. Im Text Gregors von Nazianz: φέρουσα (Nom. Sg. f.), σπουδάζοντας (Akk. Pl. m.), ῥέων (Nom. Sg. m.), σκαῖρον (Nom. Sg. n.)."],"φέρων — несущий":["φέρων — carrying", "φέρων — tragend"],"Степени сравнения":["Degrees of comparison", "Steigerung"],"Сравнительная степень: -τερος, -τέρα, -τερον; превосходная: -τατος, -τάτη, -τατον. Если предыдущий слог краткий, ο основы удлиняется в ω: σοφός → σοφώτερος, τίμιος → τιμιώτερος. Неправильные формы надо запомнить: βελτίων, μείζων, πλείων (ср. πλέον). В тексте Григория: τιμιωτέρα, βελτίους, συντομώτερον («короче»), εὐσεβεστέροις.":["Comparative: -τερος, -τέρα, -τερον; superlative: -τατος, -τάτη, -τατον. If the preceding syllable is short, the stem vowel ο is lengthened to ω: σοφός → σοφώτερος, τίμιος → τιμιώτερος. Irregular forms must be learnt: βελτίων, μείζων, πλείων (cf. πλέον). In Gregory’s text: τιμιωτέρα, βελτίους, συντομώτερον (“more briefly”), εὐσεβεστέροις.", "Komparativ: -τερος, -τέρα, -τερον; Superlativ: -τατος, -τάτη, -τατον. Ist die vorangehende Silbe kurz, wird das ο des Stammes zu ω gedehnt: σοφός → σοφώτερος, τίμιος → τιμιώτερος. Unregelmäßige Formen muss man lernen: βελτίων, μείζων, πλείων (vgl. πλέον). In Gregors Text: τιμιωτέρα, βελτίους, συντομώτερον („kürzer“), εὐσεβεστέροις."],"полож.":["positive", "Positiv"],"сравнит.":["comparative", "Komparativ"],"превосх.":["superlative", "Superlativ"],"гаплография":["haplography","Haplographie"],"Алфавит и чтение":["Alphabet and reading","Alphabet und Lesen"],"Буквы: от α до μ":["Letters: α to μ","Buchstaben: α bis μ"],"Учим буквы в византийском произношении: так читали в Константинополе в Средние века и так читают в греческой церкви сегодня. Это не школьное эразмово чтение. γ звучит как украинское «г», δ — как th в английском this, θ — как th в think.":["We learn the letters in Byzantine pronunciation: this is how they were read in Constantinople in the Middle Ages and how they are read in the Greek Church today. It is not the Erasmian school pronunciation. γ sounds like Ukrainian «г» (a voiced [ɣ]), δ like th in English this, θ like th in think.","Wir lernen die Buchstaben in byzantinischer Aussprache: So las man im mittelalterlichen Konstantinopel, und so liest man heute in der griechischen Kirche. Das ist nicht die erasmische Schulaussprache. γ klingt wie ein stimmhaftes [ɣ] (wie ukrainisches «г»), δ wie englisches th in this, θ wie th in think."],"ghámma · [ɣ], перед e, i — [j]":["ghámma · [ɣ], before e, i — [j]","ghámma · [ɣ], vor e, i — [j]"],"Какие две буквы этого урока звучат одинаково, как [i]?":["Which two letters of this lesson sound the same, like [i]?","Welche zwei Buchstaben dieser Lektion klingen gleich, wie [i]?"],"η и ι":["η and ι","η und ι"],"ε и η":["ε and η","ε und η"],"ζ и ι":["ζ and ι","ζ und ι"],"α и ε":["α and ε","α und ε"],"Это итацизм: в византийском произношении η и ι (а также υ, ει, οι) совпали в звуке [i].":["This is itacism: in Byzantine pronunciation η and ι (and also υ, ει, οι) merged into the sound [i].","Das ist der Itazismus: In der byzantinischen Aussprache fielen η und ι (ebenso υ, ει, οι) im Laut [i] zusammen."],"Как читается β в византийском произношении?":["How is β pronounced in Byzantine Greek?","Wie wird β in byzantinischer Aussprache gelesen?"],"Звонкие β, γ, δ стали щелевыми: [v], [ɣ], [ð].":["The voiced stops β, γ, δ became fricatives: [v], [ɣ], [ð].","Die stimmhaften Verschlusslaute β, γ, δ wurden zu Reibelauten: [v], [ɣ], [ð]."],"Буквы: от ν до ω":["Letters: ν to ω","Buchstaben: ν bis ω"],"Вторая половина алфавита. Обратите внимание: υ тоже читается как [i], а ο и ω не различаются по долготе.":["The second half of the alphabet. Note that υ is also read [i], and ο and ω no longer differ in length.","Die zweite Hälfte des Alphabets. Beachten Sie: Auch υ wird [i] gelesen, und ο und ω unterscheiden sich nicht mehr in der Länge."],"Когда пишут ς, а когда σ?":["When do you write ς and when σ?","Wann schreibt man ς und wann σ?"],"ς — только в конце слова":["ς — only at the end of a word","ς — nur am Wortende"],"ς — только в начале слова":["ς — only at the beginning of a word","ς — nur am Wortanfang"],"ς — после гласных":["ς — after vowels","ς — nach Vokalen"],"правила нет":["there is no rule","es gibt keine Regel"],"σῶσον: σ в начале и в середине слова. Χριστός: на конце — ς.":["σῶσον: σ at the beginning and in the middle of the word. Χριστός: at the end — ς.","σῶσον: σ am Anfang und in der Mitte des Wortes. Χριστός: am Ende — ς."],"Как звучат ο и ω в византийском чтении?":["How do ο and ω sound in Byzantine reading?","Wie klingen ο und ω in byzantinischer Lesung?"],"одинаково, [o]":["the same, [o]","gleich, [o]"],"ο — краткий звук, ω — долгий":["ο is short, ω is long","ο ist kurz, ω ist lang"],"ω не читается":["ω is silent","ω wird nicht gelesen"],"Какой звук передаёт χ?":["Which sound does χ represent?","Welchen Laut gibt χ wieder?"],"[x], как «х» в слове «хор»":["[x], like ch in Scottish loch","[x], wie ch in „Bach“"],"[k], как «к»":["[k], like k","[k], wie k"],"[tʃ], как «ч»":["[tʃ], like ch in church","[tʃ], wie tsch"],"[ks], как «кс»":["[ks], like x","[ks], wie x"],"Сочетания гласных и надстрочные знаки":["Vowel combinations and diacritics","Vokalverbindungen und diakritische Zeichen"],"В Средние века сочетания гласных читались как один звук. Придыхания и подписная йота пишутся, но не произносятся.":["In the Middle Ages vowel combinations were read as a single sound. Breathings and the iota subscript are written but not pronounced.","Im Mittelalter wurden Vokalverbindungen als ein einziger Laut gelesen. Spiritus und Iota subscriptum werden geschrieben, aber nicht gesprochen."],"[av] перед гласной и звонкой, иначе [af]":["[av] before a vowel or voiced consonant, otherwise [af]","[av] vor Vokal oder stimmhaftem Konsonanten, sonst [af]"],"[ev] перед гласной и звонкой, иначе [ef]":["[ev] before a vowel or voiced consonant, otherwise [ef]","[ev] vor Vokal oder stimmhaftem Konsonanten, sonst [ef]"],"густое придыхание — не читается":["rough breathing — not pronounced","Spiritus asper — wird nicht gesprochen"],"тонкое придыхание — не читается":["smooth breathing — not pronounced","Spiritus lenis — wird nicht gesprochen"],"подписная йота — не читается":["iota subscript — not pronounced","Iota subscriptum — wird nicht gesprochen"],"[ng], как в слове «ангел»":["[ng], as in angel","[ng], wie in „Engel“"],"Сколько разных звуков дают η, ι, υ, ει, οι в византийском чтении?":["How many different sounds do η, ι, υ, ει, οι give in Byzantine reading?","Wie viele verschiedene Laute ergeben η, ι, υ, ει, οι in byzantinischer Lesung?"],"один: [i]":["one: [i]","einen: [i]"],"два":["two","zwei"],"три":["three","drei"],"пять":["five","fünf"],"Как читается αὐτός?":["How is αὐτός read?","Wie wird αὐτός gelesen?"],"αυ перед глухой τ читается [af].":["αυ before voiceless τ is read [af].","αυ vor stimmlosem τ wird [af] gelesen."],"Как читается εὐλόγησον («благослови!»)?":["How is εὐλόγησον (“bless!”) read?","Wie wird εὐλόγησον („segne!“) gelesen?"],"ευ перед звонкой λ — [ev]; γ перед η — [j].":["ευ before voiced λ — [ev]; γ before η — [j].","ευ vor stimmhaftem λ — [ev]; γ vor η — [j]."],"Чтение слов":["Reading words","Wörter lesen"],"Читаем слова целиком. Транслитерация передаёт византийское произношение: dh = [ð], gh = [ɣ], th = [θ], ch = [x], y = [j]. Знак над гласной отмечает ударение.":["We read whole words. The transliteration shows Byzantine pronunciation: dh = [ð], gh = [ɣ], th = [θ], ch = [x], y = [j]. The accent mark shows the stressed vowel.","Wir lesen ganze Wörter. Die Umschrift zeigt die byzantinische Aussprache: dh = [ð], gh = [ɣ], th = [θ], ch = [x], y = [j]. Das Akzentzeichen markiert den betonten Vokal."],"Почему ἅγιος читается [áyios], а не [hágios]?":["Why is ἅγιος read [áyios] and not [hágios]?","Warum wird ἅγιος [áyios] und nicht [hágios] gelesen?"],"густое придыхание не читается, а γ перед ι звучит как [j]":["the rough breathing is silent, and γ before ι sounds like [j]","der Spiritus asper ist stumm, und γ vor ι klingt wie [j]"],"это ошибка новогреческого чтения":["it is a Modern Greek reading error","das ist ein neugriechischer Lesefehler"],"в церковном языке γ всегда звучит как [j]":["in church Greek γ always sounds like [j]","im Kirchengriechisch klingt γ immer wie [j]"],"ἅ обозначает долгое [a]":["ἅ marks a long [a]","ἅ bezeichnet ein langes [a]"],"Первые слова: молитвы":["First words: prayers","Erste Wörter: Gebete"],"Господи, помилуй":["Lord, have mercy","Herr, erbarme dich"],"Самые частые слова богослужения. Трисвятое поётся на каждой литургии; разберём его по словам.":["The most frequent words of the services. The Trisagion is sung at every liturgy; let us take it apart word by word.","Die häufigsten Wörter des Gottesdienstes. Das Trishagion wird in jeder Liturgie gesungen; wir zerlegen es Wort für Wort."],"ἀ-θάνατος: θάνατος значит «смерть». Что значит начальное ἀ-?":["ἀ-θάνατος: θάνατος means “death”. What does the initial ἀ- mean?","ἀ-θάνατος: θάνατος bedeutet „Tod“. Was bedeutet das anlautende ἀ-?"],"отрицание: «не-, без-»":["negation: “un-, -less”","Verneinung: „un-, -los“"],"усиление: «очень»":["intensification: “very”","Verstärkung: „sehr“"],"направление: «к»":["direction: “towards”","Richtung: „zu“"],"повтор: «снова»":["repetition: “again”","Wiederholung: „wieder“"],"Это так называемая альфа привативная: ἀ-θάνατος «бессмертный», ἀ-σεβής «нечестивый».":["This is the so-called alpha privative: ἀ-θάνατος “immortal”, ἀ-σεβής “ungodly”.","Das ist das sogenannte Alpha privativum: ἀ-θάνατος „unsterblich“, ἀ-σεβής „gottlos“."],"ектения":["litany","Litanei"],"Трисвятое":["Trisagion","Trishagion"],"Как и Ἅγιος, это именительный падеж: «Святый Бессмертный».":["Like Ἅγιος, this is the nominative: “Holy Immortal”.","Wie Ἅγιος ist dies Nominativ: „Heiliger Unsterblicher“."],"Иисусова молитва":["Jesus Prayer","Jesusgebet"],"Молитва исихастов, одна из главных в византийской монашеской традиции. В ней звательный падеж: обращение к лицу.":["The prayer of the Hesychasts, one of the central prayers of the Byzantine monastic tradition. It contains the vocative case: addressing a person.","Das Gebet der Hesychasten, eines der zentralen Gebete der byzantinischen Mönchstradition. Es enthält den Vokativ: die Anrede einer Person."],"Κύριε, Χριστέ, Υἱέ — какой это падеж?":["Κύριε, Χριστέ, Υἱέ — which case is this?","Κύριε, Χριστέ, Υἱέ — welcher Kasus ist das?"],"звательный":["vocative","Vokativ"],"именительный":["nominative","Nominativ"],"родительный":["genitive","Genitiv"],"винительный":["accusative","Akkusativ"],"У слов на -ος звательный падеж оканчивается на -ε: Χριστός → Χριστέ.":["In words in -ος the vocative ends in -ε: Χριστός → Χριστέ.","Bei Wörtern auf -ος endet der Vokativ auf -ε: Χριστός → Χριστέ."],"Почему в ἐλέησόν με два ударения?":["Why does ἐλέησόν με have two accents?","Warum hat ἐλέησόν με zwei Akzente?"],"за словом стоит энклитика με":["the word is followed by the enclitic με","auf das Wort folgt das Enklitikon με"],"это поэтическая форма":["it is a poetic form","es ist eine poetische Form"],"так пишется повелительное наклонение":["this is how the imperative is written","so schreibt man den Imperativ"],"это ошибка переписчика":["it is a scribal error","es ist ein Schreiberfehler"],"Энклитики (με, μου, σου, ἐστι) не имеют своего ударения и дают второе ударение предыдущему слову.":["Enclitics (με, μου, σου, ἐστι) have no accent of their own and give a second accent to the preceding word.","Enklitika (με, μου, σου, ἐστι) haben keinen eigenen Akzent und geben dem vorhergehenden Wort einen zweiten Akzent."],"«Сын (кого?) Божий» — родительный падеж: τοῦ Θεοῦ.":["“Son (of whom?) of God” — genitive: τοῦ Θεοῦ.","„Sohn (wessen?) Gottes“ — Genitiv: τοῦ Θεοῦ."],"Мф 16:16":["Mt 16:16","Mt 16,16"],"Слава и мир":["Glory and peace","Ehre und Friede"],"Малое славословие завершает почти каждый псалом и молитву. Здесь появляется дательный падеж: «слава (кому?)».":["The Lesser Doxology ends almost every psalm and prayer. Here the dative appears: “glory (to whom?)”.","Die Kleine Doxologie beschließt fast jeden Psalm und jedes Gebet. Hier erscheint der Dativ: „Ehre (wem?)“."],"εἰς τοὺς αἰῶνας τῶν αἰώνων — дословно:":["εἰς τοὺς αἰῶνας τῶν αἰώνων — literally:","εἰς τοὺς αἰῶνας τῶν αἰώνων — wörtlich:"],"«в века веков»":["“to the ages of ages”","„in die Zeitalter der Zeitalter“"],"«в начале времён»":["“at the beginning of time”","„am Anfang der Zeit“"],"«каждый день»":["“every day”","„jeden Tag“"],"«до конца дня»":["“until the end of the day”","„bis zum Ende des Tages“"],"Славянское «во веки веков» — точная калька с греческого.":["The Slavonic «во веки веков» (and Latin in saecula saeculorum) is an exact calque of the Greek.","Das slavische «во веки веков» (und lateinisch in saecula saeculorum) ist eine genaue Lehnübersetzung des Griechischen."],"Дательный падеж: «слава (кому?) Отцу и Сыну и Святому Духу».":["Dative: “glory (to whom?) to the Father and to the Son and to the Holy Spirit”.","Dativ: „Ehre (wem?) dem Vater und dem Sohn und dem Heiligen Geist“."],"Малое славословие":["Lesser Doxology","Kleine Doxologie"],"Пасхальный тропарь":["Paschal Troparion","Ostertroparion"],"литургия":["liturgy","Liturgie"],"Артикль и второе склонение":["The article and the second declension","Artikel und zweite Deklination"],"Артикль":["The article","Der Artikel"],"Артикль ὁ, ἡ, τό показывает род, число и падеж существительного. По нему можно узнать форму, даже если слово незнакомо.":["The article ὁ, ἡ, τό shows the gender, number and case of a noun. It lets you recognise the form even if the word is unfamiliar.","Der Artikel ὁ, ἡ, τό zeigt Genus, Numerus und Kasus eines Substantivs. An ihm erkennt man die Form, auch wenn das Wort unbekannt ist."],"Какой артикль у слова ὁδός («путь»)?":["Which article does ὁδός (“way”) take?","Welchen Artikel hat ὁδός („Weg“)?"],"ὁδός — женского рода, хотя оканчивается на -ος. Род виден по артиклю: ἡ ὁδός.":["ὁδός is feminine, although it ends in -ος. The gender shows in the article: ἡ ὁδός.","ὁδός ist feminin, obwohl es auf -ος endet. Das Genus zeigt der Artikel: ἡ ὁδός."],"τὸ φῶς — какого рода?":["τὸ φῶς — which gender?","τὸ φῶς — welches Genus?"],"среднего":["neuter","Neutrum"],"мужского":["masculine","Maskulinum"],"женского":["feminine","Femininum"],"общего":["common","Utrum"],"τῶν ἀνθρώπων — какой падеж?":["τῶν ἀνθρώπων — which case?","τῶν ἀνθρώπων — welcher Kasus?"],"родительный, мн. ч.":["genitive plural","Genitiv Plural"],"дательный, мн. ч.":["dative plural","Dativ Plural"],"винительный, ед. ч.":["accusative singular","Akkusativ Singular"],"именительный, мн. ч.":["nominative plural","Nominativ Plural"],"Подлежащее стоит в именительном падеже: ὁ λόγος.":["The subject is in the nominative: ὁ λόγος.","Das Subjekt steht im Nominativ: ὁ λόγος."],"Ин 1:1":["Jn 1:1","Joh 1,1"],"πρός здесь требует винительного падежа: πρὸς τὸν Θεόν.":["Here πρός takes the accusative: πρὸς τὸν Θεόν.","πρός steht hier mit dem Akkusativ: πρὸς τὸν Θεόν."],"Быт 1:1":["Gen 1:1","Gen 1,1"],"Ин 1:4":["Jn 1:4","Joh 1,4"],"Падежи второго склонения":["Cases of the second declension","Kasus der zweiten Deklination"],"Второе склонение: слова на -ος (обычно мужского рода) и на -ον (среднего). Окончание показывает роль слова в предложении.":["Second declension: words in -ος (usually masculine) and -ον (neuter). The ending shows the word’s role in the sentence.","Zweite Deklination: Wörter auf -ος (meist maskulin) und auf -ον (neutral). Die Endung zeigt die Rolle des Wortes im Satz."],"Окончание дательного падежа ед. ч. второго склонения:":["The dative singular ending of the second declension:","Die Endung des Dativ Singular der zweiten Deklination:"],"τοὺς λόγους — какой падеж?":["τοὺς λόγους — which case?","τοὺς λόγους — welcher Kasus?"],"винительный, мн. ч.":["accusative plural","Akkusativ Plural"],"«Свет (чего?) мира» — родительный падеж.":["“Light (of what?) of the world” — genitive.","„Licht (wessen?) der Welt“ — Genitiv."],"Ин 8:12":["Jn 8:12","Joh 8,12"],"Подлежащее — средний род мн. ч.: τὰ ἔργα. Глагол при нём стоит в ед. ч., это обычное греческое правило.":["The subject is a neuter plural: τὰ ἔργα. Its verb stands in the singular, a regular Greek rule.","Das Subjekt ist ein Neutrum Plural: τὰ ἔργα. Das Verb steht dabei im Singular, eine reguläre griechische Regel."],"Пс 103:24":["Ps 103:24","Ps 103,24"],"Дательный падеж орудия: «смертью (чем?) смерть попрал».":["Dative of instrument: “by death (by what?) he trampled death”.","Dativus instrumenti: „durch den Tod (womit?) hat er den Tod zertreten“."],"ἐν всегда с дательным падежом: ἐν τοῖς οὐρανοῖς.":["ἐν always takes the dative: ἐν τοῖς οὐρανοῖς.","ἐν steht immer mit dem Dativ: ἐν τοῖς οὐρανοῖς."],"Мф 6:9":["Mt 6:9","Mt 6,9"],"«Быть» и настоящее время":["“To be” and the present tense","„Sein“ und das Präsens"],"Глагол «быть»":["The verb “to be”","Das Verb „sein“"],"Глагол εἰμί неправильный, но встречается постоянно. ἐστί и ἐστίν — одна и та же форма: ν на конце добавляется перед гласной и в конце фразы.":["The verb εἰμί is irregular but appears constantly. ἐστί and ἐστίν are the same form: ν is added at the end before a vowel and at the end of a sentence.","Das Verb εἰμί ist unregelmäßig, kommt aber ständig vor. ἐστί und ἐστίν sind dieselbe Form: ν wird vor Vokal und am Satzende angefügt."],"Почему в Ὁ Θεὸς ἀγάπη ἐστίν у ἀγάπη нет артикля?":["Why does ἀγάπη have no article in Ὁ Θεὸς ἀγάπη ἐστίν?","Warum hat ἀγάπη in Ὁ Θεὸς ἀγάπη ἐστίν keinen Artikel?"],"это сказуемое: «любовь» — то, чем является Бог":["it is the predicate: “love” is what God is","es ist das Prädikat: „Liebe“ ist, was Gott ist"],"артикль выпал при переписке":["the article was lost in copying","der Artikel ging beim Abschreiben verloren"],"ἀγάπη — имя собственное":["ἀγάπη is a proper name","ἀγάπη ist ein Eigenname"],"после ἐστίν артикль запрещён":["the article is forbidden after ἐστίν","nach ἐστίν ist der Artikel verboten"],"Подлежащее обычно с артиклем, именная часть сказуемого — без него. Ср. Θεὸς ἦν ὁ λόγος (Ин 1:1).":["The subject usually has the article, the predicate noun does not. Compare Θεὸς ἦν ὁ λόγος (Jn 1:1).","Das Subjekt hat gewöhnlich den Artikel, das Prädikatsnomen nicht. Vgl. Θεὸς ἦν ὁ λόγος (Joh 1,1)."],"Ин 14:6":["Jn 14:6","Joh 14,6"],"1 Ин 4:8":["1 Jn 4:8","1 Joh 4,8"],"Ин 10:11":["Jn 10:11","Joh 10,11"],"ἦν — имперфект: «был, была, было».":["ἦν is the imperfect: “he, she, it was”.","ἦν ist das Imperfekt: „er, sie, es war“."],"Настоящее время":["The present tense","Das Präsens"],"Окончания настоящего времени: -ω, -εις, -ει, -ομεν, -ετε, -ουσι(ν). У глаголов на -έω гласные сливаются: ποιέω → ποιῶ.":["Present endings: -ω, -εις, -ει, -ομεν, -ετε, -ουσι(ν). In verbs in -έω the vowels contract: ποιέω → ποιῶ.","Präsensendungen: -ω, -εις, -ει, -ομεν, -ετε, -ουσι(ν). Bei Verben auf -έω verschmelzen die Vokale: ποιέω → ποιῶ."],"Окончание 3 л. мн. ч. настоящего времени:":["The 3rd person plural present ending:","Die Endung der 3. Person Plural Präsens:"],"ποιῶ — стяжённая форма от:":["ποιῶ is the contracted form of:","ποιῶ ist die kontrahierte Form von:"],"Символ веры":["Nicene Creed","Glaubensbekenntnis"],"1 л. ед. ч.: окончание -ω.":["1st person singular: ending -ω.","1. Person Singular: Endung -ω."],"Пс 50:5":["Ps 50:5","Ps 50,5"],"3 л. ед. ч.: окончание -ει.":["3rd person singular: ending -ει.","3. Person Singular: Endung -ει."],"Пс 22:1":["Ps 22:1","Ps 22,1"],"Апофтегмы, Моисей 6":["Apophthegmata, Moses 6","Apophthegmata, Moses 6"],"Ин 1:5":["Jn 1:5","Joh 1,5"],"Первое склонение и местоимения":["First declension and pronouns","Erste Deklination und Pronomen"],"Первое склонение":["First declension","Erste Deklination"],"Первое склонение — в основном женский род на -η и -α. После ε, ι, ρ сохраняется α: ἡμέρα, ἡμέρας; в остальных случаях η: ψυχή, ψυχῆς.":["The first declension is mainly feminine in -η and -α. After ε, ι, ρ the α is kept: ἡμέρα, ἡμέρας; otherwise η: ψυχή, ψυχῆς.","Die erste Deklination umfasst vor allem Feminina auf -η und -α. Nach ε, ι, ρ bleibt α erhalten: ἡμέρα, ἡμέρας; sonst η: ψυχή, ψυχῆς."],"Как склоняется ἡμέρα в ед. ч. (им., род., дат., вин.)?":["How is ἡμέρα declined in the singular (nom., gen., dat., acc.)?","Wie wird ἡμέρα im Singular dekliniert (Nom., Gen., Dat., Akk.)?"],"После ρ α сохраняется во всех падежах единственного числа.":["After ρ the α is kept in all cases of the singular.","Nach ρ bleibt α in allen Kasus des Singulars erhalten."],"τῆς ψυχῆς — какой падеж?":["τῆς ψυχῆς — which case?","τῆς ψυχῆς — welcher Kasus?"],"дательный":["dative","Dativ"],"Мф 6:10":["Mt 6:10","Mt 6,10"],"τῇ καρδίᾳ — дательный отношения: «чистые (чем?) сердцем».":["τῇ καρδίᾳ is a dative of respect: “pure (in what?) in heart”.","τῇ καρδίᾳ ist ein Dativ der Beziehung: „rein (worin?) im Herzen“."],"Мф 5:8":["Mt 5:8","Mt 5,8"],"Лк 2:14":["Lk 2:14","Lk 2,14"],"Прямое дополнение стоит в винительном падеже.":["The direct object is in the accusative.","Das direkte Objekt steht im Akkusativ."],"Пс 22:3":["Ps 22:3","Ps 22,3"],"Мф 5:6":["Mt 5:6","Mt 5,6"],"Отче наш":["The Lord’s Prayer","Das Vaterunser"],"Молитва Господня по византийскому тексту. Главное в уроке — местоимения: ἡμεῖς «мы», ἡμῶν «наш», ἡμῖν «нам», ἡμᾶς «нас».":["The Lord’s Prayer in the Byzantine text. The main topic of the lesson is pronouns: ἡμεῖς “we”, ἡμῶν “our”, ἡμῖν “to us”, ἡμᾶς “us”.","Das Vaterunser im byzantinischen Text. Hauptthema der Lektion sind die Pronomen: ἡμεῖς „wir“, ἡμῶν „unser“, ἡμῖν „uns“ (Dativ), ἡμᾶς „uns“ (Akkusativ)."],"Πάτερ — какой падеж?":["Πάτερ — which case?","Πάτερ — welcher Kasus?"],"Именительный — πατήρ, звательный — πάτερ.":["The nominative is πατήρ, the vocative πάτερ.","Der Nominativ ist πατήρ, der Vokativ πάτερ."],"В Мф 6:12 византийский текст читает ἀφίεμεν. Какое это время?":["In Mt 6:12 the Byzantine text reads ἀφίεμεν. Which tense is it?","In Mt 6,12 liest der byzantinische Text ἀφίεμεν. Welches Tempus ist das?"],"настоящее: «прощаем»":["present: “we forgive”","Präsens: „wir erlassen“"],"аорист: «простили»":["aorist: “we forgave”","Aorist: „wir erließen“"],"будущее: «простим»":["future: “we will forgive”","Futur: „wir werden erlassen“"],"перфект: «простили»":["perfect: “we have forgiven”","Perfekt: „wir haben erlassen“"],"В критических изданиях стоит аорист ἀφήκαμεν. Церковный текст сохраняет настоящее время.":["The critical editions have the aorist ἀφήκαμεν. The ecclesiastical text keeps the present.","Die kritischen Ausgaben haben den Aorist ἀφήκαμεν. Der kirchliche Text bewahrt das Präsens."],"«Дай (кому?) нам» — дательный падеж.":["“Give (to whom?) to us” — dative.","„Gib (wem?) uns“ — Dativ."],"Мф 6:11":["Mt 6:11","Mt 6,11"],"Мф 6:12":["Mt 6:12","Mt 6,12"],"Прямое дополнение — винительный падеж: ἡμᾶς.":["The direct object is in the accusative: ἡμᾶς.","Das direkte Objekt steht im Akkusativ: ἡμᾶς."],"Мф 6:13":["Mt 6:13","Mt 6,13"],"Третье склонение":["The third declension","Die dritte Deklination"],"Основы на согласный":["Consonant stems","Konsonantenstämme"],"Третье склонение самое разнообразное. Именительный падеж часто прячет основу, поэтому слово учат в двух формах. Основа видна в родительном: νύξ, νυκτ-ός; σάρξ, σαρκ-ός; γέρων, γέροντ-ος. Окончания ед. ч.: -ος, -ι, -α; мн. ч.: -ες, -ων, -σι(ν), -ας.":["The third declension is the most varied. The nominative often hides the stem, so each word is learned in two forms. The stem appears in the genitive: νύξ, νυκτ-ός; σάρξ, σαρκ-ός; γέρων, γέροντ-ος. Singular endings: -ος, -ι, -α; plural: -ες, -ων, -σι(ν), -ας.","Die dritte Deklination ist die vielfältigste. Der Nominativ verdeckt oft den Stamm, darum lernt man jedes Wort in zwei Formen. Der Stamm zeigt sich im Genitiv: νύξ, νυκτ-ός; σάρξ, σαρκ-ός; γέρων, γέροντ-ος. Endungen im Singular: -ος, -ι, -α; im Plural: -ες, -ων, -σι(ν), -ας."],"Как найти основу слова третьего склонения?":["How do you find the stem of a third-declension noun?","Wie findet man den Stamm eines Wortes der dritten Deklination?"],"отбросить -ος в родительном падеже":["drop -ος from the genitive","-ος im Genitiv abtrennen"],"отбросить последнюю букву именительного":["drop the last letter of the nominative","den letzten Buchstaben des Nominativs abtrennen"],"взять винительный падеж":["take the accusative","den Akkusativ nehmen"],"основа всегда равна именительному":["the stem always equals the nominative","der Stamm ist immer gleich dem Nominativ"],"νύξ → νυκτός → основа νυκτ-; ἄρχων → ἄρχοντος → ἀρχοντ-.":["νύξ → νυκτός → stem νυκτ-; ἄρχων → ἄρχοντος → ἀρχοντ-.","νύξ → νυκτός → Stamm νυκτ-; ἄρχων → ἄρχοντος → ἀρχοντ-."],"Окончание дательного падежа мн. ч. третьего склонения:":["The dative plural ending of the third declension:","Die Endung des Dativ Plural der dritten Deklination:"],"ἐκ + родительный падеж. Основа πατρ- видна только в косвенных падежах.":["ἐκ + genitive. The stem πατρ- appears only in the oblique cases.","ἐκ + Genitiv. Der Stamm πατρ- zeigt sich nur in den obliquen Kasus."],"При ἐγένετο «стал» именная часть стоит в именительном падеже.":["With ἐγένετο “became” the predicate noun is in the nominative.","Bei ἐγένετο „wurde“ steht das Prädikatsnomen im Nominativ."],"Ин 1:14":["Jn 1:14","Joh 1,14"],"Родительный времени: ἡμέρας καὶ νυκτός «днём и ночью».":["Genitive of time: ἡμέρας καὶ νυκτός “by day and by night”.","Genitiv der Zeit: ἡμέρας καὶ νυκτός „bei Tag und bei Nacht“."],"Пс 1:2":["Ps 1:2","Ps 1,2"],"εἰς + винительный: τοὺς αἰῶνας. Сразу за ним родительный мн. ч. τῶν αἰώνων.":["εἰς + accusative: τοὺς αἰῶνας. Right after it comes the genitive plural τῶν αἰώνων.","εἰς + Akkusativ: τοὺς αἰῶνας. Unmittelbar danach folgt der Genitiv Plural τῶν αἰώνων."],"Пс 140:2":["Ps 140:2","Ps 140,2"],"Средний род, -ις и -ευς":["Neuters, -ις and -ευς","Neutra, -ις und -ευς"],"Слова среднего рода на -μα склоняются с основой на -ματ-: ὄνομα, ὀνόματος. Слова на -ις меняют основу: πόλις, πόλεως. Слова на -ευς: βασιλεύς, βασιλέως — так в византийских документах называют императора. Средний род на -ος (γένος, ἔτος) даёт родительный на -ους.":["Neuter nouns in -μα decline with a stem in -ματ-: ὄνομα, ὀνόματος. Nouns in -ις change their stem: πόλις, πόλεως. Nouns in -ευς: βασιλεύς, βασιλέως — the title of the emperor in Byzantine documents. Neuters in -ος (γένος, ἔτος) form the genitive in -ους.","Neutra auf -μα werden mit einem Stamm auf -ματ- dekliniert: ὄνομα, ὀνόματος. Wörter auf -ις wechseln den Stamm: πόλις, πόλεως. Wörter auf -ευς: βασιλεύς, βασιλέως — so heißt der Kaiser in byzantinischen Urkunden. Neutra auf -ος (γένος, ἔτος) bilden den Genitiv auf -ους."],"βασιλεύς — родительный падеж ед. ч.:":["βασιλεύς — genitive singular:","βασιλεύς — Genitiv Singular:"],"ἔτους в датировке ἔτους ͵ϛφλϛʹ — что это за форма?":["ἔτους in the date ἔτους ͵ϛφλϛʹ — what form is it?","ἔτους in der Datierung ἔτους ͵ϛφλϛʹ — welche Form ist das?"],"родительный от ἔτος «год»":["genitive of ἔτος “year”","Genitiv von ἔτος „Jahr“"],"именительный от ἔτους":["nominative of ἔτους","Nominativ von ἔτους"],"дательный от ἔτος":["dative of ἔτος","Dativ von ἔτος"],"винительный от ἔτης":["accusative of ἔτης","Akkusativ von ἔτης"],"Родительный времени: «в году 6536». γένος, ἔτος → γένους, ἔτους.":["Genitive of time: “in the year 6536”. γένος, ἔτος → γένους, ἔτους.","Genitiv der Zeit: „im Jahr 6536“. γένος, ἔτος → γένους, ἔτους."],"ἕνεκεν требует родительного падежа: τοῦ ὀνόματος.":["ἕνεκεν takes the genitive: τοῦ ὀνόματος.","ἕνεκεν steht mit dem Genitiv: τοῦ ὀνόματος."],"Дательный ед. ч.: основа πνευματ- + -ι.":["Dative singular: stem πνευματ- + -ι.","Dativ Singular: Stamm πνευματ- + -ι."],"ἐν + дательный падеж: ἐν πόλει.":["ἐν + dative: ἐν πόλει.","ἐν + Dativ: ἐν πόλει."],"Лк 2:11":["Lk 2:11","Lk 2,11"],"Так византийские императоры подписывали хрисовулы — грамоты с золотой печатью.":["This is how Byzantine emperors signed chrysobulls, charters with a golden seal.","So unterzeichneten byzantinische Kaiser Chrysobullen, Urkunden mit goldenem Siegel."],"подпись императора на хрисовуле":["emperor’s signature on a chrysobull","Kaiserunterschrift auf einem Chrysobull"],"Псалтирь: повелительное наклонение и аорист":["The Psalter: imperative and aorist","Der Psalter: Imperativ und Aorist"],"Повелительное наклонение":["The imperative","Der Imperativ"],"Псалмы полны просьб. Повелительное наклонение аориста 2 л. ед. ч. чаще всего оканчивается на -σον: ἐλέησον, σῶσον. Формы на -τω значат «да будет…, пусть…».":["The Psalms are full of petitions. The aorist imperative 2nd person singular usually ends in -σον: ἐλέησον, σῶσον. Forms in -τω mean “let it be…, may…”.","Die Psalmen sind voller Bitten. Der Imperativ Aorist der 2. Person Singular endet meist auf -σον: ἐλέησον, σῶσον. Formen auf -τω bedeuten „es soll…, möge…“."],"ἁγιασθήτω, ἐλθέτω, γενηθήτω — что это за формы?":["ἁγιασθήτω, ἐλθέτω, γενηθήτω — what forms are these?","ἁγιασθήτω, ἐλθέτω, γενηθήτω — was für Formen sind das?"],"повелительное 3 л.: «да будет…, пусть…»":["3rd-person imperative: “let it be…, may…”","Imperativ der 3. Person: „es soll…, möge…“"],"повелительное 2 л.: «будь!»":["2nd-person imperative: “be!”","Imperativ der 2. Person: „sei!“"],"будущее время":["future tense","Futur"],"инфинитив":["infinitive","Infinitiv"],"Пс 50:3":["Ps 50:3","Ps 50,3"],"Пс 27:9":["Ps 27:9","Ps 27,9"],"εἰσακούω управляет родительным падежом: τῆς προσευχῆς.":["εἰσακούω takes the genitive: τῆς προσευχῆς.","εἰσακούω regiert den Genitiv: τῆς προσευχῆς."],"Пс 101:2":["Ps 101:2","Ps 101,2"],"ἀπό всегда с родительным падежом.":["ἀπό always takes the genitive.","ἀπό steht immer mit dem Genitiv."],"Пс 50:4":["Ps 50:4","Ps 50,4"],"Аорист":["The aorist","Der Aorist"],"Аорист — главное повествовательное время: действие как факт. Признаки: приращение ἐ- в начале и часто -σ- перед окончанием: ποιέω → ἐποίησα.":["The aorist is the main narrative tense: an action seen as a fact. Its marks: the augment ἐ- at the beginning and often -σ- before the ending: ποιέω → ἐποίησα.","Der Aorist ist das wichtigste Erzähltempus: eine Handlung als Tatsache. Kennzeichen: das Augment ἐ- am Anfang und oft -σ- vor der Endung: ποιέω → ἐποίησα."],"Что обозначает начальное ἐ- в ἐποίησεν, ἐκάθισεν?":["What does the initial ἐ- in ἐποίησεν, ἐκάθισεν mean?","Was bedeutet das anlautende ἐ- in ἐποίησεν, ἐκάθισεν?"],"приращение: прошедшее время":["the augment: past tense","das Augment: Vergangenheit"],"отрицание":["negation","Verneinung"],"приставку «из-»":["the prefix “out of”","die Vorsilbe „aus-“"],"артикль":["the article","der Artikel"],"Чем аорист отличается от имперфекта?":["How does the aorist differ from the imperfect?","Wie unterscheidet sich der Aorist vom Imperfekt?"],"аорист — действие как факт; имперфект — длительное или повторяющееся":["the aorist presents an action as a fact; the imperfect as ongoing or repeated","der Aorist stellt eine Handlung als Tatsache dar, das Imperfekt als andauernd oder wiederholt"],"аорист обозначает будущее":["the aorist denotes the future","der Aorist bezeichnet die Zukunft"],"аорист встречается только в молитвах":["the aorist occurs only in prayers","der Aorist kommt nur in Gebeten vor"],"ничем":["in no way","gar nicht"],"Аорист 2 л. ед. ч.: ἐ- + ποιη- + -σας.":["Aorist, 2nd person singular: ἐ- + ποιη- + -σας.","Aorist, 2. Person Singular: ἐ- + ποιη- + -σας."],"Пс 1:1":["Ps 1:1","Ps 1,1"],"Пс 140:1":["Ps 140:1","Ps 140,1"],"ἐγένετο — аорист от γίνομαι: «стало, произошло».":["ἐγένετο is the aorist of γίνομαι: “came to be, happened”.","ἐγένετο ist der Aorist von γίνομαι: „wurde, geschah“."],"Ин 1:3":["Jn 1:3","Joh 1,3"],"Лк 2:10":["Lk 2:10","Lk 2,10"],"Медиопассив":["The mediopassive","Das Mediopassiv"],"Медиопассив: настоящее время":["Mediopassive: the present","Mediopassiv: Präsens"],"Медиопассивные окончания: -ομαι, -ῃ, -εται, -όμεθα, -εσθε, -ονται; инфинитив -εσθαι. Они служат и среднему залогу (действие для себя), и страдательному (действие над подлежащим). У многих частых глаголов есть только такие формы при активном значении: ἔρχομαι «иду», γίνομαι «становлюсь», προσεύχομαι «молюсь». Это отложительные глаголы (deponentia).":["Mediopassive endings: -ομαι, -ῃ, -εται, -όμεθα, -εσθε, -ονται; infinitive -εσθαι. They serve both the middle voice (acting for oneself) and the passive (the subject undergoes the action). Many frequent verbs have only these forms but an active meaning: ἔρχομαι “I go”, γίνομαι “I become”, προσεύχομαι “I pray”. These are deponent verbs (deponentia).","Mediopassive Endungen: -ομαι, -ῃ, -εται, -όμεθα, -εσθε, -ονται; Infinitiv -εσθαι. Sie dienen dem Medium (Handeln für sich selbst) und dem Passiv (das Subjekt erleidet die Handlung). Viele häufige Verben haben nur diese Formen, aber aktive Bedeutung: ἔρχομαι „ich gehe“, γίνομαι „ich werde“, προσεύχομαι „ich bete“. Das sind Deponentien."],"Что такое отложительный глагол?":["What is a deponent verb?","Was ist ein Deponens?"],"глагол с медиопассивными формами и активным значением":["a verb with mediopassive forms and an active meaning","ein Verb mit mediopassiven Formen und aktiver Bedeutung"],"глагол без прошедшего времени":["a verb without a past tense","ein Verb ohne Vergangenheit"],"глагол, который употребляется только с отрицанием":["a verb used only with a negation","ein Verb, das nur mit Verneinung gebraucht wird"],"глагол только в повелительном наклонении":["a verb used only in the imperative","ein Verb nur im Imperativ"],"ἔρχομαι «иду», γίνομαι «становлюсь», προσεύχομαι «молюсь».":["ἔρχομαι “I go”, γίνομαι “I become”, προσεύχομαι “I pray”.","ἔρχομαι „ich gehe“, γίνομαι „ich werde“, προσεύχομαι „ich bete“."],"σώζεται — как перевести?":["σώζεται — how do you translate it?","σώζεται — wie übersetzt man das?"],"«он спасается / его спасают»":["“he is being saved / is saved”","„er wird gerettet“"],"«он спасает»":["“he saves”","„er rettet“"],"«спаси!»":["“save!”","„rette!“"],"«спасти»":["“to save”","„retten“"],"1 л. ед. ч.: окончание -ομαι.":["1st person singular: ending -ομαι.","1. Person Singular: Endung -ομαι."],"2 л. ед. ч. медиопассива: -ῃ (из -εσαι). Дословно «и спасаешься».":["2nd person singular mediopassive: -ῃ (from -εσαι). Literally “and you are saved”.","2. Person Singular Mediopassiv: -ῃ (aus -εσαι). Wörtlich „und du wirst gerettet“."],"Апофтегмы, Антоний 1":["Apophthegmata, Antony 1","Apophthegmata, Antonios 1"],"Инфинитив медиопассива на -εσθαι. Активный инфинитив — ἀναγινώσκειν.":["Mediopassive infinitive in -εσθαι. The active infinitive is ἀναγινώσκειν.","Mediopassiver Infinitiv auf -εσθαι. Der aktive Infinitiv lautet ἀναγινώσκειν."],"Житие Антония, 2":["Life of Antony, 2","Vita Antonii, 2"],"1 Фес 5:25":["1 Thess 5:25","1 Thess 5,25"],"Аорист и будущее пассива":["Aorist and future passive","Aorist und Futur Passiv"],"Страдательный аорист образуется с суффиксом -θη- и активными окончаниями: ἐ-σώ-θη «был спасён», ἐφοβήθησαν «испугались». Будущее пассива — -θησ- и медиопассивные окончания: κληθήσονται «будут названы». У некоторых глаголов вместо -θη- просто -η-: ἐγράφη «было написано».":["The aorist passive is formed with the suffix -θη- and active endings: ἐ-σώ-θη “he was saved”, ἐφοβήθησαν “they were afraid”. The future passive has -θησ- and mediopassive endings: κληθήσονται “they will be called”. Some verbs have just -η- instead of -θη-: ἐγράφη “it was written”.","Der Aorist Passiv wird mit dem Suffix -θη- und aktiven Endungen gebildet: ἐ-σώ-θη „er wurde gerettet“, ἐφοβήθησαν „sie fürchteten sich“. Das Futur Passiv hat -θησ- und mediopassive Endungen: κληθήσονται „sie werden genannt werden“. Manche Verben haben statt -θη- nur -η-: ἐγράφη „es wurde geschrieben“."],"Какой суффикс указывает на страдательный аорист?":["Which suffix marks the aorist passive?","Welches Suffix kennzeichnet den Aorist Passiv?"],"ἐφοβήθησαν по форме страдательное. Как перевести?":["ἐφοβήθησαν is passive in form. How do you translate it?","ἐφοβήθησαν ist der Form nach passiv. Wie übersetzt man es?"],"«они испугались»":["“they were afraid”","„sie fürchteten sich“"],"«их напугали»":["“they were frightened by someone”","„man erschreckte sie“"],"«они напугают»":["“they will frighten”","„sie werden erschrecken“"],"«бойтесь!»":["“do not fear!”","„fürchtet euch!“"],"У φοβέομαι страдательный аорист значит просто «испугаться».":["For φοβέομαι the passive aorist simply means “to become afraid”.","Bei φοβέομαι bedeutet der passive Aorist einfach „sich fürchten“."],"Аорист пассива: ἐ- + τεχ- + -θη. ἔτεκεν «родила» — действительный залог.":["Aorist passive: ἐ- + τεχ- + -θη. ἔτεκεν “she bore” is active.","Aorist Passiv: ἐ- + τεχ- + -θη. ἔτεκεν „sie gebar“ ist Aktiv."],"Будущее пассива: -θήσ- + -ονται.":["Future passive: -θήσ- + -ονται.","Futur Passiv: -θήσ- + -ονται."],"Мф 5:7":["Mt 5:7","Mt 5,7"],"Мф 5:9":["Mt 5:9","Mt 5,9"],"Лк 2:9":["Lk 2:9","Lk 2,9"],"Аорист пассива от μεγαλύνω, дословно «возвеличились».":["Aorist passive of μεγαλύνω, literally “they were magnified”.","Aorist Passiv von μεγαλύνω, wörtlich „sie wurden groß gemacht“."],"Жития и патерики: причастия":["Lives and Sayings: participles","Viten und Väterworte: Partizipien"],"Слова пустыни":["Words of the desert","Wörter der Wüste"],"Язык патериков и житий прост и повторяется: авва, старец, брат, келья. Апофтегма часто открывается формулой Εἶπεν ὁ ἀββᾶς… «Сказал авва…».":["The language of the Sayings and Lives is simple and repetitive: abba, elder, brother, cell. An apophthegm often opens with the formula Εἶπεν ὁ ἀββᾶς… “Abba … said”.","Die Sprache der Väterworte und Viten ist einfach und wiederholt sich: Abbas, Greis, Bruder, Zelle. Ein Apophthegma beginnt oft mit der Formel Εἶπεν ὁ ἀββᾶς… „Abbas … sprach“."],"μοναχός происходит от μόνος. Что значит μόνος?":["μοναχός comes from μόνος. What does μόνος mean?","μοναχός kommt von μόνος. Was bedeutet μόνος?"],"один, единственный":["alone, single","allein, einzig"],"святой":["holy","heilig"],"молчаливый":["silent","schweigsam"],"старый":["old","alt"],"Εἶπεν ὁ ἀββᾶς… — как перевести эту формулу?":["Εἶπεν ὁ ἀββᾶς… — how do you translate this formula?","Εἶπεν ὁ ἀββᾶς… — wie übersetzt man diese Formel?"],"«Сказал авва…»":["“Abba … said”","„Abbas … sprach“"],"«Спросил брат…»":["“A brother asked …”","„Ein Bruder fragte …“"],"«Пришёл старец…»":["“An elder came …”","„Ein Greis kam …“"],"«Жил некогда…»":["“Once there lived …”","„Es lebte einmal …“"],"Подлежащее — именительный падеж. γέρων, γέροντος — третье склонение.":["The subject is in the nominative. γέρων, γέροντος belongs to the third declension.","Das Subjekt steht im Nominativ. γέρων, γέροντος gehört zur dritten Deklination."],"Апофтегмы":["Apophthegmata","Apophthegmata"],"ἐν + дательный падеж. ἡ ἔρημος — женского рода, хотя на -ος.":["ἐν + dative. ἡ ἔρημος is feminine, although it ends in -ος.","ἐν + Dativ. ἡ ἔρημος ist feminin, obwohl es auf -ος endet."],"πρός + винительный падеж: πρὸς τὸν ἀββᾶν.":["πρός + accusative: πρὸς τὸν ἀββᾶν.","πρός + Akkusativ: πρὸς τὸν ἀββᾶν."],"Причастия":["Participles","Partizipien"],"Житийный рассказ держится на причастиях. Причастие настоящего времени передаёт одновременное действие («говоря»), аориста — предшествующее («услышав»).":["Hagiographic narrative relies on participles. The present participle expresses a simultaneous action (“saying”), the aorist participle a preceding one (“having heard”).","Die hagiographische Erzählung lebt von Partizipien. Das Partizip Präsens drückt eine gleichzeitige Handlung aus („sagend“), das Partizip Aorist eine vorausgehende („nachdem er gehört hatte“)."],"ἐξελθών — что это за форма?":["ἐξελθών — what form is it?","ἐξελθών — welche Form ist das?"],"причастие аориста: «выйдя»":["aorist participle: “having gone out”","Partizip Aorist: „hinausgegangen“"],"повелительное: «выйди!»":["imperative: “go out!”","Imperativ: „geh hinaus!“"],"инфинитив: «выйти»":["infinitive: “to go out”","Infinitiv: „hinausgehen“"],"будущее: «выйдет»":["future: “he will go out”","Futur: „er wird hinausgehen“"],"βλέπει τινὰ … καθήμενον καὶ ἐργαζόμενον: почему причастия на -ον?":["βλέπει τινὰ … καθήμενον καὶ ἐργαζόμενον: why do the participles end in -ον?","βλέπει τινὰ … καθήμενον καὶ ἐργαζόμενον: Warum enden die Partizipien auf -ον?"],"они согласованы с τινά (вин. падеж, м. р.)":["they agree with τινά (accusative, masculine)","sie stimmen mit τινά überein (Akkusativ, maskulin)"],"это средний род":["they are neuter","es ist Neutrum"],"это именительный падеж":["they are nominative","es ist Nominativ"],"это наречия":["they are adverbs","es sind Adverbien"],"ἀκούω + родительный лица: причастие λέγοντος согласовано с τοῦ Κυρίου.":["ἀκούω + genitive of the person: the participle λέγοντος agrees with τοῦ Κυρίου.","ἀκούω + Genitiv der Person: Das Partizip λέγοντος stimmt mit τοῦ Κυρίου überein."],"ἀκούσας — причастие аориста: действие перед главным («услышав»).":["ἀκούσας is an aorist participle: an action before the main one (“having heard”).","ἀκούσας ist ein Partizip Aorist: eine Handlung vor der Haupthandlung („nachdem er gehört hatte“)."],"Мф 19:21":["Mt 19:21","Mt 19,21"],"Палеография: как читать рукописи":["Palaeography: how to read manuscripts","Paläographie: Handschriften lesen"],"Священные имена в рукописях сокращали: писали первую и последнюю букву, иногда ещё одну из середины, и ставили над ними черту. Окончание меняется вместе с падежом: ΘΣ — θεός, ΘΥ — θεοῦ, ΘΩ — θεῷ, ΘΝ — θεόν.":["Sacred names were abbreviated in manuscripts: the scribe wrote the first and the last letter, sometimes one more from the middle, and drew a line above them. The ending changes with the case: ΘΣ — θεός, ΘΥ — θεοῦ, ΘΩ — θεῷ, ΘΝ — θεόν.","Heilige Namen wurden in Handschriften abgekürzt: Man schrieb den ersten und den letzten Buchstaben, manchmal noch einen aus der Mitte, und setzte einen Strich darüber. Die Endung ändert sich mit dem Kasus: ΘΣ — θεός, ΘΥ — θεοῦ, ΘΩ — θεῷ, ΘΝ — θεόν."],"Что означает черта над ΘΣ?":["What does the line above ΘΣ mean?","Was bedeutet der Strich über ΘΣ?"],"слово сокращено (nomen sacrum)":["the word is abbreviated (nomen sacrum)","das Wort ist abgekürzt (Nomen sacrum)"],"это число":["it is a number","es ist eine Zahl"],"слово надо пропустить при чтении":["the word should be skipped when reading","das Wort soll beim Lesen übersprungen werden"],"это имя собственное":["it is a proper name","es ist ein Eigenname"],"Черта отличает сокращение от обычного слова и от числа. У чисел вместо черты ставится керайя ʹ.":["The line distinguishes an abbreviation from an ordinary word and from a number. Numbers carry a keraia ʹ instead of a line.","Der Strich unterscheidet die Abkürzung von einem gewöhnlichen Wort und von einer Zahl. Zahlen tragen statt eines Strichs eine Keraia ʹ."],"Надпись на иконах ΜΡ ΘΥ означает:":["The inscription ΜΡ ΘΥ on icons means:","Die Inschrift ΜΡ ΘΥ auf Ikonen bedeutet:"],"Μήτηρ Θεοῦ — Матерь Божия":["Μήτηρ Θεοῦ — Mother of God","Μήτηρ Θεοῦ — Mutter Gottes"],"Μάρτυς Θεοῦ — мученик Божий":["Μάρτυς Θεοῦ — martyr of God","Μάρτυς Θεοῦ — Märtyrer Gottes"],"Μέγας Θεός — великий Бог":["Μέγας Θεός — great God","Μέγας Θεός — großer Gott"],"Μαρία Θεοτόκος — Мария Богородица":["Μαρία Θεοτόκος — Mary the Theotokos","Μαρία Θεοτόκος — Maria, die Gottesgebärerin"],"Маюскул: письмо без пробелов":["Majuscule: writing without spaces","Majuskel: Schrift ohne Wortabstände"],"До IX века книги писали маюскулом: крупными буквами, без пробелов, ударений и придыханий (scriptio continua). Сигма имела форму Ϲ — «лунная» сигма. Читать такой текст значит самому разделить его на слова. Священные имена сокращены — это вы уже знаете по прошлому уроку.":["Until the 9th century books were written in majuscule: large letters, without spaces, accents or breathings (scriptio continua). The sigma had the form Ϲ, the “lunate” sigma. Reading such a text means dividing it into words yourself. Sacred names are abbreviated, as you know from the previous lesson.","Bis zum 9. Jahrhundert schrieb man Bücher in Majuskel: große Buchstaben ohne Wortabstände, Akzente und Spiritus (scriptio continua). Das Sigma hatte die Form Ϲ, das „lunare“ Sigma. Einen solchen Text lesen heißt, ihn selbst in Wörter zu teilen. Heilige Namen sind abgekürzt, wie Sie aus der vorigen Lektion wissen."],"Что такое scriptio continua?":["What is scriptio continua?","Was ist scriptio continua?"],"письмо без пробелов между словами":["writing without spaces between words","Schrift ohne Abstände zwischen den Wörtern"],"письмо только заглавными буквами":["writing in capital letters only","Schrift nur in Großbuchstaben"],"письмо справа налево":["writing from right to left","Schrift von rechts nach links"],"письмо с сокращениями":["writing with abbreviations","Schrift mit Abkürzungen"],"Когда в греческих книгах распространился минускул?":["When did minuscule spread in Greek books?","Wann setzte sich die Minuskel in griechischen Büchern durch?"],"с IX века":["from the 9th century","ab dem 9. Jahrhundert"],"с IV века":["from the 4th century","ab dem 4. Jahrhundert"],"с XIII века":["from the 13th century","ab dem 13. Jahrhundert"],"после изобретения книгопечатания":["after the invention of printing","nach der Erfindung des Buchdrucks"],"Древнейшая датированная минускульная рукопись — Успенское Евангелие 835 года.":["The oldest dated minuscule manuscript is the Uspensky Gospels of 835.","Die älteste datierte Minuskelhandschrift ist das Uspenskij-Evangeliar von 835."],"Какая форма сигмы типична для маюскула?":["Which form of sigma is typical of majuscule?","Welche Sigma-Form ist typisch für die Majuskel?"],"Ϲ — лунная сигма":["Ϲ — lunate sigma","Ϲ — lunares Sigma"],"Σ — как в печатных книгах":["Σ — as in printed books","Σ — wie in gedruckten Büchern"],"ς — конечная сигма":["ς — final sigma","ς — Schluss-Sigma"],"Ϛ — стигма":["Ϛ — stigma","Ϛ — Stigma"],"Числа и даты":["Numbers and dates","Zahlen und Daten"],"Числа записывали буквами со знаком керайи ʹ: αʹ = 1, ιʹ = 10, ρʹ = 100. Для 6, 90 и 900 служат старые буквы: ϛ (стигма), ϟ (коппа), ϡ (сампи). Тысячи отмечают знаком слева: ͵α = 1000. Годы в Византии считали от сотворения мира — от 1 сентября 5509 г. до н. э. Для января–августа вычитают 5508, для сентября–декабря — 5509.":["Numbers were written with letters and the keraia sign ʹ: αʹ = 1, ιʹ = 10, ρʹ = 100. For 6, 90 and 900 old letters are used: ϛ (stigma), ϟ (koppa), ϡ (sampi). Thousands are marked by a sign on the left: ͵α = 1000. Byzantine years were counted from the creation of the world, from 1 September 5509 BC. For January–August subtract 5508, for September–December 5509.","Zahlen schrieb man mit Buchstaben und dem Zeichen Keraia ʹ: αʹ = 1, ιʹ = 10, ρʹ = 100. Für 6, 90 und 900 dienen alte Buchstaben: ϛ (Stigma), ϟ (Koppa), ϡ (Sampi). Tausender werden durch ein Zeichen links markiert: ͵α = 1000. In Byzanz zählte man die Jahre seit Erschaffung der Welt, ab dem 1. September 5509 v. Chr. Für Januar–August zieht man 5508 ab, für September–Dezember 5509."],"6 (стигма)":["6 (stigma)","6 (Stigma)"],"90 (коппа)":["90 (koppa)","90 (Koppa)"],"900 (сампи)":["900 (sampi)","900 (Sampi)"],"Как перевести год от сотворения мира в год н. э. для января–августа?":["How do you convert a year from the creation of the world into a year AD for January–August?","Wie rechnet man ein Jahr seit Erschaffung der Welt für Januar–August in ein Jahr n. Chr. um?"],"вычесть 5508":["subtract 5508","5508 abziehen"],"вычесть 5509":["subtract 5509","5509 abziehen"],"вычесть 5500":["subtract 5500","5500 abziehen"],"прибавить 5508":["add 5508","5508 addieren"],"Год начинался 1 сентября, поэтому для сентября–декабря вычитают 5509.":["The year began on 1 September, so for September–December you subtract 5509.","Das Jahr begann am 1. September, daher zieht man für September–Dezember 5509 ab."],"Что такое индикт?":["What is an indiction?","Was ist eine Indiktion?"],"номер года в 15-летнем цикле":["the number of the year in a 15-year cycle","die Nummer des Jahres in einem 15-jährigen Zyklus"],"налог на землю":["a land tax","eine Grundsteuer"],"месяц церковного года":["a month of the church year","ein Monat des Kirchenjahres"],"номер императора в династии":["the number of an emperor in his dynasty","die Nummer eines Kaisers in seiner Dynastie"],"Индикт был налоговым циклом и стал обычной частью датировки. Год индикта тоже начинался 1 сентября.":["The indiction was a tax cycle and became a regular part of dating. The indiction year also began on 1 September.","Die Indiktion war ein Steuerzyklus und wurde fester Bestandteil der Datierung. Auch das Indiktionsjahr begann am 1. September."],"Сокращения и ошибки писцов":["Abbreviations and scribal errors","Abkürzungen und Schreiberfehler"],"Минускульные рукописи полны сокращений: частые слова и окончания писали значками, соседние буквы сливали в лигатуры. Кроме того, переписчики путали буквы, которые звучали одинаково (итацизм), пропускали и повторяли строки. Зная эти ошибки, можно восстановить правильный текст.":["Minuscule manuscripts are full of abbreviations: frequent words and endings were written as signs, neighbouring letters were joined into ligatures. Besides, scribes confused letters that sounded alike (itacism) and skipped or repeated lines. Knowing these errors helps to restore the correct text.","Minuskelhandschriften sind voller Abkürzungen: Häufige Wörter und Endungen schrieb man als Zeichen, benachbarte Buchstaben verschmolzen zu Ligaturen. Außerdem verwechselten Schreiber gleich klingende Buchstaben (Itazismus) und ließen Zeilen aus oder wiederholten sie. Wer diese Fehler kennt, kann den richtigen Text wiederherstellen."],"καί — знак-сокращение":["καί — abbreviation sign","καί — Kürzungszeichen"],"ου — лигатура":["ου — ligature","ου — Ligatur"],"στ — лигатура; также число 6":["στ — ligature; also the number 6","στ — Ligatur; auch die Zahl 6"],"путаются из-за итацизма":["confused because of itacism","werden wegen des Itazismus verwechselt"],"путаются по звучанию":["confused because they sound alike","werden wegen gleichen Klangs verwechselt"],"пропуск одного из двух одинаковых слогов или слов":["omission of one of two identical syllables or words","Auslassung einer von zwei gleichen Silben oder Wörtern"],"ошибочный повтор":["erroneous repetition","irrtümliche Wiederholung"],"пропуск между двумя одинаковыми окончаниями":["omission between two identical endings","Auslassung zwischen zwei gleichen Endungen"],"Гаплография — это…":["Haplography is…","Haplographie ist…"],"ошибочный повтор слова или строки":["erroneous repetition of a word or line","irrtümliche Wiederholung eines Wortes oder einer Zeile"],"пропуск текста между двумя одинаковыми окончаниями":["omission of text between two identical endings","Auslassung von Text zwischen zwei gleichen Endungen"],"замена слова синонимом":["replacing a word with a synonym","Ersetzen eines Wortes durch ein Synonym"],"Гомеотелевтон — это…":["Homoeoteleuton is…","Homoioteleuton ist…"],"Глаз переписчика перескакивает с одного окончания на такое же ниже, и всё между ними выпадает.":["The scribe’s eye jumps from one ending to an identical one further down, and everything in between drops out.","Das Auge des Schreibers springt von einer Endung zu einer gleichen weiter unten, und alles dazwischen fällt aus."],"В рукописи «Отче наш» написано: δὸς ὑμῖν σήμερον. Что произошло?":["A manuscript of the Lord’s Prayer reads: δὸς ὑμῖν σήμερον. What happened?","In einer Handschrift des Vaterunsers steht: δὸς ὑμῖν σήμερον. Was ist geschehen?"],"итацизм: ὑμῖν вместо ἡμῖν":["itacism: ὑμῖν instead of ἡμῖν","Itazismus: ὑμῖν statt ἡμῖν"],"диттография":["dittography","Dittographie"],"гомеотелевтон":["homoeoteleuton","Homoioteleuton"],"это правильное чтение":["it is the correct reading","es ist die richtige Lesart"],"η и υ звучали одинаково, поэтому «нам» и «вам» постоянно путаются в рукописях.":["η and υ sounded the same, so “us” and “you” are constantly confused in manuscripts.","η und υ klangen gleich, daher werden „uns“ und „euch“ in Handschriften ständig verwechselt."],"Артикль сразу показывает род, число и падеж. Звательного падежа у артикля нет; в обращении часто стоит ὁ с именительным: ὁ Θεός «Боже».":["The article shows gender, number and case at once. The article has no vocative; in address ὁ with the nominative is often used: ὁ Θεός “O God”.","Der Artikel zeigt sofort Genus, Numerus und Kasus. Einen Vokativ hat der Artikel nicht; in der Anrede steht oft ὁ mit Nominativ: ὁ Θεός „o Gott“."],"м.":["m.","m."],"ж.":["f.","f."],"ср.":["n.","n."],"им. ед.":["nom. sg.","Nom. Sg."],"род. ед.":["gen. sg.","Gen. Sg."],"дат. ед.":["dat. sg.","Dat. Sg."],"вин. ед.":["acc. sg.","Akk. Sg."],"им. мн.":["nom. pl.","Nom. Pl."],"род. мн.":["gen. pl.","Gen. Pl."],"дат. мн.":["dat. pl.","Dat. Pl."],"вин. мн.":["acc. pl.","Akk. Pl."],"Второе склонение":["The second declension","Die zweite Deklination"],"Слова на -ος — обычно мужского рода (но ἡ ὁδός, ἡ ἔρημος — женского), на -ον — среднего. У среднего рода им. и вин. совпадают, во мн. ч. оканчиваются на -α.":["Words in -ος are usually masculine (but ἡ ὁδός, ἡ ἔρημος are feminine), words in -ον are neuter. In the neuter, nominative and accusative are identical, and the plural ends in -α.","Wörter auf -ος sind meist maskulin (aber ἡ ὁδός, ἡ ἔρημος sind feminin), Wörter auf -ον neutral. Beim Neutrum sind Nominativ und Akkusativ gleich, der Plural endet auf -α."],"ὁ λόγος — слово":["ὁ λόγος — word","ὁ λόγος — Wort"],"ед. ч.":["sg.","Sg."],"мн. ч.":["pl.","Pl."],"им.":["nom.","Nom."],"род.":["gen.","Gen."],"дат.":["dat.","Dat."],"вин.":["acc.","Akk."],"зв.":["voc.","Vok."],"τὸ ἔργον — дело":["τὸ ἔργον — work","τὸ ἔργον — Werk"],"После ε, ι, ρ в единственном числе сохраняется α (ἡμέρα). После других звуков — η (ψυχή). Слова вроде δόξα имеют α в им. и вин., но η в род. и дат.":["In the singular α is kept after ε, ι, ρ (ἡμέρα), after other sounds η is used (ψυχή). Words like δόξα have α in the nominative and accusative but η in the genitive and dative.","Im Singular bleibt α nach ε, ι, ρ erhalten (ἡμέρα), nach anderen Lauten steht η (ψυχή). Wörter wie δόξα haben α im Nominativ und Akkusativ, aber η im Genitiv und Dativ."],"ἡ ψυχή — душа":["ἡ ψυχή — soul","ἡ ψυχή — Seele"],"ἡ ἡμέρα — день":["ἡ ἡμέρα — day","ἡ ἡμέρα — Tag"],"ἡ δόξα — слава":["ἡ δόξα — glory","ἡ δόξα — Herrlichkeit"],"Основа видна в родительном падеже: νύξ, νυκτ-ός. Окончания ед. ч.: -ος, -ι, -α (или -ν); мн. ч.: -ες, -ων, -σι(ν), -ας. Перед -σι согласный основы сливается или выпадает: νυκτ-σί → νυξί, ὀνοματ-σι → ὀνόμασι.":["The stem appears in the genitive: νύξ, νυκτ-ός. Singular endings: -ος, -ι, -α (or -ν); plural: -ες, -ων, -σι(ν), -ας. Before -σι the final consonant of the stem merges or drops: νυκτ-σί → νυξί, ὀνοματ-σι → ὀνόμασι.","Der Stamm zeigt sich im Genitiv: νύξ, νυκτ-ός. Endungen im Singular: -ος, -ι, -α (oder -ν); im Plural: -ες, -ων, -σι(ν), -ας. Vor -σι verschmilzt der Stammauslaut oder fällt aus: νυκτ-σί → νυξί, ὀνοματ-σι → ὀνόμασι."],"ἡ νύξ — ночь":["ἡ νύξ — night","ἡ νύξ — Nacht"],"ὁ πατήρ — отец":["ὁ πατήρ — father","ὁ πατήρ — Vater"],"τὸ ὄνομα — имя":["τὸ ὄνομα — name","τὸ ὄνομα — Name"],"ἡ πόλις — город":["ἡ πόλις — city","ἡ πόλις — Stadt"],"ὁ βασιλεύς — император":["ὁ βασιλεύς — emperor","ὁ βασιλεύς — Kaiser"],"τὸ γένος — род":["τὸ γένος — kind, family","τὸ γένος — Geschlecht"],"Личные местоимения":["Personal pronouns","Personalpronomen"],"Краткие формы μου, μοι, με, σου, σοι, σε — энклитики. Полные формы (ἐμοῦ, σοῦ) ставятся после предлогов и при логическом ударении.":["The short forms μου, μοι, με, σου, σοι, σε are enclitics. The full forms (ἐμοῦ, σοῦ) are used after prepositions and for emphasis.","Die Kurzformen μου, μοι, με, σου, σοι, σε sind Enklitika. Die vollen Formen (ἐμοῦ, σοῦ) stehen nach Präpositionen und bei Betonung."],"ἐγώ — я":["ἐγώ — I","ἐγώ — ich"],"σύ — ты":["σύ — you","σύ — du"],"αὐτός — он, сам":["αὐτός — he, self","αὐτός — er, selbst"],"Глагол εἰμί":["The verb εἰμί","Das Verb εἰμί"],"Формы настоящего времени, кроме εἶ, — энклитики: Ἐγώ εἰμι, ὅς ἐστι. Подвижное ν: ἐστί / ἐστίν, εἰσί / εἰσίν.":["The present forms, except εἶ, are enclitics: Ἐγώ εἰμι, ὅς ἐστι. Movable ν: ἐστί / ἐστίν, εἰσί / εἰσίν.","Die Präsensformen außer εἶ sind Enklitika: Ἐγώ εἰμι, ὅς ἐστι. Bewegliches ν: ἐστί / ἐστίν, εἰσί / εἰσίν."],"εἰμί — быть":["εἰμί — to be","εἰμί — sein"],"наст.":["pres.","Präs."],"имперф.":["impf.","Impf."],"буд.":["fut.","Fut."],"1 л. ед.":["1 sg.","1. Sg."],"2 л. ед.":["2 sg.","2. Sg."],"3 л. ед.":["3 sg.","3. Sg."],"1 л. мн.":["1 pl.","1. Pl."],"2 л. мн.":["2 pl.","2. Pl."],"3 л. мн.":["3 pl.","3. Pl."],"Глагол λύω (действительный залог)":["The verb λύω (active)","Das Verb λύω (Aktiv)"],"Образец правильного глагола. Приращение ἐ- — признак прошедших времён в изъявительном наклонении; -σ- — признак будущего и аориста.":["A model regular verb. The augment ἐ- marks the past tenses in the indicative; -σ- marks the future and the aorist.","Ein regelmäßiges Musterverb. Das Augment ἐ- kennzeichnet die Vergangenheitstempora im Indikativ; -σ- kennzeichnet Futur und Aorist."],"λύω — развязывать":["λύω — to loose","λύω — lösen"],"аорист":["aorist","Aorist"],"Повелительное аориста":["Aorist imperative","Imperativ Aorist"],"форма":["form","Form"],"3 л. ед. страд.":["3 sg. pass.","3. Sg. Pass."],"Медиопассив: λύομαι":["Mediopassive: λύομαι","Mediopassiv: λύομαι"],"Настоящее время и имперфект общие для среднего и страдательного залога. В аористе и будущем они различаются: средний залог образуется с -σα-/-σ-, страдательный — с -θη-/-θησ-.":["The present and imperfect are shared by the middle and the passive. In the aorist and future they differ: the middle is formed with -σα-/-σ-, the passive with -θη-/-θησ-.","Präsens und Imperfekt sind Medium und Passiv gemeinsam. Im Aorist und Futur unterscheiden sie sich: Das Medium wird mit -σα-/-σ- gebildet, das Passiv mit -θη-/-θησ-."],"λύομαι — развязываюсь / меня развязывают":["λύομαι — I loose for myself / I am loosed","λύομαι — ich löse mir / ich werde gelöst"],"аорист сред.":["aor. mid.","Aor. Med."],"аорист страд.":["aor. pass.","Aor. Pass."],"буд. страд.":["fut. pass.","Fut. Pass."],"Стяжённый глагол ποιέω":["The contract verb ποιέω","Das kontrahierte Verb ποιέω"],"Глаголы на -έω сливают ε с окончанием: ε + ω → ω, ε + ει → ει, ε + ο → ου.":["Verbs in -έω contract ε with the ending: ε + ω → ω, ε + ει → ει, ε + ο → ου.","Verben auf -έω ziehen ε mit der Endung zusammen: ε + ω → ω, ε + ει → ει, ε + ο → ου."],"ποιέω — делать":["ποιέω — to do, make","ποιέω — tun, machen"],"повел. 2 л. ед.":["impv. 2 sg.","Imp. 2. Sg."],"[ɣ]; перед [e]
