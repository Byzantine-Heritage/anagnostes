{"id": "gen1", "cat": "lxx", "gr": "Γένεσις αʹ 1–5", "title": {"ru": "Книга Бытия 1:1–5", "en": "Genesis 1:1–5", "de": "Genesis 1,1–5"}, "bl": {"ru": "Сотворение света: простые предложения с καί.", "en": "The creation of light: simple sentences joined by καί.", "de": "Die Erschaffung des Lichts: einfache Sätze mit καί."}, "note": {"ru": "Септуагинта — греческий перевод Ветхого Завета (III–I вв. до н. э.), Библия византийской Церкви. Обратите внимание на γενηθήτω φῶς — ту же форму, что в «Отче наш». ἀόρατος καὶ ἀκατασκεύαστος — характерные для LXX прилагательные с ἀ- отрицательным.", "en": "The Septuagint is the Greek translation of the Old Testament (3rd–1st centuries BC) and the Bible of the Byzantine Church. Note γενηθήτω φῶς, the same form as in the Lord’s Prayer. ἀόρατος καὶ ἀκατασκεύαστος are typical LXX adjectives with alpha privative.", "de": "Die Septuaginta ist die griechische Übersetzung des Alten Testaments (3.–1. Jh. v. Chr.) und die Bibel der byzantinischen Kirche. Man beachte γενηθήτω φῶς, dieselbe Form wie im Vaterunser. ἀόρατος καὶ ἀκατασκεύαστος sind typische LXX-Adjektive mit Alpha privativum."}, "v": [["1", "Ἐν ἀρχῇ ἐποίησεν ὁ Θεὸς τὸν οὐρανὸν καὶ τὴν γῆν.", "In the beginning God made the heaven and the earth.", "Im Anfang machte Gott den Himmel und die Erde.", "Въ нача́лѣ сотворѝ бг҃ъ не́бо и҆ зе́млю.", "В начале сотворил Бог небо и землю."], ["2", "ἡ δὲ γῆ ἦν ἀόρατος καὶ ἀκατασκεύαστος, καὶ σκότος ἐπάνω τῆς ἀβύσσου, καὶ πνεῦμα Θεοῦ ἐπεφέρετο ἐπάνω τοῦ ὕδατος.", "And the earth was invisible and unformed, and darkness was over the abyss, and the Spirit of God was moving over the water.", "Die Erde aber war unsichtbar und ungestaltet, und Finsternis lag über dem Abgrund, und der Geist Gottes schwebte über dem Wasser.", "Землѧ́ же бѣ̀ неви́дима и҆ неꙋстро́ена, и҆ тьма̀ верхꙋ̀ бе́здны, и҆ дх҃ъ бж҃їй ноша́шесѧ верхꙋ̀ воды̀.", "Земля же была невидима и неустроена, и тьма над бездною, и Дух Божий носился над водою."], ["3", "καὶ εἶπεν ὁ Θεός· γενηθήτω φῶς· καὶ ἐγένετο φῶς.", "And God said: Let there be light. And there was light.", "Und Gott sprach: Es werde Licht. Und es wurde Licht.", "И҆ речѐ бг҃ъ: да бꙋ́детъ свѣ́тъ. И҆ бы́сть свѣ́тъ.", "И сказал Бог: «Да будет свет». И стал свет."], ["4", "καὶ εἶδεν ὁ Θεὸς τὸ φῶς, ὅτι καλόν· καὶ διεχώρισεν ὁ Θεὸς ἀνὰ μέσον τοῦ φωτὸς καὶ ἀνὰ μέσον τοῦ σκότους.", "And God saw the light, that it was good; and God separated between the light and the darkness.", "Und Gott sah das Licht, dass es gut war; und Gott schied zwischen dem Licht und der Finsternis.", "И҆ ви́дѣ бг҃ъ свѣ́тъ, ꙗ҆́кѡ добро̀, и҆ разлꙋчѝ бг҃ъ междꙋ̀ свѣ́томъ и҆ междꙋ̀ тьмо́ю.", "И увидел Бог свет, что он хорош; и разделил Бог свет и тьму."], ["5", "καὶ ἐκάλεσεν ὁ Θεὸς τὸ φῶς ἡμέραν καὶ τὸ σκότος ἐκάλεσε νύκτα. καὶ ἐγένετο ἑσπέρα καὶ ἐγένετο πρωΐ, ἡμέρα μία.", "And God called the light Day, and the darkness he called Night. And there was evening and there was morning, one day.", "Und Gott nannte das Licht Tag, und die Finsternis nannte er Nacht. Und es wurde Abend, und es wurde Morgen: ein Tag.", "И҆ наречѐ бг҃ъ свѣ́тъ де́нь, а҆ тьмꙋ̀ наречѐ но́щь. И҆ бы́сть ве́черъ, и҆ бы́сть ᲂу҆́тро, де́нь є҆ди́нъ.", "И назвал Бог свет днём, и тьму назвал ночью. И был вечер, и было утро: день один."]]},
{"id": "ex3", "cat": "lxx", "gr": "Ἔξοδος γʹ 13–15", "title": {"ru": "Неопалимая купина, Исх 3:13–15", "en": "The burning bush, Ex 3:13–15", "de": "Der brennende Dornbusch, Ex 3,13–15"}, "bl": {"ru": "Ἐγώ εἰμι ὁ ὤν — имя, которое пишут в нимбе Христа.", "en": "Ἐγώ εἰμι ὁ ὤν: the name written in the halo of Christ.", "de": "Ἐγώ εἰμι ὁ ὤν: der Name im Nimbus Christi."}, "note": {"ru": "ὁ ὤν («Сущий») — причастие от εἰμί с артиклем. Буквы Ο Ω Ν пишут в крестчатом нимбе Христа на византийских иконах. ἀπέσταλκε — перфект от ἀποστέλλω. ἐρῶ, ἐρεῖς — формы будущего времени к λέγω.", "en": "ὁ ὤν, “the One who is”, is the participle of εἰμί with the article. The letters Ο Ω Ν are written in Christ’s cross-nimbus on Byzantine icons. ἀπέσταλκε is the perfect of ἀποστέλλω. ἐρῶ, ἐρεῖς are future forms belonging to λέγω.", "de": "ὁ ὤν, „der Seiende“, ist das Partizip von εἰμί mit Artikel. Die Buchstaben Ο Ω Ν stehen im Kreuznimbus Christi auf byzantinischen Ikonen. ἀπέσταλκε ist das Perfekt von ἀποστέλλω. ἐρῶ, ἐρεῖς sind Futurformen zu λέγω."}, "v": [["13", "καὶ εἶπε Μωυσῆς πρὸς τὸν Θεόν· ἰδοὺ ἐγὼ ἐξελεύσομαι πρὸς τοὺς υἱοὺς Ἰσραήλ, καὶ ἐρῶ πρὸς αὐτούς· ὁ Θεὸς τῶν πατέρων ἡμῶν ἀπέσταλκέ με πρὸς ὑμᾶς. ἐρωτήσουσί με· τί ὄνομα αὐτῷ; τί ἐρῶ πρὸς αὐτούς;", "And Moses said to God: Behold, I shall go out to the sons of Israel and say to them: The God of our fathers has sent me to you. They will ask me: What is his name? What shall I say to them?", "Und Mose sprach zu Gott: Siehe, ich werde zu den Söhnen Israels hinausgehen und zu ihnen sagen: Der Gott unserer Väter hat mich zu euch gesandt. Sie werden mich fragen: Wie ist sein Name? Was soll ich ihnen sagen?", "И҆ речѐ мѡѷсе́й къ бг҃ꙋ: сѐ, а҆́зъ пойдꙋ̀ къ сынѡ́мъ і҆и҃лєвымъ и҆ рекꙋ̀ къ ни̑мъ: бг҃ъ ѻ҆тє́цъ на́шихъ посла́ мѧ къ ва́мъ: и҆ а҆́ще вопро́сѧтъ мѧ̀, что̀ и҆́мѧ є҆мꙋ̀, что̀ рекꙋ̀ къ ни̑мъ;", "И сказал Моисей Богу: «Вот, я пойду к сынам Израилевым и скажу им: „Бог отцов наших послал меня к вам“. Они спросят меня: „Как Ему имя?“ Что я скажу им?»"], ["14", "καὶ εἶπεν ὁ Θεὸς πρὸς Μωυσῆν λέγων· ἐγώ εἰμι ὁ ὤν. καὶ εἶπεν· οὕτως ἐρεῖς τοῖς υἱοῖς Ἰσραήλ· ὁ ὢν ἀπέσταλκέ με πρὸς ὑμᾶς.", "And God said to Moses: I am the One who is. And he said: Thus you shall say to the sons of Israel: The One who is has sent me to you.", "Und Gott sprach zu Mose: Ich bin der Seiende. Und er sprach: So sollst du zu den Söhnen Israels sagen: Der Seiende hat mich zu euch gesandt.", "И҆ речѐ бг҃ъ къ мѡѷсе́ю, гл҃ѧ: а҆́зъ є҆́смь сы́й. И҆ речѐ: та́кѡ рече́ши сынѡ́мъ і҆и҃лєвымъ: сы́й посла́ мѧ къ ва́мъ.", "И сказал Бог Моисею, говоря: «Я есмь Сущий». И сказал: «Так скажешь сынам Израилевым: „Сущий послал меня к вам“»."], ["15", "καὶ εἶπεν ὁ Θεὸς πάλιν πρὸς Μωυσῆν· οὕτως ἐρεῖς τοῖς υἱοῖς Ἰσραήλ· Κύριος ὁ Θεὸς τῶν πατέρων ἡμῶν, Θεὸς Ἁβραὰμ καὶ Θεὸς Ἰσαὰκ καὶ Θεὸς Ἰακὼβ ἀπέσταλκέ με πρὸς ὑμᾶς· τοῦτό μού ἐστιν ὄνομα αἰώνιον καὶ μνημόσυνον γενεῶν γενεαῖς.", "And God said again to Moses: Thus you shall say to the sons of Israel: The Lord, the God of our fathers, the God of Abraham and the God of Isaac and the God of Jacob, has sent me to you. This is my name for ever, and my memorial to generations of generations.", "Und Gott sprach wiederum zu Mose: So sollst du zu den Söhnen Israels sagen: Der Herr, der Gott unserer Väter, der Gott Abrahams, der Gott Isaaks und der Gott Jakobs, hat mich zu euch gesandt. Das ist mein Name für ewig und mein Gedenken von Geschlecht zu Geschlecht.", "И҆ речѐ бг҃ъ па́ки къ мѡѷсе́ю: та́кѡ рече́ши сынѡ́мъ і҆и҃лєвымъ: гдⷭ҇ь бг҃ъ ѻ҆тє́цъ на́шихъ, бг҃ъ а҆враа́мовъ и҆ бг҃ъ і҆саа́ковъ и҆ бг҃ъ і҆а́кѡвль, посла́ мѧ къ ва́мъ: сїѐ моѐ є҆́сть и҆́мѧ вѣ́чное и҆ па́мѧть родѡ́въ родѡ́мъ:", "И ещё сказал Бог Моисею: «Так скажешь сынам Израилевым: „Господь, Бог отцов наших, Бог Авраама, и Бог Исаака, и Бог Иакова послал меня к вам“. Это — имя Моё вечное и память в роды родов»."]]},
{"id": "ps1", "cat": "lxx", "gr": "Ψαλμὸς αʹ 1–3", "title": {"ru": "Псалом 1:1–3", "en": "Psalm 1:1–3", "de": "Psalm 1,1–3"}, "bl": {"ru": "«Блажен муж»: начало Псалтири.", "en": "“Blessed is the man”: the opening of the Psalter.", "de": "„Selig der Mann“: der Beginn des Psalters."}, "note": {"ru": "Псалтирь по Септуагинте; нумерация псалмов греческая. Прошлые действия переданы аористом (ἐπορεύθη, ἔστη, ἐκάθισεν), обещание — будущим временем (μελετήσει, ἔσται, δώσει). Церковный текст читает ἐπὶ καθέδρᾳ (дательный падеж).", "en": "The Psalter according to the Septuagint, with Greek numbering. Past actions are in the aorist (ἐπορεύθη, ἔστη, ἐκάθισεν), the promise in the future (μελετήσει, ἔσται, δώσει). The ecclesiastical text reads ἐπὶ καθέδρᾳ (dative).", "de": "Der Psalter nach der Septuaginta, mit griechischer Zählung. Vergangene Handlungen stehen im Aorist (ἐπορεύθη, ἔστη, ἐκάθισεν), die Verheißung im Futur (μελετήσει, ἔσται, δώσει). Der kirchliche Text liest ἐπὶ καθέδρᾳ (Dativ)."}, "v": [["1", "Μακάριος ἀνήρ, ὃς οὐκ ἐπορεύθη ἐν βουλῇ ἀσεβῶν καὶ ἐν ὁδῷ ἁμαρτωλῶν οὐκ ἔστη καὶ ἐπὶ καθέδρᾳ λοιμῶν οὐκ ἐκάθισεν.", "Blessed is the man who has not walked in the counsel of the ungodly, nor stood in the way of sinners, nor sat in the seat of the pestilent;", "Selig der Mann, der nicht im Rat der Gottlosen ging und nicht auf dem Weg der Sünder stand und nicht auf dem Sitz der Verderber saß,", "Бл҃же́нъ мꙋ́жъ, и҆́же не и҆́де на совѣ́тъ нечести́выхъ, и҆ на пꙋтѝ грѣ́шныхъ не ста̀, и҆ на сѣда́лищи гꙋби́телей не сѣ́де:", "Блажен муж, который не ходил на совет нечестивых, и на пути грешников не стоял, и на седалище губителей не сидел."], ["2", "ἀλλ᾿ ἤ ἐν τῷ νόμῳ Κυρίου τὸ θέλημα αὐτοῦ, καὶ ἐν τῷ νόμῳ αὐτοῦ μελετήσει ἡμέρας καὶ νυκτός.", "but his will is in the law of the Lord, and in his law he will meditate day and night.", "sondern dessen Wille im Gesetz des Herrn ist, und über sein Gesetz wird er sinnen bei Tag und bei Nacht.", "но въ зако́нѣ гдⷭ҇ни во́лѧ є҆гѡ̀, и҆ въ зако́нѣ є҆гѡ̀ поꙋчи́тсѧ де́нь и҆ но́щь.", "Но в законе Господнем воля его, и о законе Его будет он размышлять днём и ночью."], ["3", "καὶ ἔσται ὡς τὸ ξύλον τὸ πεφυτευμένον παρὰ τὰς διεξόδους τῶν ὑδάτων, ὃ τὸν καρπὸν αὐτοῦ δώσει ἐν καιρῷ αὐτοῦ, καὶ τὸ φύλλον αὐτοῦ οὐκ ἀπορρυήσεται· καὶ πάντα, ὅσα ἂν ποιῇ, κατευοδωθήσεται.", "And he will be like the tree planted by the streams of the waters, which will give its fruit in its season, and its leaf will not fall; and all that he does will prosper.", "Und er wird sein wie der Baum, gepflanzt an den Wasserläufen, der seine Frucht bringen wird zu seiner Zeit, und sein Blatt wird nicht abfallen; und alles, was er tut, wird gelingen.", "И҆ бꙋ́детъ ꙗ҆́кѡ дре́во насажде́ное при и҆схо́дищихъ во́дъ, є҆́же пло́дъ сво́й да́стъ во вре́мѧ своѐ, и҆ ли́стъ є҆гѡ̀ не ѿпаде́тъ: и҆ всѧ̑, є҆ли̑ка а҆́ще твори́тъ, ᲂу҆спѣ́етъ.", "И будет он как дерево, посаженное при потоках вод, которое даст плод свой во время своё, и лист его не опадёт; и всё, что бы он ни делал, будет успешно."]]},
{"id": "ps22", "cat": "lxx", "gr": "Ψαλμὸς κβʹ 1–4", "title": {"ru": "Псалом 22 (23):1–4", "en": "Psalm 22 (23):1–4", "de": "Psalm 22 (23),1–4"}, "bl": {"ru": "«Господь пасет мя»: энклитики и будущее время.", "en": "“The Lord shepherds me”: enclitics and the future tense.", "de": "„Der Herr weidet mich“: Enklitika und Futur."}, "note": {"ru": "В еврейской нумерации — Пс 23. Следите за энклитикой με: она отдаёт ударение предыдущему слову, отсюда ἐξέθρεψέ με, ὡδήγησέ με.", "en": "In the Hebrew numbering this is Psalm 23. Watch the enclitic με: it throws an accent back onto the previous word, hence ἐξέθρεψέ με, ὡδήγησέ με.", "de": "In der hebräischen Zählung ist dies Psalm 23. Achten Sie auf das enklitische με: Es wirft einen Akzent auf das vorhergehende Wort zurück, daher ἐξέθρεψέ με, ὡδήγησέ με."}, "v": [["1", "Κύριος ποιμαίνει με καὶ οὐδέν με ὑστερήσει.", "The Lord shepherds me, and I shall lack nothing.", "Der Herr weidet mich, und nichts wird mir mangeln.", "Гдⷭ҇ь пасе́тъ мѧ̀, и҆ ничто́же мѧ̀ лиши́тъ.", "Господь пасёт меня, и ничего мне не будет недоставать."], ["2", "εἰς τόπον χλόης, ἐκεῖ με κατεσκήνωσεν, ἐπὶ ὕδατος ἀναπαύσεως ἐξέθρεψέ με,", "In a place of green pasture, there he has made me dwell; by the water of rest he has nourished me.", "An einem Ort grüner Weide, da ließ er mich wohnen; am Wasser der Ruhe zog er mich auf.", "На мѣ́стѣ ѕла́чнѣ, та́мѡ всели́ мѧ, на водѣ̀ поко́йнѣ воспита́ мѧ.", "На месте зелёной травы, там Он поселил меня, у воды отдохновения вскормил меня,"], ["3", "τὴν ψυχήν μου ἐπέστρεψεν. ὡδήγησέ με ἐπὶ τρίβους δικαιοσύνης ἕνεκεν τοῦ ὀνόματος αὐτοῦ.", "He has restored my soul; he has led me on paths of righteousness for his name’s sake.", "Meine Seele hat er zurückgeführt; er führte mich auf Pfaden der Gerechtigkeit um seines Namens willen.", "Дꙋ́шꙋ мою̀ ѡ҆братѝ, наста́ви мѧ̀ на стєзѝ пра́вды, и҆́мене ра́ди своегѡ̀.", "душу мою обратил. Наставил меня на стези правды ради имени Своего."], ["4", "ἐὰν γὰρ καὶ πορευθῶ ἐν μέσῳ σκιᾶς θανάτου, οὐ φοβηθήσομαι κακά, ὅτι σὺ μετ᾿ ἐμοῦ εἶ· ἡ ῥάβδος σου καὶ ἡ βακτηρία σου, αὗταί με παρεκάλεσαν.", "For even if I walk in the midst of the shadow of death, I will fear no evil, for you are with me; your rod and your staff, they have comforted me.", "Denn auch wenn ich mitten im Schatten des Todes wandere, werde ich nichts Böses fürchten, denn du bist bei mir; dein Stab und dein Stock, sie haben mich getröstet.", "А҆́ще бо и҆ пойдꙋ̀ посредѣ̀ сѣ́ни сме́ртныѧ, не ᲂу҆бою́сѧ ѕла̀, ꙗ҆́кѡ ты̀ со мно́ю є҆сѝ: же́злъ тво́й и҆ па́лица твоѧ̀, та̑ мѧ̀ ᲂу҆тѣ́шиста.", "Ибо если я и пойду посреди тени смертной, не убоюсь зла, потому что Ты со мною; жезл Твой и посох Твой — они утешили меня."]]},
{"id": "ps50", "cat": "lxx", "gr": "Ψαλμὸς νʹ 1–3", "title": {"ru": "Псалом 50 (51):1–3", "en": "Psalm 50 (51):1–3", "de": "Psalm 50 (51),1–3"}, "bl": {"ru": "«Помилуй мя, Боже»: повелительные формы аориста.", "en": "“Have mercy on me, O God”: aorist imperatives.", "de": "„Erbarme dich meiner, o Gott“: Imperative des Aorists."}, "note": {"ru": "Покаянный псалом, который читается на каждой утрене. Подряд идут повелительные формы аориста: ἐλέησον, ἐξάλειψον, πλῦνον, καθάρισον. Стихи пронумерованы без надписания; в издании Ральфса это стихи 3–5.", "en": "A penitential psalm read at every Matins. Aorist imperatives follow one after another: ἐλέησον, ἐξάλειψον, πλῦνον, καθάρισον. The verses are numbered without the superscription; in Rahlfs’ edition they are vv. 3–5.", "de": "Ein Bußpsalm, der in jedem Orthros gelesen wird. Imperative des Aorists folgen aufeinander: ἐλέησον, ἐξάλειψον, πλῦνον, καθάρισον. Die Verse sind ohne Überschrift gezählt; in der Ausgabe von Rahlfs sind es die Verse 3–5."}, "v": [["1", "Ἐλέησόν με, ὁ Θεός, κατὰ τὸ μέγα ἔλεός σου καὶ κατὰ τὸ πλῆθος τῶν οἰκτιρμῶν σου ἐξάλειψον τὸ ἀνόμημά μου·", "Have mercy on me, O God, according to your great mercy, and according to the multitude of your compassions blot out my transgression.", "Erbarme dich meiner, o Gott, nach deinem großen Erbarmen, und nach der Fülle deiner Barmherzigkeit tilge meine Übertretung.", "Поми́лꙋй мѧ̀, бж҃е, по вели́цѣй млⷭ҇ти твое́й, и҆ по мно́жествꙋ щедро́тъ твои́хъ ѡ҆чⷭ҇ти беззако́нїе моѐ.", "Помилуй меня, Боже, по великой милости Твоей, и по множеству щедрот Твоих изгладь беззаконие моё;"], ["2", "ἐπὶ πλεῖον πλῦνόν με ἀπὸ τῆς ἀνομίας μου καὶ ἀπὸ τῆς ἁμαρτίας μου καθάρισόν με.", "Wash me thoroughly from my lawlessness, and cleanse me from my sin.", "Wasche mich ganz rein von meiner Gesetzlosigkeit, und von meiner Sünde reinige mich.", "Наипа́че ѡ҆мы́й мѧ̀ ѿ беззако́нїѧ моегѡ̀ и҆ ѿ грѣха̀ моегѡ̀ ѡ҆чⷭ҇ти мѧ̀:", "многократно омой меня от беззакония моего и от греха моего очисти меня."], ["3", "ὅτι τὴν ἀνομίαν μου ἐγὼ γινώσκω, καὶ ἡ ἁμαρτία μου ἐνώπιόν μού ἐστι διαπαντός.", "For I know my lawlessness, and my sin is ever before me.", "Denn meine Gesetzlosigkeit erkenne ich, und meine Sünde ist allezeit vor mir.", "ꙗ҆́кѡ беззако́нїе моѐ а҆́зъ зна́ю, и҆ грѣ́хъ мо́й предо мно́ю є҆́сть вы́нꙋ.", "Ибо беззаконие моё я знаю, и грех мой всегда предо мною."]]},
{"id": "ps90", "cat": "lxx", "gr": "Ψαλμὸς ϟʹ 1–6", "title": {"ru": "Псалом 90 (91):1–6", "en": "Psalm 90 (91):1–6", "de": "Psalm 90 (91),1–6"}, "bl": {"ru": "«Живый в помощи Вышняго»: будущее время и образы защиты.", "en": "“He who dwells in the help of the Most High”: future tense and images of protection.", "de": "„Wer in der Hilfe des Höchsten wohnt“: Futur und Bilder des Schutzes."}, "note": {"ru": "Псалом повечерия и молитвенной защиты. Почти все глаголы в будущем: αὐλισθήσεται, ῥύσεται, ἐπισκιάσει, ἐλπιεῖς, φοβηθήσῃ. ἐλπιῶ, ἐλπιεῖς — стяжённое («аттическое») будущее. δαιμόνιον μεσημβρινόν, «бес полуденный», стал в монашеской литературе образом уныния.", "en": "A psalm of Compline and of protection. Almost every verb is future: αὐλισθήσεται, ῥύσεται, ἐπισκιάσει, ἐλπιεῖς, φοβηθήσῃ. ἐλπιῶ, ἐλπιεῖς are contracted (“Attic”) futures. δαιμόνιον μεσημβρινόν, the “noonday demon”, became an image of acedia in monastic literature.", "de": "Ein Psalm der Komplet und des Schutzes. Fast alle Verben stehen im Futur: αὐλισθήσεται, ῥύσεται, ἐπισκιάσει, ἐλπιεῖς, φοβηθήσῃ. ἐλπιῶ, ἐλπιεῖς sind kontrahierte („attische“) Futura. δαιμόνιον μεσημβρινόν, der „Mittagsdämon“, wurde in der monastischen Literatur zum Bild der Akedia."}, "v": [["1", "Ὁ κατοικῶν ἐν βοηθείᾳ τοῦ Ὑψίστου, ἐν σκέπῃ τοῦ Θεοῦ τοῦ οὐρανοῦ αὐλισθήσεται.", "He who dwells in the help of the Most High will abide in the shelter of the God of heaven.", "Wer in der Hilfe des Höchsten wohnt, wird im Schutz des Gottes des Himmels weilen.", "Живы́й въ по́мощи вы́шнѧгѡ, въ кро́вѣ бг҃а нбⷭ҇нагѡ водвори́тсѧ,", "Живущий в помощи Всевышнего под кровом Бога небесного водворится."], ["2", "ἐρεῖ τῷ Κυρίῳ· ἀντιλήπτωρ μου εἶ καὶ καταφυγή μου, ὁ Θεός μου, καὶ ἐλπιῶ ἐπ᾿ αὐτόν,", "He will say to the Lord: You are my protector and my refuge, my God, and I will hope in him.", "Er wird zum Herrn sagen: Du bist mein Beschützer und meine Zuflucht, mein Gott, und ich will auf ihn hoffen.", "рече́тъ гдⷭ҇еви: застꙋ́пникъ мо́й є҆сѝ и҆ прибѣ́жище моѐ, бг҃ъ мо́й, и҆ ᲂу҆пова́ю на него̀.", "Скажет Господу: «Ты заступник мой и прибежище моё, Бог мой, и я буду уповать на Него»,"], ["3", "ὅτι αὐτὸς ῥύσεταί σε ἐκ παγίδος θηρευτῶν καὶ ἀπὸ λόγου ταραχώδους.", "For he will deliver you from the snare of the hunters and from a troubling word.", "Denn er wird dich retten aus der Schlinge der Jäger und vor verwirrender Rede.", "Ꙗ҆́кѡ то́й и҆зба́витъ тѧ̀ ѿ сѣ́ти ло́вчи и҆ ѿ словесѐ мѧте́жна:", "ибо Он избавит тебя от сети ловцов и от слова смущающего."], ["4", "ἐν τοῖς μεταφρένοις αὐτοῦ ἐπισκιάσει σοι, καὶ ὑπὸ τὰς πτέρυγας αὐτοῦ ἐλπιεῖς· ὅπλῳ κυκλώσει σε ἡ ἀλήθεια αὐτοῦ.", "With his shoulders he will overshadow you, and under his wings you will hope; his truth will surround you with a shield.", "Mit seinen Schultern wird er dich überschatten, und unter seinen Flügeln wirst du Hoffnung haben; mit einem Schild wird dich seine Wahrheit umgeben.", "плещма̀ свои́ма ѡ҆сѣни́тъ тѧ̀, и҆ под̾ крилѣ̑ є҆гѡ̀ надѣ́ешисѧ: ѻ҆рꙋ́жїемъ ѡ҆бы́детъ тѧ̀ и҆́стина є҆гѡ̀.", "Плечами Своими Он осенит тебя, и под крыльями Его будешь уповать; щитом окружит тебя истина Его."], ["5", "οὐ φοβηθήσῃ ἀπὸ φόβου νυκτερινοῦ, ἀπὸ βέλους πετομένου ἡμέρας,", "You will not be afraid of the terror of the night, of the arrow that flies by day,", "Du wirst dich nicht fürchten vor dem Schrecken der Nacht, vor dem Pfeil, der am Tag fliegt,", "Не ᲂу҆бои́шисѧ ѿ стра́ха нощна́гѡ, ѿ стрѣлы̀ летѧ́щїѧ во днѝ,", "Не убоишься страха ночного, стрелы, летящей днём,"], ["6", "ἀπὸ πράγματος ἐν σκότει διαπορευομένου, ἀπὸ συμπτώματος καὶ δαιμονίου μεσημβρινοῦ.", "of the thing that walks in darkness, of mishap and the demon of noonday.", "vor dem Ding, das im Finstern umgeht, vor Unglück und dem Dämon des Mittags.", "ѿ ве́щи во тьмѣ̀ преходѧ́щїѧ, ѿ срѧ́ща и҆ бѣ́са полꙋ́деннагѡ.", "того, что ходит во тьме, напасти и беса полуденного."]]},
{"id": "ps140", "cat": "lxx", "gr": "Ψαλμὸς ρμʹ 1–2", "title": {"ru": "Псалом 140 (141):1–2", "en": "Psalm 140 (141):1–2", "de": "Psalm 140 (141),1–2"}, "bl": {"ru": "«Господи, воззвах»: псалом вечерни.", "en": "“Lord, I have cried to you”: the Vespers psalm.", "de": "„Herr, ich habe zu dir gerufen“: der Vesperpsalm."}, "note": {"ru": "Псалом, с которого начинается вечерня. ἐκέκραξα — аорист с удвоением, характерный для Септуагинты. ἐν τῷ κεκραγέναι με — субстантивированный инфинитив: «когда я взываю».", "en": "The psalm with which Vespers begins. ἐκέκραξα is an aorist with reduplication, typical of the Septuagint. ἐν τῷ κεκραγέναι με is an articular infinitive: “when I cry”.", "de": "Der Psalm, mit dem die Vesper beginnt. ἐκέκραξα ist ein reduplizierter Aorist, typisch für die Septuaginta. ἐν τῷ κεκραγέναι με ist ein substantivierter Infinitiv: „wenn ich rufe“."}, "v": [["1", "Κύριε, ἐκέκραξα πρὸς σέ, εἰσάκουσόν μου· πρόσχες τῇ φωνῇ τῆς δεήσεώς μου ἐν τῷ κεκραγέναι με πρὸς σέ.", "Lord, I have cried to you, hear me; attend to the voice of my supplication when I cry to you.", "Herr, ich habe zu dir gerufen, erhöre mich; achte auf die Stimme meines Flehens, wenn ich zu dir rufe.", "Гдⷭ҇и, воззва́хъ къ тебѣ̀, ᲂу҆слы́ши мѧ̀: вонмѝ гла́сꙋ моле́нїѧ моегѡ̀, внегда̀ воззва́ти мѝ къ тебѣ̀.", "Господи, я воззвал к Тебе, услышь меня; внемли голосу моления моего, когда я взываю к Тебе."], ["2", "κατευθυνθήτω ἡ προσευχή μου ὡς θυμίαμα ἐνώπιόν σου, ἔπαρσις τῶν χειρῶν μου θυσία ἑσπερινή.", "Let my prayer be directed as incense before you, the lifting up of my hands as an evening sacrifice.", "Wie Weihrauch steige mein Gebet vor dir auf, das Erheben meiner Hände sei wie ein Abendopfer.", "Да и҆спра́витсѧ моли́тва моѧ̀ ꙗ҆́кѡ кади́ло пред̾ тобо́ю: воздѣѧ́нїе рꙋкꙋ̀ моє́ю, же́ртва вече́рнѧѧ.", "Да направится молитва моя, как фимиам, пред Тобою, воздеяние рук моих — жертва вечерняя."]]},
{"id": "is6", "cat": "lxx", "gr": "Ἡσαΐας ϛʹ 1–3", "title": {"ru": "Видение Исаии, Ис 6:1–3", "en": "The vision of Isaiah, Is 6:1–3", "de": "Die Vision Jesajas, Jes 6,1–3"}, "bl": {"ru": "Ἅγιος, ἅγιος, ἅγιος — источник ангельской песни литургии.", "en": "Ἅγιος, ἅγιος, ἅγιος: the source of the Sanctus of the liturgy.", "de": "Ἅγιος, ἅγιος, ἅγιος: die Quelle des Sanctus der Liturgie."}, "note": {"ru": "Слова серафимов вошли в анафору Божественной литургии («Свят, свят, свят Господь Саваоф»). εἱστήκεισαν — плюсквамперфект от ἵστημι в значении простого прошедшего: «стояли». ἐκέκραγεν — форма с удвоением от κράζω.", "en": "The words of the Seraphim entered the anaphora of the Divine Liturgy (“Holy, holy, holy, Lord Sabaoth”). εἱστήκεισαν is the pluperfect of ἵστημι with simple past meaning: “they stood”. ἐκέκραγεν is a reduplicated form of κράζω.", "de": "Die Worte der Serafim gingen in die Anaphora der Göttlichen Liturgie ein („Heilig, heilig, heilig, Herr Sabaoth“). εἱστήκεισαν ist das Plusquamperfekt von ἵστημι mit einfacher Vergangenheitsbedeutung: „sie standen“. ἐκέκραγεν ist eine reduplizierte Form von κράζω."}, "v": [["1", "Καὶ ἐγένετο τοῦ ἐνιαυτοῦ, οὗ ἀπέθανεν Ὀζίας ὁ βασιλεύς, εἶδον τὸν Κύριον καθήμενον ἐπὶ θρόνου ὑψηλοῦ καὶ ἐπῃρμένου, καὶ πλήρης ὁ οἶκος τῆς δόξης αὐτοῦ.", "And it happened in the year in which King Uzziah died: I saw the Lord sitting on a throne, high and lifted up, and the house was full of his glory.", "Und es geschah in dem Jahr, in dem König Usija starb: Ich sah den Herrn auf einem hohen und erhabenen Thron sitzen, und das Haus war voll seiner Herrlichkeit.", "И҆ бы́сть въ лѣ́то, въ не́же ᲂу҆́мре ѻ҆зі́а ца́рь, ви́дѣхъ гдⷭ҇а сѣдѧ́ща на прⷭ҇то́лѣ высо́цѣ и҆ превознесе́ннѣ, и҆ и҆спо́лнь до́мъ сла́вы є҆гѡ̀.", "И было: в год, когда умер царь Озия, я увидел Господа, сидящего на престоле высоком и превознесённом, и дом был полон славы Его."], ["2", "καὶ Σεραφὶμ εἱστήκεισαν κύκλῳ αὐτοῦ, ἓξ πτέρυγες τῷ ἑνὶ καὶ ἓξ πτέρυγες τῷ ἑνί, καὶ ταῖς μὲν δυσὶ κατεκάλυπτον τὸ πρόσωπον, ταῖς δὲ δυσὶ κατεκάλυπτον τοὺς πόδας καὶ ταῖς δυσὶν ἐπέταντο.", "And Seraphim stood around him; six wings to the one and six wings to the other: with two they covered the face, with two they covered the feet, and with two they flew.", "Und Serafim standen rings um ihn, sechs Flügel hatte der eine und sechs Flügel der andere: mit zweien bedeckten sie das Gesicht, mit zweien bedeckten sie die Füße, und mit zweien flogen sie.", "И҆ серафі́ми стоѧ́хꙋ ѡ҆́крестъ є҆гѡ̀, ше́сть кри́лъ є҆ди́номꙋ и҆ ше́сть кри́лъ дрꙋго́мꙋ: и҆ двѣма̀ ᲂу҆́бѡ покрыва́хꙋ ли́ца своѧ̑, двѣма́ же покрыва́хꙋ но́ги своѧ̑ и҆ двѣма̀ лета́хꙋ.", "И серафимы стояли вокруг Него; шесть крыльев у одного и шесть крыльев у другого; и двумя закрывали они лицо, двумя закрывали ноги и двумя летали."], ["3", "καὶ ἐκέκραγεν ἕτερος πρὸς τὸν ἕτερον καὶ ἔλεγον· ἅγιος, ἅγιος, ἅγιος Κύριος σαβαώθ, πλήρης πᾶσα ἡ γῆ τῆς δόξης αὐτοῦ.", "And one cried out to the other, and they said: Holy, holy, holy, Lord Sabaoth; the whole earth is full of his glory.", "Und einer rief dem anderen zu, und sie sprachen: Heilig, heilig, heilig ist der Herr Sabaoth; die ganze Erde ist voll seiner Herrlichkeit.", "И҆ взыва́хꙋ дрꙋ́гъ ко дрꙋ́гꙋ и҆ глаго́лахꙋ: ст҃ъ, ст҃ъ, ст҃ъ гдⷭ҇ь саваѡ́ѳъ: и҆спо́лнь всѧ̀ землѧ̀ сла́вы є҆гѡ̀.", "И взывал один к другому, и говорили: «Свят, свят, свят Господь Саваоф, вся земля полна славы Его»."]]},
{"id": "is9", "cat": "lxx", "gr": "Ἡσαΐας θʹ 6", "title": {"ru": "Отроча родися нам, Ис 9:6", "en": "Unto us a child is born, Is 9:6", "de": "Ein Kind ist uns geboren, Jes 9,6"}, "bl": {"ru": "Μεγάλης βουλῆς ἄγγελος — пророчество, которое поётся на Рождество.", "en": "Μεγάλης βουλῆς ἄγγελος: a prophecy sung at Christmas.", "de": "Μεγάλης βουλῆς ἄγγελος: eine Prophetie, die zu Weihnachten gesungen wird."}, "note": {"ru": "Церковный текст даёт расширенный список имён (μεγάλης βουλῆς ἄγγελος, θαυμαστὸς σύμβουλος…); в издании Ральфса — только μεγάλης βουλῆς ἄγγελος, и это стих 9:5. «Ангел великого совета» стал именем Христа в гимнографии и иконографии.", "en": "The ecclesiastical text has the longer list of names (μεγάλης βουλῆς ἄγγελος, θαυμαστὸς σύμβουλος…); Rahlfs’ edition has only μεγάλης βουλῆς ἄγγελος and numbers the verse 9:5. “Angel of Great Counsel” became a title of Christ in hymnography and iconography.", "de": "Der kirchliche Text bietet die längere Namensliste (μεγάλης βουλῆς ἄγγελος, θαυμαστὸς σύμβουλος…); die Ausgabe von Rahlfs hat nur μεγάλης βουλῆς ἄγγελος und zählt den Vers als 9,5. „Engel des großen Ratschlusses“ wurde in Hymnographie und Ikonographie zu einem Titel Christi."}, "v": [["6", "ὅτι παιδίον ἐγενήθη ἡμῖν, υἱὸς καὶ ἐδόθη ἡμῖν, οὗ ἡ ἀρχὴ ἐγενήθη ἐπὶ τοῦ ὤμου αὐτοῦ, καὶ καλεῖται τὸ ὄνομα αὐτοῦ μεγάλης βουλῆς ἄγγελος, θαυμαστὸς σύμβουλος, Θεὸς ἰσχυρός, ἐξουσιαστής, ἄρχων εἰρήνης, πατὴρ τοῦ μέλλοντος αἰῶνος· ἐγὼ γὰρ ἄξω εἰρήνην ἐπὶ τοὺς ἄρχοντας, εἰρήνην καὶ ὑγίειαν αὐτῷ.", "For a child has been born to us, a son also has been given to us, whose rule has come upon his shoulder; and his name is called Angel of Great Counsel, Wonderful Counsellor, Mighty God, Ruler, Prince of Peace, Father of the age to come; for I will bring peace upon the rulers, peace and health to him.", "Denn ein Kind ist uns geboren, ein Sohn ist uns gegeben, dessen Herrschaft auf seiner Schulter ruht; und sein Name wird genannt: Engel des großen Ratschlusses, wunderbarer Ratgeber, starker Gott, Machthaber, Fürst des Friedens, Vater des kommenden Äons; denn ich werde Frieden über die Herrscher bringen, Frieden und Heil für ihn.", "Ꙗ҆́кѡ ѻ҆троча̀ роди́сѧ на́мъ, сн҃ъ, и҆ даде́сѧ на́мъ, є҆гѡ́же нача́льство бы́сть на ра́мѣ є҆гѡ̀: и҆ нарица́етсѧ и҆́мѧ є҆гѡ̀: вели́ка совѣ́та а҆́гг҃лъ, чꙋ́денъ, совѣ́тникъ, бг҃ъ крѣ́пкїй, властели́нъ, кн҃зь ми́ра, ѻ҆ц҃ъ бꙋ́дꙋщагѡ вѣ́ка: приведꙋ́ бо ми́ръ на кнѧ̑зи, ми́ръ и҆ здра́вїе є҆мꙋ̀.", "Ибо младенец родился нам, и Сын дан нам, владычество Которого — на плече Его, и нарекается имя Его: Великого Совета Ангел, Чудный Советник, Бог крепкий, Властитель, Князь мира, Отец будущего века; ибо Я наведу мир на князей, мир и здравие Ему."]]},
{"id": "vant", "cat": "vit", "gr": "Βίος Ἀντωνίου αʹ–γʹ", "title": {"ru": "Житие Антония Великого, гл. 1–3", "en": "Life of Antony the Great, chs. 1–3", "de": "Leben des Antonius des Großen, Kap. 1–3"}, "bl": {"ru": "Свт. Афанасий Александрийский: детство Антония, евангельский призыв и первые годы подвига.", "en": "St Athanasius of Alexandria: Antony’s childhood, the Gospel call and his first years of ascesis.", "de": "Athanasius von Alexandria: die Kindheit des Antonius, der Ruf des Evangeliums und die ersten Jahre seiner Askese."}, "note": {"ru": "Текст по изданию Ж.-П. Миня (Patrologia Graeca, т. 26), главы 1–3 полностью. Житие написано свт. Афанасием около 357 года, ещё в поздней античности, но именно оно стало образцом для всей византийской агиографии. Евангельская цитата в гл. 2 соединяет Мф 19:21 с параллельными местами; ἄρουρα — египетская мера земли.", "en": "Text from J.-P. Migne’s edition (Patrologia Graeca, vol. 26), chapters 1–3 complete. Athanasius wrote the Life around 357, still in late antiquity, yet it became the model for all Byzantine hagiography. The Gospel quotation in ch. 2 combines Mt 19:21 with parallel passages; ἄρουρα is an Egyptian land measure.", "de": "Text nach der Ausgabe von J.-P. Migne (Patrologia Graeca, Bd. 26), Kapitel 1–3 vollständig. Athanasius schrieb die Vita um 357, noch in der Spätantike, doch sie wurde zum Vorbild der gesamten byzantinischen Hagiographie. Das Evangelienzitat in Kap. 2 verbindet Mt 19,21 mit Parallelstellen; ἄρουρα ist ein ägyptisches Flächenmaß."}, "v": [["1", "Ἀντώνιος γένος μὲν ἦν Αἰγύπτιος, εὐγενῶν δὲ γονέων καὶ περιουσίαν αὐτάρκη κεκτημένων, καὶ Χριστιανῶν αὐτῶν ὄντων, Χριστιανικῶς ἀνήγετο καὶ αὐτός.", "Antony was an Egyptian by birth, of noble parents who possessed sufficient wealth; and since they were Christians, he too was brought up in a Christian way.", "Antonius war von Geburt Ägypter, Sohn vornehmer Eltern, die ein ausreichendes Vermögen besaßen; und da sie Christen waren, wurde auch er christlich erzogen.", "", "Антоний родом был египтянин, от родителей благородных и владевших достаточным состоянием; и так как они были христианами, то и сам он воспитывался по-христиански."], ["", "Καὶ παιδίον μὲν ὤν, ἐτρέφετο παρὰ τοῖς γονεῦσι, πλέον αὐτῶν καὶ τοῦ οἴκου μηδὲν ἕτερον γινώσκων·", "As a small child he was raised by his parents, knowing nothing besides them and his home;", "Als kleines Kind wuchs er bei seinen Eltern auf und kannte nichts anderes als sie und sein Zuhause;", "", "Будучи малым ребёнком, он рос при родителях, не зная ничего иного, кроме них и своего дома;"], ["", "ἐπειδὴ δὲ καὶ αὐξήσας ἐγένετο παῖς, καὶ προέκοπτε τῇ ἡλικίᾳ, γράμματα μὲν μαθεῖν οὐκ ἠνέσχετο, βουλόμενος ἐκτὸς εἶναι καὶ τῆς πρὸς τοὺς παῖδας συνηθείας· τὴν δὲ ἐπιθυμίαν πᾶσαν εἶχε, κατὰ τὸ γεγραμμένον περὶ τοῦ Ἰακώβ, ὡς ἄπλαστος οἰκεῖν ἐν τῇ οἰκίᾳ αὐτοῦ.", "and when he grew and became a boy and advanced in age, he would not bear to learn letters, wishing to keep apart even from the company of other boys; all his desire was, as it is written of Jacob, to dwell as a plain man in his house.", "als er aber herangewachsen und ein Knabe geworden war und an Alter zunahm, wollte er sich nicht dazu verstehen, lesen und schreiben zu lernen, weil er sich auch vom Umgang mit den anderen Knaben fernhalten wollte; sein ganzes Verlangen war es, wie von Jakob geschrieben steht, als schlichter Mensch in seinem Haus zu wohnen.", "", "когда же он подрос, стал отроком и преуспевал в возрасте, то учиться грамоте не захотел, желая держаться в стороне даже от общения с детьми; всё же желание его было, по написанному об Иакове, жить в простоте в доме своём."], ["", "Συνήγετο μέντοι μετὰ τῶν γονέων ἐν τῷ Κυριακῷ· καὶ οὔτε ὡς παῖς ἐρρᾳθύμει, οὔτε ὡς τῇ ἡλικίᾳ προκόπτων κατεφρόνει· ἀλλὰ καὶ τοῖς γονεῦσιν ὑπετάσσετο, καὶ τοῖς ἀναγνώσμασι προσέχων, τὴν ἐξ αὐτῶν ὠφέλειαν ἐν ἑαυτῷ διετήρει.", "Yet he went with his parents to the church; he was not careless as a child, nor did he look down on it as he grew older; he obeyed his parents and, attending to the readings, kept their benefit within himself.", "Doch ging er mit seinen Eltern in die Kirche; er war als Kind nicht nachlässig und verachtete sie nicht, als er älter wurde; vielmehr gehorchte er seinen Eltern, achtete auf die Lesungen und bewahrte ihren Nutzen in sich.", "", "Однако он ходил с родителями на собрания в храм; и ни по-детски не был нерадив, ни, становясь старше, не пренебрегал этим; но и родителям повиновался, и, внимая чтениям, сохранял в себе пользу от них."], ["", "Οὔτε δὲ πάλιν ὡς παῖς ἐν μετρίᾳ περιουσίᾳ τυγχάνων ἠνώχλει τοῖς γονεῦσι ποικίλης καὶ πολυτελοῦς ἕνεκα τροφῆς, οὔτε τὰς ἐκ ταύτης ἡδονὰς ἐζήτει· μόνοις δὲ οἷς ηὕρισκεν ἠρκεῖτο, καὶ πλέον οὐδὲν ἐζήτει.", "Nor again, though as a child he lived in moderate wealth, did he trouble his parents for varied and costly food or seek the pleasures that come from it; he was content with whatever he found and sought nothing more.", "Und obwohl er als Kind in bescheidenem Wohlstand lebte, bedrängte er seine Eltern nicht um abwechslungsreiche und kostspielige Speise und suchte nicht die Genüsse, die sie bietet; er begnügte sich mit dem, was er vorfand, und verlangte nichts weiter.", "", "И опять же, будучи ребёнком и живя в умеренном достатке, он не докучал родителям ради разнообразной и дорогой пищи и не искал удовольствий от неё; он довольствовался лишь тем, что находил, и большего не искал."], ["2", "Μετὰ δὲ τὸν θάνατον τῶν γονέων, αὐτὸς μόνος κατελείφθη μετὰ μιᾶς βραχυτάτης ἀδελφῆς· καὶ ἦν ἐτῶν ἐγγὺς δέκα καὶ ὀκτώ, ἢ καὶ εἴκοσι γεγονώς, αὐτός τε τῆς οἰκίας καὶ τῆς ἀδελφῆς ἐφρόντιζεν.", "After the death of his parents he was left alone with one very young sister; he was about eighteen or twenty years old, and he himself took care of the house and of his sister.", "Nach dem Tod seiner Eltern blieb er allein mit einer ganz kleinen Schwester zurück; er war etwa achtzehn oder zwanzig Jahre alt und sorgte selbst für das Haus und die Schwester.", "", "После смерти родителей он остался один с единственной, совсем маленькой сестрой; было ему около восемнадцати или даже двадцати лет, и он сам заботился и о доме, и о сестре."], ["", "Οὔπω δὲ μῆνες ἓξ παρῆλθον τοῦ θανάτου τῶν γονέων αὐτοῦ, καὶ κατὰ τὸ εἰωθὸς προερχόμενος εἰς τὸ Κυριακόν, καὶ συνάγων ἑαυτοῦ τὴν διάνοιαν, ἐλογίζετο περιπατῶν, πῶς οἱ μὲν ἀπόστολοι πάντα καταλιπόντες ἠκολούθησαν τῷ Σωτῆρι· οἱ δὲ ἐν ταῖς Πράξεσι πωλοῦντες τὰ ἑαυτῶν ἔφερον καὶ ἐτίθουν παρὰ τοὺς πόδας τῶν ἀποστόλων, εἰς διάδοσιν τῶν χρείαν ἐχόντων, τίς τε καὶ πόση τούτοις ἐλπὶς ἐν οὐρανοῖς ἀπόκειται.", "Six months had not yet passed since his parents’ death when, going to the church as was his custom and collecting his thoughts, he reflected as he walked how the apostles left everything and followed the Saviour; how those in the Acts sold what was theirs and brought it and laid it at the feet of the apostles for distribution to those in need; and what and how great a hope is laid up for them in heaven.", "Noch waren keine sechs Monate seit dem Tod seiner Eltern vergangen, als er wie gewohnt zur Kirche ging, seine Gedanken sammelte und unterwegs überlegte, wie die Apostel alles verlassen hatten und dem Erlöser gefolgt waren; wie die Gläubigen in der Apostelgeschichte ihren Besitz verkauften, den Erlös brachten und den Aposteln zu Füßen legten, damit er an die Bedürftigen verteilt werde; und welche und wie große Hoffnung ihnen im Himmel aufbewahrt ist.", "", "Не прошло ещё и шести месяцев после смерти его родителей, как он, идя по обыкновению в храм и собрав воедино свои мысли, размышлял дорогой о том, как апостолы, оставив всё, последовали за Спасителем; как те, о ком говорится в Деяниях, продавая своё, приносили и полагали к ногам апостолов для раздачи нуждающимся; и какое и сколь великое упование уготовано им на небесах."], ["", "Ταῦτα δὴ ἐνθυμούμενος, εἰσῆλθεν εἰς τὴν ἐκκλησίαν, καὶ συνέβη τότε τὸ Εὐαγγέλιον ἀναγινώσκεσθαι, καὶ ἤκουσε τοῦ Κυρίου λέγοντος τῷ πλουσίῳ· Εἰ θέλεις τέλειος εἶναι, ὕπαγε, πώλησον πάντα τὰ ὑπάρχοντά σοι, καὶ δὸς πτωχοῖς, καὶ δεῦρο ἀκολούθει μοι, καὶ ἕξεις θησαυρὸν ἐν οὐρανοῖς.", "Pondering these things he entered the church, and it happened that the Gospel was being read just then, and he heard the Lord saying to the rich man: “If you wish to be perfect, go, sell all that you have and give to the poor, and come, follow me, and you will have treasure in heaven.”", "Mit solchen Gedanken betrat er die Kirche, und es traf sich, dass gerade das Evangelium gelesen wurde, und er hörte den Herrn zu dem Reichen sagen: „Wenn du vollkommen sein willst, geh, verkaufe alles, was du hast, und gib es den Armen, und komm, folge mir nach, und du wirst einen Schatz im Himmel haben.“", "", "Размышляя об этом, он вошёл в церковь, и случилось, что тогда читалось Евангелие, и он услышал, как Господь говорит богатому: «Если хочешь быть совершенным, пойди, продай всё, что имеешь, и раздай нищим, и приходи, следуй за Мною, и будешь иметь сокровище на небесах»."], ["", "Ὁ δὲ Ἀντώνιος, ὥσπερ θεόθεν ἐσχηκὼς τὴν τῶν ἁγίων μνήμην, καὶ ὡς δι᾿ αὐτὸν γενομένου τοῦ ἀναγνώσματος, ἐξελθὼν εὐθὺς ἐκ τοῦ Κυριακοῦ, τὰς μὲν κτήσεις ἃς εἶχεν ἐκ προγόνων (ἄρουραι δὲ ἦσαν τριακόσιαι εὔφοροι καὶ πάνυ καλαί), ταύτας ἐχαρίσατο τοῖς ἀπὸ τῆς κώμης, ἵνα εἰς μηδ᾿ ὁτιοῦν ὀχλήσωσιν αὐτῷ τε καὶ τῇ ἀδελφῇ.", "And Antony, as if he had received the memory of the saints from God and as if the reading had been for his sake, went out of the church at once; the possessions he had from his forefathers (three hundred fertile and very fine arourai) he gave to the people of the village, so that they would not trouble him and his sister in any way.", "Antonius aber, als hätte er die Erinnerung an die Heiligen von Gott empfangen und als wäre die Lesung um seinetwillen geschehen, ging sogleich aus der Kirche hinaus; die Besitzungen, die er von seinen Vorfahren hatte (es waren dreihundert fruchtbare und sehr schöne Aruren), schenkte er den Leuten aus dem Dorf, damit sie ihm und seiner Schwester in keiner Weise zur Last fielen.", "", "Антоний же, словно получив от Бога воспоминание о святых и словно ради него было это чтение, тотчас вышел из храма и владения, доставшиеся ему от предков (а было это триста арур земли, плодородной и весьма хорошей), подарил жителям селения, чтобы они ни в чём не обременяли ни его, ни сестру."], ["", "Τὰ δὲ ἄλλα ὅσα ἦν αὐτοῖς κινητά, πάντα πωλήσας, καὶ συναγαγὼν ἀργύριον ἱκανόν, δέδωκε τοῖς πτωχοῖς, τηρήσας ὀλίγα διὰ τὴν ἀδελφήν.", "All the rest of their movable property he sold, and having collected a considerable sum of money he gave it to the poor, keeping a little for his sister’s sake.", "Alles übrige bewegliche Gut verkaufte er, sammelte eine ansehnliche Summe Geld und gab sie den Armen; nur weniges behielt er um der Schwester willen zurück.", "", "Всё же прочее движимое имущество, какое у них было, он продал и, собрав немало денег, раздал нищим, оставив немного ради сестры."], ["3", "Ὡς δὲ πάλιν εἰσελθὼν εἰς τὸ Κυριακόν, ἤκουσεν ἐν τῷ Εὐαγγελίῳ τοῦ Κυρίου λέγοντος· Μὴ μεριμνήσητε περὶ τῆς αὔριον, οὐκ ἀνασχόμενος ἔτι μένειν, ἐξελθὼν διέδωκε κἀκεῖνα τοῖς μετρίοις.", "When he entered the church again and heard the Lord saying in the Gospel, “Do not be anxious about tomorrow,” he could not bear to stay any longer, but went out and gave away those things too to people of modest means.", "Als er aber wieder in die Kirche kam und im Evangelium den Herrn sagen hörte: „Sorgt euch nicht um den morgigen Tag“, hielt er es nicht länger aus, ging hinaus und verteilte auch dies an Menschen in bescheidenen Verhältnissen.", "", "Когда же, снова войдя в храм, он услышал в Евангелии, как Господь говорит: «Не заботьтесь о завтрашнем дне», — то, не в силах дольше оставаться, вышел и раздал и то немногое людям скромного достатка."], ["", "Τὴν δὲ ἀδελφὴν παραθέμενος γνωρίμοις καὶ πισταῖς παρθένοις, δούς τε αὐτὴν εἰς Παρθενῶνα ἀνατρέφεσθαι, αὐτὸς πρὸ τῆς οἰκίας ἐσχόλαζε λοιπὸν τῇ ἀσκήσει, προσέχων ἑαυτῷ καὶ καρτερικῶς ἑαυτὸν ἄγων.", "Entrusting his sister to known and faithful virgins and giving her to a convent to be brought up, he himself from then on devoted himself to ascetic practice in front of his house, attending to himself and conducting himself with endurance.", "Seine Schwester vertraute er bekannten und treuen Jungfrauen an und übergab sie einem Jungfrauenhaus zur Erziehung; er selbst widmete sich fortan vor seinem Haus der Askese, achtete auf sich selbst und führte ein Leben in Standhaftigkeit.", "", "Сестру же он поручил знакомым и верным девам и отдал её на воспитание в обитель дев, а сам с тех пор предался подвижничеству перед своим домом, внимая себе и живя в суровом терпении."], ["", "Οὔπω γὰρ ἦν οὕτως ἐν Αἰγύπτῳ συνεχῆ μοναστήρια, οὐδ᾿ ὅλως ᾔδει μοναχὸς τὴν μακρὰν ἔρημον· ἕκαστος δὲ τῶν βουλομένων ἑαυτῷ προσέχειν οὐ μακρὰν τῆς ἰδίας κώμης καταμόνας ἠσκεῖτο.", "For there were not yet so many monasteries in Egypt, and no monk at all knew the distant desert; each of those who wished to attend to himself practised asceticism alone, not far from his own village.", "Denn es gab in Ägypten noch nicht so viele Klöster, und kein Mönch kannte überhaupt die ferne Wüste; jeder, der auf sich selbst achten wollte, übte sich allein, nicht weit von seinem eigenen Dorf.", "", "Ибо в Египте ещё не было так много монастырей, и монах вовсе не знал дальней пустыни; но каждый из желавших внимать себе подвизался в уединении недалеко от своего селения."], ["", "Ἦν τοίνυν ἐν τῇ πλησίον κώμῃ τότε γέρων, ἐκ νεότητος τὸν μονήρη βίον ἀσκήσας· τοῦτον ἰδὼν Ἀντώνιος, ἐζήλωσεν ἐν καλῷ· καὶ πρῶτον μὲν ἤρξατο καὶ αὐτὸς μένειν ἐν τοῖς πρὸ τῆς κώμης τόποις.", "Now there was at that time in the neighbouring village an old man who had lived the solitary life from his youth; seeing him, Antony emulated him in good; and at first he too began to stay in the places outside the village.", "Es gab nun damals im benachbarten Dorf einen Greis, der von Jugend an das einsame Leben geführt hatte; als Antonius ihn sah, eiferte er ihm im Guten nach; und zuerst begann auch er, sich an den Orten vor dem Dorf aufzuhalten.", "", "Был же тогда в соседнем селении старец, с юности проводивший уединённую жизнь; увидев его, Антоний стал подражать ему в добром; и сначала он и сам начал жить в местах вне селения."], ["", "Κἀκεῖθεν εἴ που τινὰ σπουδαῖον ἤκουεν, προερχόμενος ἐζήτει τοῦτον ὡς ἡ σοφὴ μέλισσα· καὶ οὐ πρότερον εἰς τὸν ἴδιον τόπον ἀνέκαμπτεν, εἰ μὴ τοῦτον ἑωράκει, καὶ ὥσπερ ἐφόδιόν τι τῆς εἰς ἀρετὴν ὁδοῦ παρ᾿ αὐτοῦ λαβών, ἐπανῄει.", "And from there, if he heard of anyone zealous anywhere, he would go out and seek him like the wise bee; and he did not return to his own place until he had seen him and received from him, as it were, some provision for the road to virtue.", "Und wenn er von dort aus irgendwo von einem eifrigen Mann hörte, ging er hin und suchte ihn auf wie die weise Biene; und er kehrte nicht eher an seinen Ort zurück, bis er ihn gesehen und von ihm gleichsam eine Wegzehrung für den Weg zur Tugend empfangen hatte.", "", "И оттуда, если слышал где о каком-либо ревностном человеке, он выходил и искал его, как мудрая пчела, и не возвращался на своё место, пока не повидает его; и, получив от него как бы некий запас на путь к добродетели, возвращался."]]},
{"id": "apo", "cat": "vit", "gr": "Ἀποφθέγματα τῶν Πατέρων", "title": {"ru": "Изречения отцов: Антоний 1, Моисей 6", "en": "Sayings of the Fathers: Antony 1, Moses 6", "de": "Aussprüche der Väter: Antonios 1, Moses 6"}, "bl": {"ru": "Короткие рассказы пустынников: простой синтаксис, причастия.", "en": "Short stories of the desert fathers: simple syntax, participles.", "de": "Kurze Erzählungen der Wüstenväter: einfache Syntax, Partizipien."}, "note": {"ru": "Алфавитное собрание апофтегм. Типичные черты: историческое настоящее (βλέπει, λέγει), цепочки причастий, прямая речь без союза.", "en": "The alphabetical collection of the Apophthegmata. Typical features: the historical present (βλέπει, λέγει), chains of participles, direct speech without a conjunction.", "de": "Die alphabetische Sammlung der Apophthegmata. Typische Merkmale: historisches Präsens (βλέπει, λέγει), Partizipialketten, direkte Rede ohne Konjunktion."}, "v": [[{"ru": "Авва Антоний, 1", "en": "Abba Antony, 1", "de": "Abbas Antonios, 1"}, "", "", "", ""], ["", "Ὁ ἅγιος ἀββᾶς Ἀντώνιος, καθεζόμενός ποτε ἐν τῇ ἐρήμῳ, ἐν ἀκηδίᾳ καὶ πολλῷ σκοτασμῷ λογισμῶν γέγονε· καὶ ἔλεγε πρὸς τὸν Θεόν· Κύριε, θέλω σωθῆναι, καὶ οὐκ ἀφιᾶσί με οἱ λογισμοί· τί ποιήσω ἐν τῇ θλίψει μου; πῶς σωθῶ;", "The holy abba Antony, while sitting once in the desert, fell into listlessness and a great darkness of thoughts; and he said to God: “Lord, I want to be saved, and my thoughts do not let me. What shall I do in my affliction? How shall I be saved?”", "Der heilige Abbas Antonios geriet, als er einst in der Wüste saß, in Überdruss und große Verfinsterung der Gedanken; und er sprach zu Gott: „Herr, ich will gerettet werden, und meine Gedanken lassen mich nicht. Was soll ich in meiner Bedrängnis tun? Wie werde ich gerettet?“", "", "Святой авва Антоний, сидя однажды в пустыне, впал в уныние и великое омрачение помыслов; и говорил он Богу: «Господи, хочу спастись, а помыслы не дают мне. Что мне делать в скорби моей? Как мне спастись?»"], ["", "Καὶ μικρὸν ἐξελθὼν εἰς τὰ ἔξω, βλέπει τινὰ ὡς ἑαυτὸν καθήμενον καὶ ἐργαζόμενον, εἶτα ἀνιστάμενον ἀπὸ τοῦ ἔργου καὶ προσευχόμενον, καὶ πάλιν καθεζόμενον καὶ τὴν σειρὰν πλέκοντα, εἶτα πάλιν εἰς προσευχὴν ἀνιστάμενον.", "And going out a little way, he sees someone like himself sitting and working, then rising from his work and praying, and again sitting and plaiting a rope, then rising again to pray.", "Und als er ein wenig hinausging, sieht er jemanden wie sich selbst sitzen und arbeiten, dann von der Arbeit aufstehen und beten, und wieder sitzen und ein Seil flechten, dann wieder zum Gebet aufstehen.", "", "И, выйдя ненадолго наружу, видит он кого-то, подобного себе: тот сидит и работает, потом встаёт от работы и молится, и снова садится и плетёт верёвку, потом опять встаёт на молитву."], ["", "Ἦν δὲ ἄγγελος Κυρίου ἀποσταλεὶς πρὸς διόρθωσιν καὶ ἀσφάλειαν αὐτοῦ. Καὶ ἤκουσε τοῦ ἀγγέλου λέγοντος· Οὕτως ποίει καὶ σώζῃ.", "It was an angel of the Lord, sent for his correction and assurance. And he heard the angel saying: “Do this, and you will be saved.”", "Es war ein Engel des Herrn, gesandt zu seiner Zurechtweisung und Bestärkung. Und er hörte den Engel sagen: „So mache es, und du wirst gerettet.“", "", "Это был ангел Господень, посланный для его исправления и утверждения. И он услышал, как ангел говорит: «Так делай — и спасёшься»."], ["", "Ὁ δὲ ἀκούσας, πολλὴν χαρὰν ἔσχε καὶ θάρσος· καὶ οὕτως ποιῶν, ἐσώζετο.", "Hearing this, he had great joy and courage; and by doing so he was saved.", "Als er das hörte, empfing er große Freude und Zuversicht; und indem er so handelte, wurde er gerettet.", "", "Услышав это, он исполнился великой радости и мужества; и, поступая так, спасался."], [{"ru": "Авва Моисей, 6", "en": "Abba Moses, 6", "de": "Abbas Moses, 6"}, "", "", "", ""], ["", "Ἀδελφὸς παρέβαλεν εἰς Σκῆτιν πρὸς τὸν ἀββᾶν Μωϋσῆν, αἰτῶν παρ᾿ αὐτοῦ λόγον. Λέγει αὐτῷ ὁ γέρων· Ὕπαγε, κάθισον εἰς τὸ κελλίον σου, καὶ τὸ κελλίον σου διδάσκει σε πάντα.", "A brother came to Scetis to abba Moses, asking him for a word. The old man says to him: “Go, sit in your cell, and your cell will teach you everything.”", "Ein Bruder kam nach Sketis zum Abbas Moses und bat ihn um ein Wort. Der Greis sagt zu ihm: „Geh, setz dich in deine Zelle, und deine Zelle wird dich alles lehren.“", "", "Один брат пришёл в Скит к авве Моисею, прося у него слова. Старец говорит ему: «Пойди, сиди в келье своей, и келья твоя научит тебя всему»."]]},
{"id": "greg43", "cat": "pat", "gr": "Ἐπιτάφιος εἰς τὸν μέγαν Βασίλειον καʹ", "title": {"ru": "Григорий Богослов: Надгробное слово Василию Великому, гл. 21", "en": "Gregory of Nazianzus: Funeral Oration for Basil the Great, ch. 21", "de": "Gregor von Nazianz: Grabrede auf Basilius den Großen, Kap. 21"}, "bl": {"ru": "Два пути в Афинах: христианская и «внешняя» наука. Григорий о студенческих годах с Василием.", "en": "Two roads in Athens: Christian and “outside” learning. Gregory on his student years with Basil.", "de": "Zwei Wege in Athen: christliche und „äußere“ Bildung. Gregor über die Studienjahre mit Basilius."}, "note": {"ru": "Текст по изданию Ж. Бернарди (Grégoire de Nazianze, Discours 42–43, Париж 1992), Слово 43, гл. 21, с сокращением; нумерация частей — как в учебном издании, часть 4 опущена. Григорий Назианзин (329–390) произнёс это слово в 382 году. Язык аттицизирующий, а не койне: сравнительные степени (τιμιωτέρα, βελτίους, εὐσεβεστέροις), много причастий (φέρουσα, σπουδάζοντας, ῥέων, σκαῖρον), перфектные причастия страдательного залога (πεπυκνωμένοις, πεφραγμένοις). Гиг — лидийский царь: по легенде у Платона («Государство», кн. II), он становился невидимым, повернув оправу перстня. Река, сладкая в морской воде, — Алфей; животное в огне — саламандра.", "en": "Text from J. Bernardi’s edition (Grégoire de Nazianze, Discours 42–43, Paris 1992), Oration 43, ch. 21, abridged; the section numbers follow the course handout, section 4 is omitted. Gregory of Nazianzus (329–390) delivered this oration in 382. The language is Atticising, not koine: comparatives (τιμιωτέρα, βελτίους, εὐσεβεστέροις), many participles (φέρουσα, σπουδάζοντας, ῥέων, σκαῖρον), perfect passive participles (πεπυκνωμένοις, πεφραγμένοις). Gyges was a Lydian king who, in the legend told by Plato (Republic II), became invisible by turning the bezel of his ring. The river that stays sweet in the sea is the Alpheus; the creature in the fire is the salamander.", "de": "Text nach der Ausgabe von J. Bernardi (Grégoire de Nazianze, Discours 42–43, Paris 1992), Rede 43, Kap. 21, gekürzt; die Abschnittszählung folgt dem Kursmaterial, Abschnitt 4 fehlt. Gregor von Nazianz (329–390) hielt diese Rede 382. Die Sprache ist attizistisch, nicht Koine: Komparative (τιμιωτέρα, βελτίους, εὐσεβεστέροις), viele Partizipien (φέρουσα, σπουδάζοντας, ῥέων, σκαῖρον), Partizipien Perfekt Passiv (πεπυκνωμένοις, πεφραγμένοις). Gyges war ein lydischer König, der nach der Legende bei Platon (Politeia II) unsichtbar wurde, wenn er die Fassung seines Ringes drehte. Der Fluss, der im Meer süß bleibt, ist der Alpheios; das Tier im Feuer ist der Salamander."}, "v": [["1", "Δύο μὲν ἐγνωρίζοντο ἡμῖν ὁδοί· ἡ μὲν πρώτη καὶ τιμιωτέρα, ἡ δὲ δευτέρα καὶ οὐ τοῦ ἴσου λόγου· ἥ τε πρὸς τοὺς ἱεροὺς ἡμῶν οἴκους καὶ τοὺς ἐκεῖσε διδασκάλους φέρουσα, καὶ ἡ πρὸς τοὺς ἔξωθεν παιδευτάς.", "Two roads were known to us: the first and more honourable, the second and not of equal worth — the one leading to our sacred houses and the teachers there, the other to the teachers from outside.", "Zwei Wege waren uns bekannt: der erste und ehrenvollere, der zweite und nicht von gleichem Wert — der eine, der zu unseren heiligen Häusern und den Lehrern dort führte, der andere zu den Lehrern von außen.", "", "Два пути были нам известны: первый и более почётный, второй — и не равного достоинства: один ведёт к нашим священным домам и тамошним учителям, другой — к внешним наставникам."], ["", "Τὰς ἄλλας δὲ τοῖς βουλομένοις παρήκαμεν ἑορτάς, θέατρα, πανηγύρεις, συμπόσια.", "The other roads we left to those who wanted them: festivals, theatres, assemblies, banquets.", "Die anderen überließen wir denen, die sie wollten: Feste, Theater, Volksfeste, Gelage.", "", "Прочие же пути мы оставили желающим: праздники, театры, народные собрания, пиршества."], ["2", "Οὐδὲν γὰρ οἶμαι τίμιον, ὃ μὴ πρὸς ἀρετὴν φέρει, μηδὲ ποιεῖ βελτίους τοὺς περὶ αὐτὸ σπουδάζοντας.", "For nothing, I think, is honourable which does not lead to virtue and does not make better those who devote themselves to it.", "Denn nichts, meine ich, ist ehrenwert, was nicht zur Tugend führt und die nicht besser macht, die sich darum bemühen.", "", "Ибо ничто, думаю, не почтенно, если оно не ведёт к добродетели и не делает лучше тех, кто им занимается."], ["", "Ἄλλοις μὲν οὖν ἄλλαι προσηγορίαι τινές εἰσιν, ἢ πατρόθεν ἢ οἴκοθεν, ἐκ τῶν ἰδίων ἐπιτηδευμάτων ἢ πράξεων· ἡμῖν δὲ τὸ μέγα πρᾶγμα καὶ ὄνομα, Χριστιανοὺς καὶ εἶναι καὶ ὀνομάζεσθαι·", "Others have other titles, from their father or from their family, from their own pursuits or deeds; but for us the great thing and the great name was both to be and to be called Christians.", "Andere haben andere Beinamen, vom Vater oder von der Familie her, nach ihren eigenen Beschäftigungen oder Taten; für uns aber war die große Sache und der große Name, Christen zu sein und so zu heißen.", "", "У других — иные прозвания: от отца или от рода, от собственных занятий или дел; для нас же великое дело и имя — и быть, и называться христианами."], ["3", "ᾧ πλέον ἐφρονοῦμεν ἢ τῇ στροφῇ τῆς σφενδονῆς ὁ Γύγης, εἴπερ μὴ μῦθος ἦν, ἐξ ἧς Λυδῶν ἐτυράννησεν […].", "In this we took more pride than Gyges in the turning of his ring — if that was not a myth — by which he became tyrant of the Lydians […].", "Darauf waren wir stolzer als Gyges auf das Drehen seines Ringes — wenn das nicht ein Mythos war —, durch das er Herrscher der Lyder wurde […].", "", "Этим мы гордились больше, чем Гиг поворотом перстня (если это не миф), благодаря которому он стал царём лидийцев […]."], ["5", "Εἴπω τι συντομώτερον· βλαβεραὶ μὲν τοῖς ἄλλοις Ἀθῆναι τὰ εἰς ψυχήν· οὐ γὰρ φαύλως τοῦτο ὑπολαμβάνεται τοῖς εὐσεβεστέροις·", "Let me put it more briefly: Athens is harmful to others in matters of the soul — and the more pious do not think so without reason;", "Ich will es kürzer sagen: Athen ist für andere schädlich in dem, was die Seele betrifft — und nicht ohne Grund nehmen das die Frömmeren an;", "", "Скажу короче: для других Афины вредны в том, что касается души, — и не напрасно так думают более благочестивые;"], ["", "καὶ γὰρ πλουτοῦσι τὸν κακὸν πλοῦτον εἴδωλα, μᾶλλον τῆς ἄλλης Ἑλλάδος, καὶ χαλεπὸν μὴ συναρπασθῆναι τοῖς τούτων ἐπαινέταις καὶ συνηγόροις·", "for the city is rich in an evil wealth, idols, more than the rest of Greece, and it is hard not to be carried away by their admirers and advocates.", "denn die Stadt ist reich an einem schlimmen Reichtum, an Götzenbildern, mehr als das übrige Griechenland, und es ist schwer, sich von ihren Bewunderern und Fürsprechern nicht mitreißen zu lassen.", "", "ведь Афины богаты худым богатством — идолами — больше всей прочей Эллады, и трудно не увлечься их почитателями и защитниками."], ["", "ἡμῖν δ’ οὐδεμία παρὰ τούτων ζημία τὴν διάνοιαν πεπυκνωμένοις καὶ πεφραγμένοις.", "But to us there was no harm from them, since our minds were closed up and fenced in.", "Uns aber erwuchs daraus kein Schaden, denn unser Sinn war verschlossen und umzäunt.", "", "Нам же не было от них никакого вреда: наш ум был крепко заперт и огражден."], ["6", "Τοὐναντίον μὲν οὖν, εἴ τι χρὴ καὶ παράδοξον εἰπεῖν, εἰς τὴν πίστιν ἐντεῦθεν ἐβεβαιώθημεν, καταμαθόντες αὐτῶν τὸ ἀπατηλὸν καὶ κίβδηλον, ἐνταῦθα δαιμόνων καταφρονήσαντες, οὗ θαυμάζονται δαίμονες.", "On the contrary — if one may say something paradoxical — it was there that we were confirmed in the faith: we saw through their deceit and falsehood and despised demons right where demons are admired.", "Im Gegenteil — wenn man auch etwas Paradoxes sagen darf —, gerade dort wurden wir im Glauben gefestigt: Wir durchschauten ihr Trügerisches und Unechtes und verachteten die Dämonen eben dort, wo Dämonen bewundert werden.", "", "Напротив, если можно сказать нечто неожиданное, именно там мы утвердились в вере: распознали их обман и подделку и презрели демонов там, где демонам дивятся."], ["", "Καὶ εἴ τις ἔστιν ἢ πιστεύεται ποταμός, δι’ ἅλμης ῥέων γλυκύς, ἢ ζῷον ἐν πυρὶ σκαῖρον, ᾧ τὰ πάντα ἁλίσκεται, τοῦτο ἦμεν ἡμεῖς ἐν πᾶσι τοῖς ἥλιξι.", "And if there is, or is believed to be, a river that flows sweet through salt water, or a creature that dances in the fire by which all things are consumed, that is what we were among all our peers.", "Und wenn es einen Fluss gibt oder man an ihn glaubt, der süß durch Salzwasser fließt, oder ein Tier, das im Feuer tanzt, von dem alles verzehrt wird, so waren wir das unter all unseren Altersgenossen.", "", "И если есть или считается, что есть, река, текущая сладкой сквозь солёную воду, или животное, пляшущее в огне, который всё пожирает, — такими были мы среди всех сверстников."]]},
{"id": "pray", "cat": "lit", "gr": "Προσευχαί", "title": {"ru": "Краткие молитвы", "en": "Short prayers", "de": "Kurze Gebete"}, "bl": {"ru": "Трисвятое, Иисусова молитва, малое славословие, пасхальный тропарь.", "en": "Trisagion, Jesus Prayer, Lesser Doxology, Paschal Troparion.", "de": "Trishagion, Jesusgebet, Kleine Doxologie, Ostertroparion."}, "note": {"ru": "Эти молитвы повторяются в каждой службе — хороший материал для заучивания наизусть. В Иисусовой молитве и Трисвятом много звательных форм.", "en": "These prayers recur in every service and are good material to learn by heart. The Jesus Prayer and the Trisagion are full of vocative forms.", "de": "Diese Gebete kehren in jedem Gottesdienst wieder und eignen sich gut zum Auswendiglernen. Jesusgebet und Trishagion sind voller Vokativformen."}, "v": [[{"ru": "Трисвятое", "en": "Trisagion", "de": "Trishagion"}, "", "", "", ""], ["", "Ἅγιος ὁ Θεός, Ἅγιος Ἰσχυρός, Ἅγιος Ἀθάνατος, ἐλέησον ἡμᾶς.", "Holy God, Holy Mighty, Holy Immortal, have mercy on us.", "Heiliger Gott, heiliger Starker, heiliger Unsterblicher, erbarme dich unser.", "", "Святой Боже, Святой Крепкий, Святой Бессмертный, помилуй нас."], [{"ru": "Иисусова молитва", "en": "Jesus Prayer", "de": "Jesusgebet"}, "", "", "", ""], ["", "Κύριε Ἰησοῦ Χριστέ, Υἱὲ τοῦ Θεοῦ, ἐλέησόν με τὸν ἁμαρτωλόν.", "Lord Jesus Christ, Son of God, have mercy on me, the sinner.", "Herr Jesus Christus, Sohn Gottes, erbarme dich meiner, des Sünders.", "", "Господи Иисусе Христе, Сыне Божий, помилуй меня, грешного."], [{"ru": "Малое славословие", "en": "Lesser Doxology", "de": "Kleine Doxologie"}, "", "", "", ""], ["", "Δόξα Πατρὶ καὶ Υἱῷ καὶ Ἁγίῳ Πνεύματι, καὶ νῦν καὶ ἀεὶ καὶ εἰς τοὺς αἰῶνας τῶν αἰώνων. Ἀμήν.", "Glory to the Father and to the Son and to the Holy Spirit, both now and ever, and to the ages of ages. Amen.", "Ehre sei dem Vater und dem Sohn und dem Heiligen Geist, jetzt und immerdar und in die Ewigkeiten der Ewigkeiten. Amen.", "", "Слава Отцу и Сыну и Святому Духу, и ныне, и всегда, и во веки веков. Аминь."], [{"ru": "Пасхальный тропарь", "en": "Paschal Troparion", "de": "Ostertroparion"}, "", "", "", ""], ["", "Χριστὸς ἀνέστη ἐκ νεκρῶν, θανάτῳ θάνατον πατήσας, καὶ τοῖς ἐν τοῖς μνήμασι ζωὴν χαρισάμενος.", "Christ is risen from the dead, trampling down death by death, and upon those in the tombs bestowing life.", "Christus ist auferstanden von den Toten, hat den Tod durch den Tod zertreten und denen in den Gräbern das Leben geschenkt.", "", "Христос воскрес из мёртвых, смертью смерть поправ и находящимся во гробах жизнь даровав."]]},
{"id": "phos", "cat": "lit", "gr": "Φῶς ἱλαρόν", "title": {"ru": "«Свете тихий», вечерний гимн", "en": "“O Gladsome Light”, the evening hymn", "de": "„Heiteres Licht“, der Abendhymnus"}, "bl": {"ru": "Древний гимн вечерни: звательный падеж и причастия аориста.", "en": "An ancient Vespers hymn: vocative case and aorist participles.", "de": "Ein alter Vesperhymnus: Vokativ und Partizipien des Aorists."}, "note": {"ru": "Один из древнейших христианских гимнов; поётся на вечерне при входе. Обратите внимание на причастия аориста ἐλθόντες, ἰδόντες и на субстантивированное причастие ὁ διδούς «дающий».", "en": "One of the oldest Christian hymns, sung at the entrance of Vespers. Note the aorist participles ἐλθόντες, ἰδόντες and the articular participle ὁ διδούς, “the one who gives”.", "de": "Einer der ältesten christlichen Hymnen, gesungen beim Einzug der Vesper. Man beachte die Partizipien Aorist ἐλθόντες, ἰδόντες und das substantivierte Partizip ὁ διδούς, „der Gebende“."}, "v": [["", "Φῶς ἱλαρὸν ἁγίας δόξης, ἀθανάτου Πατρός, οὐρανίου, ἁγίου, μάκαρος, Ἰησοῦ Χριστέ,", "O joyful light of the holy glory of the immortal Father, heavenly, holy, blessed, Jesus Christ:", "Heiteres Licht der heiligen Herrlichkeit des unsterblichen, himmlischen, heiligen, seligen Vaters, Jesus Christus:", "", "Свет радостный святой славы бессмертного Отца, небесного, святого, блаженного, Иисусе Христе,"], ["", "ἐλθόντες ἐπὶ τὴν ἡλίου δύσιν, ἰδόντες φῶς ἑσπερινόν, ὑμνοῦμεν Πατέρα, Υἱόν, καὶ Ἅγιον Πνεῦμα, Θεόν.", "having come to the setting of the sun, having seen the evening light, we praise Father, Son and Holy Spirit, God.", "da wir zum Untergang der Sonne gekommen sind und das Abendlicht sehen, besingen wir Vater, Sohn und Heiligen Geist, Gott.", "", "придя к закату солнца, увидев свет вечерний, воспеваем Отца, Сына и Святого Духа, Бога."], ["", "Ἄξιόν σε ἐν πᾶσι καιροῖς ὑμνεῖσθαι φωναῖς αἰσίαις, Υἱὲ Θεοῦ, ζωὴν ὁ διδούς· διὸ ὁ κόσμος σε δοξάζει.", "It is fitting at all times that you be praised with auspicious voices, O Son of God, giver of life; therefore the world glorifies you.", "Würdig ist es, dich zu allen Zeiten mit glückverheißenden Stimmen zu besingen, Sohn Gottes, der du Leben gibst; darum verherrlicht dich die Welt.", "", "Достоин Ты во все времена быть воспеваемым благоприятными голосами, Сыне Божий, подающий жизнь; потому мир Тебя славит."]]},
{"id": "akath", "cat": "lit", "gr": "Ἀκάθιστος ὕμνος", "title": {"ru": "Акафист Богородице: кондак, икосы 1, 2 и 24", "en": "Akathist Hymn: kontakion, oikoi 1, 2 and 24", "de": "Akathistos-Hymnus: Kontakion, Oikoi 1, 2 und 24"}, "bl": {"ru": "Τῇ ὑπερμάχῳ στρατηγῷ — гимн Города, спасённого от осады.", "en": "Τῇ ὑπερμάχῳ στρατηγῷ: the hymn of the City saved from siege.", "de": "Τῇ ὑπερμάχῳ στρατηγῷ: der Hymnus der vor der Belagerung geretteten Stadt."}, "note": {"ru": "Акафист — один из самых известных византийских гимнов (обычно датируется VI–VII вв.). По преданию, кондак Τῇ ὑπερμάχῳ связан с избавлением Константинополя от осады 626 года: ἡ Πόλις σου — это сам Город, который говорит о себе. Χαῖρε — повелительное от χαίρω, «радуйся». Текст по изданию К. А. Трипаниса (Fourteen Early Byzantine Cantica, Вена 1968): проимий II, икосы 1–2 и 24. 24 икоса образуют алфавитный акростих: Ἄγγελος (Α), Βλέπουσα (Β) … Ὦ πανύμνητε (Ω). Нечётные икосы заканчиваются хайретизмами («радуйся…») и рефреном Χαῖρε, νύμφη ἀνύμφευτε, чётные — рефреном Ἀλληλούϊα. Обратите внимание на причастия женского рода: λυτρωθεῖσα, ἔχουσα, βλέπουσα, τεκοῦσα, δεξαμένη.", "en": "The Akathist is one of the best-known Byzantine hymns (usually dated to the 6th–7th century). Tradition links the kontakion Τῇ ὑπερμάχῳ to the deliverance of Constantinople from the siege of 626: ἡ Πόλις σου is the City itself speaking. Χαῖρε is the imperative of χαίρω, “rejoice, hail”. Text from C. A. Trypanis’ edition (Fourteen Early Byzantine Cantica, Vienna 1968): prooimion II, oikoi 1–2 and 24. The 24 oikoi form an alphabetic acrostic: Ἄγγελος (Α), Βλέπουσα (Β) … Ὦ πανύμνητε (Ω). The odd oikoi end in chairetismoi (“hail…”) and the refrain Χαῖρε, νύμφη ἀνύμφευτε, the even ones in the refrain Ἀλληλούϊα. Note the feminine participles: λυτρωθεῖσα, ἔχουσα, βλέπουσα, τεκοῦσα, δεξαμένη.", "de": "Der Akathistos ist einer der bekanntesten byzantinischen Hymnen (meist ins 6.–7. Jh. datiert). Die Überlieferung verbindet das Kontakion Τῇ ὑπερμάχῳ mit der Rettung Konstantinopels aus der Belagerung von 626: ἡ Πόλις σου ist die Stadt selbst, die spricht. Χαῖρε ist der Imperativ von χαίρω, „freue dich, sei gegrüßt“. Text nach der Ausgabe von C. A. Trypanis (Fourteen Early Byzantine Cantica, Wien 1968): Prooimion II, Oikoi 1–2 und 24. Die 24 Oikoi bilden ein alphabetisches Akrostichon: Ἄγγελος (Α), Βλέπουσα (Β) … Ὦ πανύμνητε (Ω). Die ungeraden Oikoi enden mit Chairetismoi („freue dich …“) und dem Refrain Χαῖρε, νύμφη ἀνύμφευτε, die geraden mit dem Refrain Ἀλληλούϊα. Man beachte die femininen Partizipien: λυτρωθεῖσα, ἔχουσα, βλέπουσα, τεκοῦσα, δεξαμένη."}, "v": [[{"ru": "Кондак (проимий II)", "en": "Kontakion (prooimion II)", "de": "Kontakion (Prooimion II)"}, "", "", "", ""], ["", "Τῇ ὑπερμάχῳ στρατηγῷ τὰ νικητήρια, ὡς λυτρωθεῖσα τῶν δεινῶν εὐχαριστήρια ἀναγράφω σοι ἡ πόλις σου, θεοτόκε· ἀλλ’ ὡς ἔχουσα τὸ κράτος ἀπροσμάχητον, ἐκ παντοίων με κινδύνων ἐλευθέρωσον, ἵνα κράζω σοι· “Χαῖρε, νύμφη ἀνύμφευτε.”", "To you, our champion general, I, your City, rescued from terrors, inscribe the prizes of victory as thank-offerings, O Theotokos; but as you have invincible might, free me from all kinds of dangers, that I may cry to you: Hail, unwedded Bride!", "Dir, der für uns kämpfenden Heerführerin, weihe ich, deine Stadt, aus Schrecken befreit, die Siegespreise als Dankesgaben, o Gottesgebärerin; du aber, die du unbezwingbare Macht hast, befreie mich aus Gefahren aller Art, damit ich dir zurufe: Freue dich, unvermählte Braut!", "", "Поборнице-Воеводе победные песни и, как избавленный от бедствий, благодарственные посвящаю Тебе я, Град Твой, Богородица; но, как имеющая неодолимую державу, от всяческих опасностей освободи меня, чтобы я взывал к Тебе: «Радуйся, Невеста неневестная!»"], [{"ru": "Икос 1", "en": "Oikos 1", "de": "Oikos 1"}, "", "", "", ""], ["", "Ἄγγελος πρωτοστάτης οὐρανόθεν ἐπέμφθη εἰπεῖν τῇ θεοτόκῳ τὸ “χαῖρε”· καὶ σὺν τῇ ἀσωμάτῳ φωνῇ σωματούμενόν σε θεωρῶν, κύριε, ἐξίστατο καὶ ἵστατο κραυγάζων πρὸς αὐτὴν τοιαῦτα·", "An angel of the first rank was sent from heaven to say “Hail!” to the Theotokos; and beholding you, O Lord, taking a body at his bodiless voice, he was amazed and stood still, crying out to her thus:", "Ein Engel ersten Ranges wurde vom Himmel gesandt, der Gottesgebärerin das „Freue dich“ zu sagen; und als er sah, wie du, o Herr, auf sein körperloses Wort hin Leib annahmst, staunte er, stand still und rief ihr solches zu:", "", "Ангел первостоящий был послан с неба сказать Богородице: «Радуйся!» И, видя, как при бесплотном гласе Ты, Господи, воплощаешься, он изумлялся и стоял, взывая к Ней так:"], ["", "“Χαῖρε, δι’ ἧς ἡ χαρὰ ἐκλάμψει· χαῖρε, δι’ ἧς ἡ ἀρὰ ἐκλείψει·", "Hail, you through whom joy will shine forth; hail, you through whom the curse will vanish.", "Freue dich, durch die die Freude aufstrahlen wird; freue dich, durch die der Fluch vergehen wird.", "", "Радуйся, Ты, через Которую воссияет радость; радуйся, Ты, через Которую исчезнет проклятие."], ["", "χαῖρε, τοῦ πεσόντος Ἀδὰμ ἡ ἀνάκλησις· χαῖρε, τῶν δακρύων τῆς Εὔας ἡ λύτρωσις·", "hail, recall of fallen Adam; hail, deliverance from the tears of Eve;", "freue dich, Rückruf des gefallenen Adam; freue dich, Erlösung von den Tränen Evas;", "", "радуйся, падшего Адама воззвание; радуйся, слёз Евы избавление;"], ["", "χαῖρε, ὕψος δυσανάβατον ἀνθρωπίνοις λογισμοῖς· χαῖρε, βάθος δυσθεώρητον καὶ ἀγγέλων ὀφθαλμοῖς·", "hail, height hard to climb for human thoughts; hail, depth hard to behold even for the eyes of angels;", "freue dich, Höhe, für menschliche Gedanken schwer ersteigbar; freue dich, Tiefe, selbst für die Augen der Engel schwer zu schauen;", "", "радуйся, высота, неудобовосходимая для человеческих помыслов; радуйся, глубина, неудобозримая и для ангельских очей;"], ["", "χαῖρε, ὅτι ὑπάρχεις βασιλέως καθέδρα· χαῖρε, ὅτι βαστάζεις τὸν βαστάζοντα πάντα·", "hail, for you are the throne of the King; hail, for you carry him who carries all things;", "freue dich, denn du bist der Thron des Königs; freue dich, denn du trägst den, der alles trägt;", "", "радуйся, ибо Ты — престол Царя; радуйся, ибо Ты носишь Носящего всё;"], ["", "χαῖρε, ἀστὴρ ἐμφαίνων τὸν ἥλιον· χαῖρε, γαστὴρ ἐνθέου σαρκώσεως·", "hail, star that reveals the sun; hail, womb of the divine incarnation;", "freue dich, Stern, der die Sonne offenbart; freue dich, Schoß der göttlichen Fleischwerdung;", "", "радуйся, звезда, являющая солнце; радуйся, чрево Божественного воплощения;"], ["", "χαῖρε, δι’ ἧς νεουργεῖται ἡ κτίσις· χαῖρε, δι’ ἧς προσκυνεῖται ὁ πλάστης·", "hail, you through whom creation is renewed; hail, you through whom the Creator is worshipped;", "freue dich, durch die die Schöpfung erneuert wird; freue dich, durch die der Schöpfer angebetet wird;", "", "радуйся, Ты, через Которую обновляется творение; радуйся, Ты, через Которую поклоняются Творцу;"], ["", "χαῖρε, νύμφη ἀνύμφευτε.”", "hail, unwedded Bride!", "freue dich, unvermählte Braut!", "", "радуйся, Невеста неневестная!"], [{"ru": "Икос 2", "en": "Oikos 2", "de": "Oikos 2"}, "", "", "", ""], ["", "Βλέπουσα ἡ ἁγία ἑαυτὴν ἐν ἁγνείᾳ φησὶ τῷ Γαβριὴλ θαρσαλέως·", "The holy one, seeing herself in chastity, says boldly to Gabriel:", "Die Heilige, die sich in Reinheit sieht, spricht zuversichtlich zu Gabriel:", "", "Святая, видя себя в чистоте, дерзновенно говорит Гавриилу:"], ["", "“Τὸ παράδοξόν σου τῆς φωνῆς δυσπαράδεκτόν μου τῇ ψυχῇ φαίνεται· ἀσπόρου γὰρ συλλήψεως τὴν κύησιν προλέγεις κράζων· Ἀλληλούϊα.”", "“The strangeness of your words seems hard for my soul to accept: for you foretell the bearing of a child from a seedless conception, crying: Alleluia.”", "„Das Unerhörte deiner Rede scheint meiner Seele schwer anzunehmen; denn du sagst die Schwangerschaft aus samenloser Empfängnis voraus und rufst: Halleluja.“", "", "«Необычайное твоё слово кажется душе моей неудобоприемлемым: ибо ты предвозвещаешь чревоношение от бессеменного зачатия, взывая: Аллилуия»."], [{"ru": "Икос 24", "en": "Oikos 24", "de": "Oikos 24"}, "", "", "", ""], ["", "Ὦ πανύμνητε μήτηρ, ἡ τεκοῦσα τὸν πάντων ἁγίων ἁγιώτατον Λόγον, δεξαμένη τὴν νῦν προσφοράν,", "O all-praised Mother, who bore the Word, holiest of all the holy, accept this present offering,", "O allbesungene Mutter, die du das Wort geboren hast, das heiligste aller Heiligen, nimm die jetzige Gabe an,", "", "О всепетая Мати, родившая Слово, святейшее всех святых, приняв нынешнее приношение,"], ["", "ἀπὸ πάσης ῥῦσαι συμφορᾶς ἅπαντας καὶ τῆς μελλούσης λύτρωσαι κολάσεως τοὺς σοὶ βοῶντας· Ἀλληλούϊα.", "rescue all from every misfortune and redeem from the punishment to come those who cry to you: Alleluia.", "errette alle aus jedem Unglück und erlöse von der künftigen Strafe, die dir zurufen: Halleluja.", "", "избавь всех от всякой беды и от грядущей муки избави вопиющих Тебе: Аллилуия."]]},
{"id": "kassia", "cat": "lit", "gr": "Κασσιανῆς τροπάριον", "title": {"ru": "Тропарь Кассии (начало)", "en": "The Troparion of Kassia (opening)", "de": "Das Troparion der Kassia (Anfang)"}, "bl": {"ru": "Великая среда: грешница у ног Христа. Стихи поэтессы IX века.", "en": "Holy Wednesday: the sinful woman at Christ’s feet. Verses by a 9th-century poetess.", "de": "Heiliger Mittwoch: die Sünderin zu Füßen Christi. Verse einer Dichterin des 9. Jahrhunderts."}, "note": {"ru": "Кассия (Кассиана) — византийская поэтесса IX века, одна из немногих женщин, чьи гимны вошли в богослужение. Тропарь поётся в Великую среду. Обратите внимание на цепочку причастий женского рода: περιπεσοῦσα, αἰσθομένη, ἀναλαβοῦσα, ὀδυρομένη.", "en": "Kassia (Kassiani) was a 9th-century Byzantine poetess, one of the few women whose hymns entered the liturgy. The troparion is sung on Holy Wednesday. Note the chain of feminine participles: περιπεσοῦσα, αἰσθομένη, ἀναλαβοῦσα, ὀδυρομένη.", "de": "Kassia (Kassiani) war eine byzantinische Dichterin des 9. Jahrhunderts, eine der wenigen Frauen, deren Hymnen in die Liturgie eingingen. Das Troparion wird am Heiligen Mittwoch gesungen. Man beachte die Kette femininer Partizipien: περιπεσοῦσα, αἰσθομένη, ἀναλαβοῦσα, ὀδυρομένη."}, "v": [["", "Κύριε, ἡ ἐν πολλαῖς ἁμαρτίαις περιπεσοῦσα γυνή, τὴν σὴν αἰσθομένη θεότητα, μυροφόρου ἀναλαβοῦσα τάξιν, ὀδυρομένη μύρα σοι πρὸ τοῦ ἐνταφιασμοῦ κομίζει·", "Lord, the woman who had fallen into many sins, perceiving your divinity, takes up the role of a myrrh-bearer and, lamenting, brings you myrrh before your burial.", "Herr, die Frau, die in viele Sünden gefallen war, erkannte deine Gottheit, nahm die Rolle einer Myrrhenträgerin an und bringt dir klagend Myrrhe vor deinem Begräbnis.", "", "Господи, жена, впавшая во многие грехи, ощутив Твоё Божество, приняв на себя чин мироносицы, с рыданием приносит Тебе миро прежде погребения."], ["", "Οἴμοι, λέγουσα, ὅτι νύξ μοι ὑπάρχει οἶστρος ἀκολασίας, ζοφώδης τε καὶ ἀσέληνος, ἔρως τῆς ἁμαρτίας.", "“Woe is me,” she says, “for night is to me a frenzy of licentiousness, gloomy and moonless: the love of sin.”", "„Weh mir“, sagt sie, „denn die Nacht ist mir ein Rausch der Zügellosigkeit, finster und mondlos: die Liebe zur Sünde.“", "", "«Увы мне, — говорит она, — ибо ночь для меня — неистовство распутства, мрачная и безлунная любовь ко греху»."]]}
