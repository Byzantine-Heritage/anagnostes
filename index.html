en: {
  title:'Palaeography',
  intro:'How to read Greek manuscripts: majuscule and minuscule, abbreviated sacred names, ligatures, numbers and Byzantine dates, typical scribal errors.',
  ex:'Exercises',
  majT:'Majuscule and minuscule',
  majP:'Until the 9th century Greek books were written in majuscule: large separate letters, no spaces between words (scriptio continua), hardly any accents or breathings. In the 9th century minuscule appears, a small joined script with ligatures. It is faster and more economical, and by the end of the 10th century it has almost displaced majuscule, which survives in liturgical books. The oldest dated minuscule manuscript is the Uspensky Gospels of 835 (St Petersburg, National Library of Russia). Accents and breathings become standard in minuscule; the iota subscript spreads late, before that it was written on the line or left out.',
  spec:'Jn 1:1 in majuscule', toTexts:'Read the texts “as in a manuscript”',
  nsT:'Nomina sacra', nsP:'Sacred names were abbreviated to their first and last letter (sometimes also a middle one) with a line above. The custom goes back to early Christian papyri and survives on icons to this day: ΙϹ ΧϹ, ΜΡ ΘΥ. The final letter of the abbreviation changes with the case.',
  nsH:['Abbreviation','Word','Meaning'],
  abT:'Abbreviations and ligatures', abP:'In minuscule, frequent words and endings were replaced by signs, and neighbouring letters were joined into ligatures. Only signs that can be typed on a computer are shown here; manuscripts have many more, especially for the endings -ος, -ου, -ων, -ην.',
  abH:['Sign','Value','Explanation'],
  abR:[['ϗ','καί','abbreviation sign for “and”'],['ȣ','ου','ligature'],['ϛ','στ','ligature; the same shape is the numeral 6'],['@ΘΣ','θεός','line above the word: nomen sacrum'],['αʹ','1','keraia on the right: a number'],['͵α','1000','sign on the left: thousands'],['ϊ, ϋ','ι, υ','diaeresis on initial ι, υ: marks a separate vowel']],
  numT:'Numbers', numP:'Numbers were written with letters and the keraia sign ʹ. For 6, 90 and 900 old letters that had dropped out of the alphabet are used: ϛ (stigma; originally digamma), ϟ (koppa), ϡ (sampi). Thousands are marked with the sign ͵ on the left.',
  numRows:['units','tens','hundreds'],
  datT:'Dating', datP:'Byzantines counted years from the creation of the world (ἔτος κόσμου), and the year began on 1 September 5509 BC. For January–August subtract 5508, for September–December 5509. The indiction was usually given as well: the number of the year in a 15-year cycle, i.e. the remainder of the year divided by 15 (if 0, then 15).',
  errT:'Scribal errors',
  errL:[['Itacism.','ι, η, υ, ει, οι sounded the same and were confused: ἡμῖν and ὑμῖν, ἐκκλισία for ἐκκλησία.'],['ο / ω, αι / ε.','They were not distinguished in sound: θεώς, κέ for καί. Hence variants between future and subjunctive (-ομεν / -ωμεν).'],['Haplography.','Of two identical syllables or words only one is written.'],['Dittography.','A syllable, word or line is written twice.'],['Homoeoteleuton.','The scribe’s eye jumps from one ending to an identical one further down, and the text in between drops out.']],
  linkT:'Manuscripts online',
  links:[['Codex Sinaiticus','https://codexsinaiticus.org','a 4th-century majuscule Bible, with transcription.'],['DigiVatLib','https://digi.vatlib.it','digitised manuscripts of the Vatican Library.'],['Gallica','https://gallica.bnf.fr','Greek manuscripts of the Bibliothèque nationale de France.'],['Pinakes','https://pinakes.irht.cnrs.fr','database of Greek manuscripts: where a text is kept and which copies exist.']]
},
de: {
  title:'Paläographie',
  intro:'Wie man griechische Handschriften liest: Majuskel und Minuskel, abgekürzte heilige Namen, Ligaturen, Zahlen und byzantinische Datierung, typische Schreiberfehler.',
  ex:'Übungen',
  majT:'Majuskel und Minuskel',
  majP:'Bis zum 9. Jahrhundert schrieb man griechische Bücher in Majuskel: große, einzeln stehende Buchstaben ohne Wortabstände (scriptio continua), kaum Akzente oder Spiritus. Im 9. Jahrhundert entsteht die Minuskel, eine kleine, verbundene Schrift mit Ligaturen. Sie ist schneller und sparsamer und verdrängt die Majuskel bis zum Ende des 10. Jahrhunderts fast völlig; diese bleibt in liturgischen Büchern erhalten. Die älteste datierte Minuskelhandschrift ist das Uspenskij-Evangeliar von 835 (St. Petersburg, Russische Nationalbibliothek). In der Minuskel setzen sich Akzente und Spiritus durch; das Iota subscriptum verbreitet sich spät, vorher schrieb man es in die Zeile oder ließ es weg.',
  spec:'Joh 1,1 in Majuskel', toTexts:'Texte „wie in der Handschrift“ lesen',
  nsT:'Nomina sacra', nsP:'Heilige Namen wurden auf den ersten und letzten Buchstaben (manchmal auch einen mittleren) gekürzt und mit einem Strich darüber versehen. Der Brauch reicht bis in frühchristliche Papyri zurück und lebt auf Ikonen bis heute fort: ΙϹ ΧϹ, ΜΡ ΘΥ. Der Schlussbuchstabe der Abkürzung ändert sich mit dem Kasus.',
  nsH:['Abkürzung','Wort','Bedeutung'],
  abT:'Abkürzungen und Ligaturen', abP:'In der Minuskel wurden häufige Wörter und Endungen durch Zeichen ersetzt und benachbarte Buchstaben zu Ligaturen verbunden. Hier stehen nur Zeichen, die sich am Computer schreiben lassen; Handschriften kennen viel mehr, besonders für die Endungen -ος, -ου, -ων, -ην.',
  abH:['Zeichen','Wert','Erklärung'],
  abR:[['ϗ','καί','Kürzungszeichen für „und“'],['ȣ','ου','Ligatur'],['ϛ','στ','Ligatur; dieselbe Form dient als Zahl 6'],['@ΘΣ','θεός','Strich über dem Wort: Nomen sacrum'],['αʹ','1','Keraia rechts: eine Zahl'],['͵α','1000','Zeichen links: Tausender'],['ϊ, ϋ','ι, υ','Trema über anlautendem ι, υ: getrennter Vokal']],
  numT:'Zahlen', numP:'Zahlen schrieb man mit Buchstaben und dem Zeichen Keraia ʹ. Für 6, 90 und 900 dienen alte, aus dem Alphabet ausgeschiedene Buchstaben: ϛ (Stigma; ursprünglich Digamma), ϟ (Koppa), ϡ (Sampi). Tausender werden durch das Zeichen ͵ links markiert.',
  numRows:['Einer','Zehner','Hunderter'],
  datT:'Datierung', datP:'In Byzanz zählte man die Jahre seit Erschaffung der Welt (ἔτος κόσμου); das Jahr begann am 1. September 5509 v. Chr. Für Januar–August zieht man 5508 ab, für September–Dezember 5509. Meist wurde auch die Indiktion angegeben: die Nummer des Jahres in einem 15-jährigen Zyklus, also der Rest bei der Division des Jahres durch 15 (bei 0 gilt 15).',
  errT:'Schreiberfehler',
  errL:[['Itazismus.','ι, η, υ, ει, οι klangen gleich und wurden verwechselt: ἡμῖν und ὑμῖν, ἐκκλισία statt ἐκκλησία.'],['ο / ω, αι / ε.','Sie unterschieden sich nicht im Klang: θεώς, κέ statt καί. Daher Varianten zwischen Futur und Konjunktiv (-ομεν / -ωμεν).'],['Haplographie.','Von zwei gleichen Silben oder Wörtern wird nur eines geschrieben.'],['Dittographie.','Eine Silbe, ein Wort oder eine Zeile wird doppelt geschrieben.'],['Homoioteleuton.','Das Auge des Schreibers springt von einer Endung zu einer gleichen weiter unten, und der Text dazwischen fällt aus.']],
  linkT:'Handschriften online',
  links:[['Codex Sinaiticus','https://codexsinaiticus.org','eine Majuskelbibel des 4. Jahrhunderts, mit Transkription.'],['DigiVatLib','https://digi.vatlib.it','digitalisierte Handschriften der Vatikanischen Bibliothek.'],['Gallica','https://gallica.bnf.fr','griechische Handschriften der Bibliothèque nationale de France.'],['Pinakes','https://pinakes.irht.cnrs.fr','Datenbank griechischer Handschriften: wo ein Text liegt und welche Abschriften es gibt.']]
}

function genText(T0, max){

/* paradigm drills: every Greek cell of a table becomes a form to identify or to produce */
function drillCells(sec){
  const out = [];
  sec.t.forEach(t => {
    if (t.nodrill) return;
    const cap = T(t.cap);
    t.rows.forEach(r => r.slice(1).forEach((c, j) => {
      if (!c || !hasGreek(c) || hasLatinOrCyr(c)) return;
      out.push({t, cap, form:c, row:r[0], col:j, label:T(r[0]) + ', ' + T(t.head[j + 1])});
    }));
  });
  return out;
}
/* distractors from the same table, preferring the same row or column */
function nearPick(c, sib, key, bad, n){
  const near = uniq(sib.filter(x => (x.row === c.row || x.col === c.col) && !bad.includes(x[key])).map(x => x[key]));
  const far = uniq(sib.filter(x => !bad.includes(x[key]) && !near.includes(x[key])).map(x => x[key]));
  const a = sample(near, Math.min(n, near.length));
  return a.concat(sample(far, n - a.length));
}
function genDrill(secs, n){
  const cells = secs.flatMap(drillCells), ex = [];
  shuffle(cells.slice()).forEach(c => {
    if (ex.length >= n) return;
    const sib = cells.filter(x => x.t === c.t);
    const labels = uniq(sib.filter(x => x.form === c.form).map(x => x.label));
    const note = c.form + ' — ' + c.cap + ': ' + labels.join('; ');
    if (ex.length % 2 === 0){
      const wrong = nearPick(c, sib, 'label', labels.concat(sib.filter(x => x.form === c.form).map(x => x.label)), 3);
      if (wrong.length === 3) ex.push(mcEx({label:U('lForms'), prompt:U('pParse', c.cap), q:c.form, qG:true, a:c.label, opts:shuffle([c.label].concat(wrong)), note}));
    } else {
      const wrong = nearPick(c, sib, 'form', [c.form], 3);
      if (wrong.length === 3) ex.push(mcEx({label:U('lForms'), prompt:U('pMake'), q:c.cap + ': ' + c.label, a:c.form, opts:shuffle([c.form].concat(wrong)), note}));
    }
  });
  const tabs = uniq(cells.map(c => c.t));
  sample(tabs, secs.length > 1 ? 2 : 1).forEach(t => {
    const pool = cells.filter(c => c.t === t), pairs = [];
    shuffle(pool.slice()).forEach(c => {
      if (pairs.length < 4 && pool.filter(x => x.form === c.form).length === 1) pairs.push([c.form, c.label]);
    });
    if (pairs.length >= 3) ex.push(matchEx(pairs));
  });
  return shuffle(ex);
}

const CORE_E = CORE.map((r, i) => ({id:String(i), g:r[0], pos:r[1], sub:!!r[2], en:r[3], ru:r[4], de:r[5], l:(bare(r[0]).toLowerCase().match(/[α-ω]/) || ['α'])[0]}));
const CORE_Q = CORE_E.filter(e => e.pos !== 'form');
const CM = e => LANG === 'ru' ? e.ru : LANG === 'de' ? e.de : e.en;
const POS_GROUP = {v:'v', n:'n', adj:'a'};
const posG = p => POS_GROUP[p] || 'o';
P.vk = P.vk || {}; P.vm = P.vm || {};
let VS = {count:20, dir:'gm', src:'all', letters:[], pos:'all'};
try { const s = JSON.parse(localStorage.getItem('anagnostes.vocab')); if (s && typeof s === 'object') Object.assign(VS, s); } catch(e) {}
if (!Array.isArray(VS.letters)) VS.letters = [];
function saveVS(){ try { localStorage.setItem('anagnostes.vocab', JSON.stringify(VS)); } catch(e) {} }
const vnorm = s => bare(s).toLowerCase().replace(/ς/g, 'σ');
function vocabPool(){
  return CORE_Q.filter(e => (VS.pos === 'all' || posG(e.pos) === VS.pos)
    && (VS.src !== 'letters' || VS.letters.includes(e.l))
    && (VS.src !== 'mist' || P.vm[e.id])
    && (VS.src !== 'new' || !P.vk[e.id]));
}
const vtoks = s => s.toLowerCase().replace(/\([^)]*\)|\[[^\]]*\]/g, ' ').split(/[,;:\/]| or | или | oder /).map(x => x.trim()).filter(x => x.length > 1);
function vclash(a, b){ const A = new Set(vtoks(CM(a)).concat(vtoks(a.en))); return vtoks(CM(b)).concat(vtoks(b.en)).some(t => A.has(t)); }
function vocabDistract(e, n){
  const used = new Set([CM(e)]), gs = new Set([e.g]), out = [];
  const tryList = list => { for (const x of shuffle(list)) { if (out.length >= n) break; if (x.id === e.id || used.has(CM(x)) || gs.has(x.g) || vclash(e, x)) continue; out.push(x); used.add(CM(x)); gs.add(x.g); } };
  tryList(CORE_Q.filter(x => posG(x.pos) === posG(e.pos)));
  if (out.length < n) tryList(CORE_Q.slice());
  return out;
}
function vocabEx(e, dir){
  const ds = vocabDistract(e, 3), m = CM(e);
  if (dir === 'gm') return mcEx({label:U('lVocab'), prompt:U('pWordMean'), q:e.g, qG:true, a:m, opts:shuffle([m].concat(ds.map(CM))), note:e.g + ' — ' + m, vid:e.id});
  return mcEx({label:U('lVocab'), prompt:U('pWordSay'), q:m, a:e.g, opts:shuffle([e.g].concat(ds.map(x => x.g))), note:e.g + ' — ' + m, vid:e.id});
}
function genVocab(){
  const pool = vocabPool(), n = Math.min(Math.max(1, VS.count | 0), pool.length);
  return sample(pool, n).map(e => vocabEx(e, VS.dir === 'mix' ? (Math.random() < .5 ? 'gm' : 'mg') : VS.dir));
}
function startVocab(){
  const ex = genVocab(); if (!ex.length) return;
  openSession({title:() => U('vTitle'), exercises:ex, regen:genVocab});
}
function vocabMark(id, ok, first){
  if (ok && first){ P.vk[id] = 1; if (P.vm[id] && --P.vm[id] <= 0) delete P.vm[id]; }
  else if (!ok){ P.vm[id] = (P.vm[id] || 0) + 1; delete P.vk[id]; }
  saveP();
}
function vseg(name, val, items, label){
  return '<div class="seg" role="group" aria-label="' + esc(label) + '">' + items.map(([v, l, dis]) => '<button type="button" data-v-' + name + '="' + v + '" aria-pressed="' + (String(val) === String(v)) + '"' + (dis ? ' disabled' : '') + '>' + esc(l) + '</button>').join('') + '</div>';
}
function vocabMeta(){
  const pool = vocabPool().length, n = Math.min(Math.max(1, VS.count | 0), pool);
  const b = $('#v-start'), m = $('#v-meta');
  if (b){ b.disabled = !pool; b.textContent = pool ? U('vStart', n) : U('begin'); }
  if (m) m.textContent = pool ? U('vPool', pool) : U('vNone');
  $$('[data-v-count]').forEach(x => x.setAttribute('aria-pressed', String(+x.dataset.vCount === VS.count)));
}
function drawVocabSetup(){
  const box = $('#vsetup'); if (!box) return;
  const mist = Object.keys(P.vm).length;
  box.innerHTML =
    '<div class="vrow"><p class="label">' + esc(U('vCount')) + '</p><div class="vcount">' +
      vseg('count', VS.count, [[10,'10'],[20,'20'],[50,'50'],[100,'100']], U('vCount')) +
      '<label class="vnum"><span>' + esc(U('vOwn')) + '</span><input id="v-count" type="number" min="1" max="' + CORE_Q.length + '" value="' + VS.count + '" inputmode="numeric"></label></div></div>' +
    '<div class="vrow"><p class="label">' + esc(U('vDir')) + '</p>' + vseg('dir', VS.dir, [['gm', U('vDirGM')], ['mg', U('vDirMG')], ['mix', U('vDirMix')]], U('vDir')) + '</div>' +
    '<div class="vrow"><p class="label">' + esc(U('vWords')) + '</p>' + vseg('src', VS.src, [['all', U('vAll')], ['letters', U('vLetters')], ['new', U('vNew')], ['mist', U('vMistakes', mist), !mist]], U('vWords')) +
      (VS.src === 'letters' ? '<div class="vletters" role="group" aria-label="' + esc(U('vLetters')) + '">' + GR_ABC.map(l => '<button type="button" data-v-let="' + l + '" aria-pressed="' + VS.letters.includes(l) + '">' + l + '</button>').join('') + '</div>' : '') + '</div>' +
    '<div class="vrow"><p class="label">' + esc(U('vPos')) + '</p>' + vseg('pos', VS.pos, [['all', U('vAll')], ['v', U('posV')], ['n', U('posN')], ['a', U('posA')], ['o', U('posO')]], U('vPos')) + '</div>' +
    '<div class="vact"><button class="btn" id="v-start" type="button" data-v-start></button><span class="meta" id="v-meta"></span></div>';
  const ci = $('#v-count');
  ci.addEventListener('input', () => { const v = parseInt(ci.value, 10); if (v > 0){ VS.count = Math.min(v, CORE_Q.length); saveVS(); vocabMeta(); } });
  ci.addEventListener('change', () => { ci.value = VS.count; });
  vocabMeta();
}
function drawVocabList(){
  const el = $('#vlist'); if (!el) return;
  const q = (R.vq || '').trim(), qn = vnorm(q), ql = q.toLowerCase();
  const list = !q ? CORE_E : CORE_E.filter(e => hasGreek(q) ? vnorm(e.g).includes(qn) : (CM(e) + ' ' + e.en).toLowerCase().includes(ql));
  let h = '', cur = '';
  list.forEach(e => {
    if (e.l !== cur){ if (cur) h += '</ul>'; cur = e.l; h += '<h3 class="cv-h" id="cvh-' + cur + '">' + cur + '</h3><ul class="cvl">'; }
    const st = P.vm[e.id] ? ' m' : P.vk[e.id] ? ' k' : '';
    h += '<li class="cv' + (e.sub ? ' sub' : '') + '"><span class="cv-g">' + esc(e.g) + '</span><span class="cv-m">' + rich(CM(e)) + '</span><i class="cv-s' + st + '" aria-hidden="true"></i></li>';
  });
  if (cur) h += '</ul>';
  el.innerHTML = h || '<p class="meta">' + esc(U('vNothing')) + '</p>';
  const f = $('#v-found'); if (f) f.textContent = q ? U('vFound', list.length) : '';
}
function renderVocab(){
  const known = Object.keys(P.vk).length, mist = Object.keys(P.vm).length;
  main.innerHTML = '<header class="intro-h"><h1>' + esc(U('vTitle')) + '</h1><p>' + esc(U('vIntro')) + '</p></header>' +
    '<p class="vstat meta">' + esc(U('vKnown', known, CORE_Q.length)) + (mist ? ' · ' + esc(U('vMistN', mist)) : '') + '</p>' +
    '<div class="vbar" aria-hidden="true"><i style="width:' + (100 * known / CORE_Q.length).toFixed(1) + '%"></i></div>' +
    '<section class="vbox" id="vsetup" aria-label="' + esc(U('vSetup')) + '"></section>' +
    '<section class="tsec"><h2>' + esc(U('vList')) + '</h2>' +
      '<div class="vsearch"><input id="v-q" type="search" autocomplete="off" spellcheck="false" placeholder="' + esc(U('vSearch')) + '" aria-label="' + esc(U('vSearch')) + '" value="' + esc(R.vq || '') + '"><span class="meta" id="v-found"></span></div>' +
      '<div class="vjump">' + GR_ABC.map(l => '<button type="button" data-v-jump="' + l + '">' + l + '</button>').join('') + '</div>' +
      '<div id="vlist"></div></section>' +
    '<p class="foot">' + esc(U('vSource')) + '</p>';
  drawVocabSetup(); drawVocabList();
  const qi = $('#v-q');
  qi.addEventListener('input', () => { R.vq = qi.value; drawVocabList(); });
}
function vocabClick(t){
  const d = t.dataset;
  if (d.vCount){ VS.count = +d.vCount; saveVS(); const ci = $('#v-count'); if (ci) ci.value = VS.count; vocabMeta(); return true; }
  if (d.vDir){ VS.dir = d.vDir; saveVS(); drawVocabSetup(); return true; }
  if (d.vSrc){ VS.src = d.vSrc; if (VS.src === 'letters' && !VS.letters.length) VS.letters = ['α']; saveVS(); drawVocabSetup(); return true; }
  if (d.vLet){ const i = VS.letters.indexOf(d.vLet); if (i < 0) VS.letters.push(d.vLet); else VS.letters.splice(i, 1); saveVS(); t.setAttribute('aria-pressed', String(i < 0)); vocabMeta(); return true; }
  if (d.vPos){ VS.pos = d.vPos; saveVS(); drawVocabSetup(); return true; }
  if (t.hasAttribute('data-v-start')){ startVocab(); return true; }
  if (d.vJump){ const h = document.getElementById('cvh-' + d.vJump); if (h) h.scrollIntoView({block:'start', behavior:reduced() ? 'auto' : 'smooth'}); return true; }
  return false;
}

/* ---------- gloss sheet ---------- */
const gloss = $('#gloss');
function openGloss(btn){
  $$('.w.on').forEach(w => w.classList.remove('on'));
  btn.classList.add('on');
  const e = LEX[btn.dataset.k]; if (!e) return;
  gloss.innerHTML = '<div class="gl-in"><div class="gl-head"><span class="gl-form">' + esc(btn.dataset.f) + '</span><button class="gl-x" type="button" aria-label="' + esc(U('close')) + '">×</button></div>' +
    '<dl><dt>' + esc(U('glLemma')) + '</dt><dd>' + rich(tLemma(e.lemma)) + '</dd><dt>' + esc(U('glMeaning')) + '</dt><dd>' + rich(M(e.gloss)) + '</dd><dt>' + esc(U('glForm')) + '</dt><dd>' + rich(tParse(e.parse)) + '</dd></dl></div>';
  gloss.classList.add('open'); gloss.setAttribute('aria-hidden', 'false');
  $('.gl-x', gloss).onclick = closeGloss;
}
function closeGloss(){ gloss.classList.remove('open'); gloss.setAttribute('aria-hidden', 'true'); $$('.w.on').forEach(w => w.classList.remove('on')); }

/* ---------- theme ---------- */
const root = document.documentElement, themeBtn = $('#theme');
try { const t = localStorage.getItem('anagnostes.theme'); if (t === 'dark' || t === 'light') root.setAttribute('data-theme', t); } catch(e) {}
function effTheme(){
  const t = root.getAttribute('data-theme');
  if (t === 'dark' || t === 'light') return t;
  return window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}
function syncTheme(){
  const dark = effTheme() === 'dark', label = dark ? U('light') : U('dark');
  themeBtn.setAttribute('aria-pressed', String(dark)); themeBtn.title = label; themeBtn.setAttribute('aria-label', label);
}
themeBtn.onclick = () => {
  const next = effTheme() === 'dark' ? 'light' : 'dark';
  const apply = () => { root.setAttribute('data-theme', next); try { localStorage.setItem('anagnostes.theme', next); } catch(e) {} syncTheme(); };
  if (!document.startViewTransition || reduced()) return apply();
  const r = themeBtn.getBoundingClientRect(), x = r.left + r.width / 2, y = r.top + r.height / 2;
  const rad = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));
  try {
    const vt = document.startViewTransition(apply);
    vt.ready.then(() => root.animate({clipPath:['circle(0px at ' + x + 'px ' + y + 'px)', 'circle(' + rad + 'px at ' + x + 'px ' + y + 'px)']}, {duration:560, easing:'cubic-bezier(.2,.75,.2,1)', pseudoElement:'::view-transition-new(root)'})).catch(() => {});
  } catch(e) { apply(); }
};
if (window.matchMedia){ const mq = matchMedia('(prefers-color-scheme: dark)'); if (mq.addEventListener) mq.addEventListener('change', syncTheme); }

/* ---------- tab indicator ---------- */
const tabInd = $('.tab-ind');
function moveInd(){
  const b = $('.tab[aria-current="page"]'); if (!b || !tabInd) return;
  tabInd.style.width = b.offsetWidth + 'px';
  tabInd.style.transform = 'translate(' + b.offsetLeft + 'px,' + (b.offsetTop + b.offsetHeight - 2) + 'px)';
  if (!tabInd.classList.contains('ready')) requestAnimationFrame(() => requestAnimationFrame(() => tabInd.classList.add('ready')));
}
window.addEventListener('resize', moveInd);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(moveInd);

/* ---------- manuscript in the margins ---------- */
(function(){
  const ms = $('#ms'); if (!ms) return;
  const low = s => s.toLowerCase().replace(/σ(?=$|[^Ͱ-Ͽἀ-῿])/g, 'ς');
  const minus = text => text.split(/\s+/).map(t => {
    const p = splitTok(t); if (!p.core) return esc(p.pre + p.post);
    const ns = nomen(p.core);
    const br = /^[αεηιουω]/i.test(bare(p.core)) ? low(p.core.normalize('NFD').replace(/[\u0300\u0301\u0342]/g, '').normalize('NFC'))[0] : '';
    const w = ns ? '<span class="ns">' + esc(br ? br + low(ns).slice(1) : low(ns)) + '</span>' : /^και[ὶί]?$|^καί$|^καὶ$/i.test(p.core) ? 'ϗ' : esc(low(p.core));
    return esc(p.pre) + w + esc(p.post);
  }).join(' ');
  const para = id => {
    const t = TEXTS.find(x => x.id === id); if (!t) return '';
    const body = t.v.filter(v => v[1]).map(v => minus(v[1])).join(' ');
    return '<p>' + body.replace(/^([^<\s])/, (m, c) => '<b>' + c.toUpperCase() + '</b>') + '</p>';
  };
  const col = (cls, ids) => '<div class="ms-col ' + cls + '"><div class="ms-in">' + ids.map(para).join('') + '</div></div>';
  ms.innerHTML = col('ms-l', ['jn1', 'jn3', 'mt6', 'jn14', 'lk1', 'jn10']) + col('ms-r', ['ps50', 'ps90', 'phos', 'ps22', 'akath', 'is6', 'ps140']);
  const ins = $$('.ms-in', ms);
  let ticking = false;
  window.addEventListener('scroll', () => {
    if (ticking || reduced() || getComputedStyle(ms).position !== 'fixed') return;
    ticking = true;
    requestAnimationFrame(() => { const y = -Math.min(scrollY * .08, innerHeight * .5); ins.forEach(el => { el.style.transform = 'translate3d(0,' + y + 'px,0)'; }); ticking = false; });
  }, {passive:true});
})();

/* ---------- language switch ---------- */
function applyLang(){
  root.setAttribute('lang', LANG);
  $$('.tab').forEach(b => { b.textContent = U('tab_' + b.dataset.tab); });
  $('.tabs').setAttribute('aria-label', U('nav'));
  $('.lang').setAttribute('aria-label', U('langLabel'));
  $$('[data-lang]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === LANG)));
  syncTheme();
  moveInd();
}
$$('[data-lang]').forEach(b => b.onclick = () => {
  if (b.dataset.lang === LANG) return;
  LANG = b.dataset.lang;
  try { localStorage.setItem('anagnostes.lang', LANG); } catch(e) {}
  applyLang(); route();
});

/* ---------- routing & events ---------- */
const TABS = ['lessons','texts','vocab','paleo','tables'];
function route(){
  const h = (location.hash || '').slice(1);
  const tab = TABS.includes(h) ? h : 'lessons';
  $$('.tab').forEach(b => { if (b.dataset.tab === tab) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
  closeGloss();
  if (tab === 'lessons') renderLessons(); else if (tab === 'texts') renderTexts(); else if (tab === 'vocab') renderVocab(); else if (tab === 'paleo') renderPaleo(); else renderTables();
  updateStats();
  moveInd();
  replay(main, 'main-in');
}
$$('.tab').forEach(b => b.onclick = () => {
  if (b.dataset.tab === 'texts') R.text = null;
  if (location.hash === '#' + b.dataset.tab) route(); else location.hash = b.dataset.tab;
  window.scrollTo(0, 0);
});
window.addEventListener('hashchange', route);
main.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  if (vocabClick(t)) return;
  if (t.dataset.start) return startLesson(t.dataset.start);
  if (t.hasAttribute('data-review')) return startReview();
  if (t.dataset.catpractice) return startCategory(t.dataset.catpractice);
  if (t.hasAttribute('data-uncial')){ R.text = 'jn1'; R.mode = 'uncial'; if (location.hash === '#texts') route(); else location.hash = 'texts'; window.scrollTo(0, 0); return; }
  if (t.dataset.openText){ R.text = t.dataset.openText; R.mode = R.mode === 'uncial' ? 'side' : R.mode; if (location.hash === '#texts') route(); else location.hash = 'texts'; window.scrollTo(0, 0); return; }
  if (t.dataset.text){ R.text = t.dataset.text; renderTexts(); replay(main, 'main-in'); window.scrollTo(0, 0); return; }
  if (t.hasAttribute('data-back')){ R.text = null; closeGloss(); renderTexts(); replay(main, 'main-in'); return; }
  if (t.dataset.cat){ R.cat = t.dataset.cat; renderTexts(); replay($('.tlist'), 'main-in'); return; }
  if (t.hasAttribute('data-cs')){ R.cs = !R.cs; closeGloss(); renderTexts(); return; }
  if (t.dataset.mode){
    const prev = R.mode; R.mode = t.dataset.mode;
    if (prev === 'uncial' || R.mode === 'uncial'){ closeGloss(); renderTexts(); return; }
    const vEl = $('#verses'); vEl.className = 'verses mode-' + R.mode + (vEl.classList.contains('show-cs') ? ' show-cs' : '');
    $$('[data-mode]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode === R.mode)));
    if (!reduced() && vEl.animate) vEl.animate([{opacity:.3}, {opacity:1}], {duration:320, easing:'ease-out'});
    return;
  }
  if (t.dataset.practice) return startText(t.dataset.practice);
  if (t.dataset.drill) return startDrill(t.dataset.drill);
  if (t.dataset.toc){ const el = document.getElementById(t.dataset.toc); if (el) el.scrollIntoView({behavior:reduced() ? 'auto' : 'smooth', block:'start'}); return; }
  if (t.classList.contains('w')) return openGloss(t);
});
document.addEventListener('keydown', e => {
  if (!S){ if (e.key === 'Escape') closeGloss(); return; }
  if (e.key === 'Escape'){ closeSession(); return; }
  if (e.key === 'Enter'){ const a = $('#s-act'); if (a && !a.disabled){ e.preventDefault(); a.click(); } return; }
  if (S.state === 'q' && !S.checked && /^[1-9]$/.test(e.key)){
    const btns = $$('[data-opt]', sInner).filter(b => !b.classList.contains('ghost'));
    const b = btns[+e.key - 1]; if (b){ e.preventDefault(); b.click(); }
  }
});

applyLang();
route();
})();
</script>
